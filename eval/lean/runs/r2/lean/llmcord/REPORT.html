pt-5.2\", \"claude-sonnet-5\"]\n+    }\n+  }\n+}\ndiff --git a/router_policy.py b/router_policy.py\nnew file mode 100644\nindex 0000000..4488f0e\n--- /dev/null\n+++ b/router_policy.py\n@@ -0,0 +1,6 @@\n+# router-migrate compiled policy (generated by `router-migrate apply --decisions` from router.policy.json; do not edit, re-run apply)\n+# The vendored router_runtime.py imports this module. Delete it (or set ROUTER_MIGRATE_POLICY=off) for v1 behaviour.\n+import json\n+\n+POLICY = json.loads('{\"features\":{\"llmcord.py:on_message\":{\"fallbacks\":[\"gpt-5.2\",\"claude-sonnet-5\"]}},\"version\":1}')\n+POLICY_HASH = '1a1310c541c577d2d65f66a67f1e3476feb925930251939387176c1c6be7089d'","files":[".gitignore","Dockerfile","router.policy.json","router_policy.py"],"lines":54,"truncated":false},"results":[],"model_change":true,"in_session":null,"actions":["approve","dismiss","postpone"],"waiting":true},{"id":"i3","kind":"improvement","title":"Cap a stalled provider at 60 seconds","summary":"provider_timeout 60 for this feature, so a provider that stops streaming fails in a minute instead of hanging on the OpenAI SDK's 600s default.","calls":["llmcord.py:287"],"level":"quick-win","built":true,"gains":"Bounded failure on a path a human is watching: Discord stops showing the bot as typing after a minute of silence instead of up to ten, and the slot in the bot's event loop is released. 60s is idle time between streamed events, which is an order of magnitude above a healthy stream.","loses":"A generation that genuinely goes quiet for more than 60 seconds now ends in a 504 and a partial reply instead of eventually completing.","price":"no change; a timed-out attempt is still billed for what it produced.","why":"The app sets no timeout anywhere and swallows the exception, so a stalled provider is invisible except as a bot that never answers. If this is applied together with i1, both keys belong in the one llmcord.py:on_message entry of router.policy.json followed by `router-migrate policy`.","commit":"47414dc","branch":"router-migrate/improve/reply-timeout","depends_on":["m1"],"excludes":[],"status":"proposed","etag":"d417c9140d6f","request":null,"stale":false,"due":false,"checked":[{"check":"simulator","label":null,"result":"pass","detail":"check --run tests/route_check.py on the branch: 1 valid /v1/responses with the compiled policy loaded","source":"agent","samples":null},{"check":"tests","label":null,"result":"pass","detail":"compileall + import llmcord (policy-only change)","source":"agent","samples":null},{"check":"tests","result":"pass","detail":"2 passed on this branch; before: 2 passed (same as before)","source":"check"},{"check":"router-live","result":"not-run","source":"check","label":null,"detail":"not checked live by the agent"}],"flags":[],"diff":{"ref":"router-migrate/improve/reply-timeout","how":"git diff router-migrate/migration...router-migrate/improve/reply-timeout","error":null,"text":" .gitignore         | 2 ++\n Dockerfile         | 2 +-\n router.policy.json | 8 ++++++++\n router_policy.py   | 6 ++++++\n 4 files changed, 17 insertions(+), 1 deletion(-)\n\ndiff --git a/.gitignore b/.gitignore\nindex 1d61d1e..9715be2 100644\n--- a/.gitignore\n+++ b/.gitignore\n@@ -14,3 +14,5 @@\n \n !tests/\n !tests/*.py\n+\n+!router.policy.json\ndiff --git a/Dockerfile b/Dockerfile\nindex 1211aff..f146bfa 100644\n--- a/Dockerfile\n+++ b/Dockerfile\n@@ -8,6 +8,6 @@ COPY requirements.txt ./\n \n RUN pip install --no-cache-dir -r requirements.txt\n \n-COPY llmcord.py router_runtime.py config.yaml ./\n+COPY llmcord.py router_runtime.py router_policy.py router.policy.json config.yaml ./\n \n CMD [\"python\", \"llmcord.py\"]\ndiff --git a/router.policy.json b/router.policy.json\nnew file mode 100644\nindex 0000000..8ba4c7a\n--- /dev/null\n+++ b/router.policy.json\n@@ -0,0 +1,8 @@\n+{\n+  \"version\": 1,\n+  \"features\": {\n+    \"llmcord.py:on_message\": {\n+      \"provider_timeout\": 60\n+    }\n+  }\n+}\ndiff --git a/router_policy.py b/router_policy.py\nnew file mode 100644\nindex 0000000..3b57d9c\n--- /dev/null\n+++ b/router_policy.py\n@@ -0,0 +1,6 @@\n+# router-migrate compiled policy (generated by `router-migrate apply --decisions` from router.policy.json; do not edit, re-run apply)\n+# The vendored router_runtime.py imports this module. Delete it (or set ROUTER_MIGRATE_POLICY=off) for v1 behaviour.\n+import json\n+\n+POLICY = json.loads('{\"features\":{\"llmcord.py:on_message\":{\"provider_timeout\":60}},\"version\":1}')\n+POLICY_HASH = '06c5e3d9858f47c8c7877f04b2f6685cd49ef61d93250f0cd17e591f35e9ee07'","files":[".gitignore","Dockerfile","router.policy.json","router_policy.py"],"lines":54,"truncated":false},"results":[],"model_change":false,"in_session":null,"actions":["approve","dismiss","postpone"],"waiting":true},{"id":"i4","kind":"improvement","title":"Default to a cheaper chat model","summary":"Ship config.yaml with gpt-5.1 or gpt-5.6-luna as the first model instead of gpt-5.5, the most expensive OpenAI id in the catalog.","calls":["llmcord.py:287"],"level":"quick-win","built":false,"gains":"The default is what most operators run, and gpt-5.5 is $5/$30 per 1M with reasoning_effort: high on a snarky brief-answer chat bot. gpt-5.1 is $1.25/$10 (4x cheaper in, 3x out), gpt-5.6-luna is $0.20/$1.20 (25x in, 25x out); both are Flex-eligible and still vision models, so images keep working. A 5k-token chain with a 300-token reply costs about $0.034 at gpt-5.5, $0.009 at gpt-5.1, $0.0014 at gpt-5.6-luna.","loses":"answers will differ - a smaller model is worse at long reply chains and at the config's high reasoning effort, and this is a taste call about the bot's voice that an operator should make, not a safe default swap.","price":"gpt-5.1 $1.25/$10, gpt-5.6-luna $0.20/$1.20 vs gpt-5.5 $5/$30 per 1M (catalog, live).","why":"I did not build this: nothing offline measures reply quality, the model is one line of the operator's own config, and the /model command already lets an admin switch at runtime. Worth a human picking a number knowing the multiples.","commit":null,"branch":null,"depends_on":[],"excludes":[],"status":"proposed","etag":"a8d22739e697","request":null,"stale":false,"due":false,"checked":[{"check":"price","label":null,"result":"info","detail":"router-migrate levers gpt-5.5 and the live catalog: same-family rows gpt-5.4 $2.5/$15, gpt-5.2 $1.75/$14, gpt-5.1 $1.25/$10, gpt-5.6-luna $0.20/$1.20","source":"agent","samples":null},{"check":"other","label":"Check","result":"not-run","source":"check","detail":"proposed, not built yet: the apply session builds it after you approve, and the check runs then"},{"check":"router-live","result":"not-run","source":"check","label":null,"detail":"not checked live by the agent"},{"check":"side-by-side","result":"not-run","source":"check","label":null,"detail":"answers will differ; no side-by-side samples"}],"flags":[],"diff":null,"results":[],"model_change":true,"in_session":null,"actions":["approve","dismiss","postpone"],"waiting":true},{"id":"i5","kind":"improvement","title":"Label spend per Discord server","summary":"Add metadata (guild id, channel id, the requesting user) to Router-bound requests so spend can be read per server instead of as one bucket.","calls":["llmcord.py:287"],"level":"change","built":false,"gains":"Every request today carries one label, llmcord.py:on_message, so Router's spend views cannot say which server or which person is spending. Responses takes up to 16 short labels per request, and `user` and `product` are special keys for Ramp spend management: with them, a bot shared across servers can be charged back, rate-limited by cost, or have a noisy channel found in one query.","loses":"Discord ids reach Router's usage records, which is a (small) new data flow about who is talking to the bot; and the labels have to be added only when Router is active, since a non-OpenAI provider would reject unknown body fields.","price":"no change; metadata is free.","why":"This is the observability half of 'one key for all traffic' and it is cheap - a dict built from new_msg. It needs code rather than router.policy.json, because policy metadata is static per feature while the useful labels are per request, and it must be conditional on RAMP_ROUTER_API_KEY so the Ollama path keeps a clean body.","commit":null,"branch":null,"depends_on":["m1"],"excludes":[],"status":"proposed","etag":"8f7a4a62e809","request":null,"stale":false,"due":false,"checked":[{"check":"other","label":null,"result":"not-run","detail":"proposal only; ROUTER.md 6.4 - Responses stores up to 16 labels, Messages forwards only user_id","source":"agent","samples":null},{"check":"other","label":"Check","result":"not-run","source":"check","detail":"proposed, not built yet: the apply session builds it after you approve, and the check runs then"},{"check":"router-live","result":"not-run","source":"check","label":null,"detail":"not checked live by the agent"}],"flags":[],"diff":null,"results":[],"model_change":false,"in_session":null,"actions":["approve","dismiss","postpone"],"waiting":true},{"id":"i6","kind":"improvement","title":"Budget the chain in tokens, not characters","summary":"Trim the reply chain with Router's free /v1/messages/count_tokens instead of guessing with max_text characters and max_messages.","calls":["llmcord.py:287"],"level":"change","built":false,"gains":"The caps are 25 messages, 100,000 characters each and 5 images, so a long thread can send tens of thousands of tokens and cost real money per reply at gpt-5.5 ($5 per 1M input) with no way for the operator to bound it. count_tokens is free on Router and exact for Anthropic-served models, so the bot could drop the oldest turns until the request fits a token budget and say so in the warning embed it already renders ('Only using last N messages').","loses":"An extra round trip (free, but latency) before each reply, and the count is an estimate for models Anthropic does not serve, so the budget needs headroom.","price":"no change: count_tokens is free; the point is to cap what the generation costs.","why":"Characters are a poor proxy for tokens across the vendors llmcord supports (and useless for images), and the existing warning machinery means the user-visible half of this is already built. It is a contained change to the chain-building loop, but it changes which messages the model sees, so it deserves a human's eye on the budget number.","commit":null,"branch":null,"depends_on":["m1"],"excludes":[],"status":"proposed","etag":"f6541c2b1778","request":null,"stale":false,"due":false,"checked":[{"check":"other","label":null,"result":"not-run","detail":"proposal only; ROUTER.md 2 - count_tokens is served and free, with x-router-token-count-source saying exact or estimated","source":"agent","samples":null},{"check":"other","label":"Check","result":"not-run","source":"check","detail":"proposed, not built yet: the apply session builds it after you approve, and the check runs then"},{"check":"router-live","result":"not-run","source":"check","label":null,"detail":"not checked live by the agent"}],"flags":[],"diff":null,"results":[],"model_change":false,"in_session":null,"actions":["approve","dismiss","postpone"],"waiting":true},{"id":"r1","kind":"improvement","title":"Pick the model per channel, not per process","summary":"Replace the single global curr_model and the per-provider base_url/api_key table with a catalog id chosen per channel (and defaulted per server), now that one key serves every vendor.","calls":["llmcord.py:287"],"level":"rework","built":false,"gains":"Today one admin's /model switch changes the model for every server, channel and DM the bot is in, and a new vendor means a new provider block and a new key in .env. On Router, 'which vendor' stops being a deployment decision: the config collapses to a list of catalog ids with their parameters, /model becomes a per-channel setting, and a support channel can run claude-sonnet-5 while a joke channel runs gpt-5.6-luna at 1/25th the input price. It d of a policy entry keyed by a stack frame: a cache key per conversation, a fallback list chosen for the model in use, fallback_timeout and timeout_before_headers for a user who is watching a stream, Flex on or off per channel, reasoning summaries and text.verbosity, and Responses' own web_search (measured $0.011 a search on gpt-4o-mini) instead of OpenRouter's vendor-specific tool. It also drops the translation layer out of the request path.","loses":"A second streaming loop to maintain - Responses' events are not chat chunks - and the vendored runtime's automatic provider fallback no longer covers that branch, so the app owns 'Router is down' itself. Local servers and OpenRouter keep the old path, so the file grows a fork.","price":"no change to model prices; it is the levers, not the rates.","why":"This is the honest end state of a Router-native llmcord, but it is only worth it after i1-i3 prove the levers matter for this app, and it trades llmcord's single simple loop for two. Proposing it rather than building it.","commit":null,"branch":null,"depends_on":["m1"],"excludes":[],"status":"proposed","etag":"2d7f8cc54606","request":null,"stale":false,"due":false,"checked":[{"check":"other","label":null,"result":"not-run","detail":"proposal only; ROUTER.md 5, 6.1-6.7 - every Router-only field is Responses-only","source":"agent","samples":null},{"check":"other","label":"Check","result":"not-run","source":"check","detail":"proposed, not built yet: the apply session builds it after you approve, and the check runs then"},{"check":"router-live","result":"not-run","source":"check","label":null,"detail":"not checked live by the agent"}],"flags":[],"diff":null,"results":[],"model_change":false,"in_session":null,"actions":["approve","dismiss","postpone"],"waiting":true},{"id":"d1","kind":"needs-decision","title":"Flex pricing or predictable reply latency","summary":"The account's Flex default halves cost on Flex-eligible OpenAI models but can add seconds to a reply a human is
