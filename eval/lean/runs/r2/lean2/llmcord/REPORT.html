cord.py:get_openai_client","source":"agent","samples":null},{"check":"side-by-side","label":null,"result":"pass","detail":"the final embed colour through Router is #1f8b4c (EMBED_COLOR_COMPLETE), so the translated stream still reports a clean finish_reason; reasoning_effort=high and verbosity=medium from config.yaml are translated to reasoning.effort and text.verbosity","source":"agent","samples":null},{"check":"tests","label":null,"result":"pass","detail":"repo suite: 2 passed (compileall + import llmcord)","source":"agent","samples":null},{"check":"tests","result":"pass","detail":"2 passed on the migration branch; before: 2 passed (same as before)","source":"check"},{"check":"router-live","label":null,"result":"pass","source":"check","detail":"4 live request(s) through Router recorded, 4 ok (features: llmcord.py:on_message)"},{"check":"other","label":"Route","result":"pass","detail":"1 call seen going through Router (route truth)","source":"check"}],"flags":[],"diff":{"ref":"d126fd9","how":"git show --stat --patch d126fd9","error":null,"text":"commit d126fd9ae40207f54ee9c058ce438b70ba1780f0\nAuthor: Sanjith Sambath \u003csanjith.sambath07@gmail.com\u003e\nDate:   Wed Oct 14 21:35:16 2026 -0400\n\n    Route the Discord reply client through Router\n    \n    The one LLM call this bot makes (the streamed Discord reply) now goes through\n    the vendored Router runtime: when RAMP_ROUTER_API_KEY is set, requests to\n    api.openai.com for a Router catalog model are translated to Router's\n    /v1/responses (stream included) and fall back to OpenAI if Router refuses.\n    With no key set, nothing changes.\n    \n    Other configured providers (openrouter, x-ai, google, azure, local servers)\n    keep going to their own hosts, unchanged.\n    \n    tests/smoke_on_message.py drives on_message with a stubbed Discord layer so\n    the real call site can be exercised against Router:\n      router-migrate check --run \"python tests/smoke_on_message.py\" [--live]\n---\n llmcord.py        |    9 +-\n router_runtime.py | 1422 +++++++++++++++++++++++++++++++++++++++++++++++++++++\n 2 files changed, 1430 insertions(+), 1 deletion(-)\n\ndiff --git a/llmcord.py b/llmcord.py\nindex 23d2d20..c920fb4 100644\n--- a/llmcord.py\n+++ b/llmcord.py\n@@ -14,6 +14,13 @@ from dotenv import load_dotenv\n import httpx\n from openai import AsyncOpenAI\n import yaml\n+try:  # router-migrate: route LLM traffic through Ramp's Router when RAMP_ROUTER_API_KEY is set\n+    from .router_runtime import wrap_openai as _router_wrap_openai\n+except ImportError:  # router-migrate: module executed as a script\n+    try:\n+        from router_runtime import wrap_openai as _router_wrap_openai\n+    except ImportError:  # router-migrate: runtime not importable from here; this module keeps its original behavior\n+        _router_wrap_openai = lambda c, *a, **k: c  # noqa: E731\n \n load_dotenv()\n \n@@ -153,7 +160,7 @@ async def on_message(new_msg: discord.Message) -\u003e None:\n \n     base_url = provider_config[\"base_url\"]\n     api_key = provider_config.get(\"api_key\", \"sk-no-key-required\")\n-    openai_client = AsyncOpenAI(base_url=base_url, api_key=api_key)\n+    openai_client = _router_wrap_openai(AsyncOpenAI(base_url=base_url, api_key=api_key))\n \n     model_parameters = config[\"models\"].get(provider_slash_model, None)\n \ndiff --git a/router_runtime.py b/router_runtime.py\nnew file mode 100644\nindex 0000000..076854e\n--- /dev/null\n+++ b/router_runtime.py\n@@ -0,0 +1,1422 @@\n+# router_runtime.py (vendored by router-migrate; safe to read, edit or delete)\n+#\n+# Routes this codebase's OpenAI / Anthropic SDK traffic through Ramp's Router (https://router.com) when\n+# RAMP_ROUTER_API_KEY is set. When it is not set, every function here returns its input unchanged.\n+#\n+# How: an httpx transport placed under the SDK client (installed in place, so the client's proxies, mounts, headers and\n+# hooks all stay). It sends requests Router can serve to Router and forwards everything else to the original provider\n+# untouched:\n+#   POST .../chat/completions  -\u003e POST {router}/v1/responses   (request + response + SSE stream translated back)\n+#   POST .../responses         -\u003e POST {router}/v1/responses   (store dropped; previous_response_id chains kept in-process)\n+#   POST .../v1/messages       -\u003e POST {router}/v1/messages    (Anthropic, model id mapped)\n+#   anything else (embeddings, images, audio, files, models, unknown models, n\u003e1, logprobs, seed, beta headers,\n+#   provider-side vector stores/files) -\u003e original provider\n+# If Router rejects a request before generating (unknown/unsupported parameter, model not available to this key, 501),\n+# the original request is sent to the provider instead, once.\n+# Each Router request carries metadata.feature = \"\u003cfile\u003e:\u003cfunction\u003e\" of the calling code (ROUTER_MIGRATE_FEATURE_TAG=off\n+# disables it; it sends a repo-relative path and function name).\n+# Env: RAMP_ROUTER_API_KEY (required to activate), RAMP_ROUTER_BASE_URL (default https://api.router.com),\n+#      ROUTER_MIGRATE_DISABLE=1 (kill switch), ROUTER_MIGRATE_MODEL_MAP='{\"old-model\":\"router-id\"}',\n+#      ROUTER_MIGRATE_SERVICE_TIER (unset: Router's account default, Flex where offered; set a tier to force it everywhere),\n+#      ROUTER_MIGRATE_FALLBACK=0 (surface Router errors instead of retrying on the provider).\n+# The provider key (OPENAI_API_KEY / ANTHROPIC_API_KEY) must stay configured: SDK constructors require it, and requests\n+# Router cannot serve still go to the provider.\n+import json\n+import os\n+import re\n+import sys\n+import threading\n+import time\n+import uuid\n+from collections import OrderedDict\n+\n+import importlib\n+\n+# openai-python \u003c= 2.x and anthropic use `httpx`; openai-python \u003e= 3 uses `httpx2` (same API). The transport classes are built\n+# for whichever library each client actually uses.\n+_LIBS = {}\n+\n+\n+def _lib(name):\n+    if name not in _LIBS:\n+        try:\n+            _LIBS[name] = importlib.import_module(name)\n+        except ImportError:\n+            _LIBS[name] = None\n+    return _LIBS[name]\n+\n+\n+httpx = _lib(\"httpx\") or _lib(\"httpx2\")\n+\n+__all__ = [\"active\", \"wrap_openai\", \"wrap_anthropic\", \"wrap_langchain\", \"http_client\", \"async_http_client\", \"install_openai_module\"]\n+VERSION = \"0.1.0\"\n+\n+# --- catalog (generated from GET /v1/models by router-migrate; refresh with `router-migrate apply --live`) -------\n+# id -\u003e [owned_by, temperature_supported, reasoning_supported]\n+CATALOG = {}  # filled below by _load_catalog()\n+ALIASES = {}\n+DATED = {}  # dated provider snapshot -\u003e catalog id, only where Router itself reported the equivalence\n+_CATALOG_JSON = r\"\"\"{\"aliases\":{\"accounts/fireworks/models/deepseek-v4p1-flash\":\"deepseek-v4.1-flash\",\"accounts/fireworks/models/glm-5p3\":\"glm-5p3\",\"accounts/fireworks/models/glm-5p3-flash\":\"glm-5p3-flash\",\"accounts/fireworks/models/gpt-oss-120b\":\"gpt-oss-120b\",\"accounts/fireworks/models/kimi-k3\":\"kimi-k3\",\"accounts/fireworks/models/minimax-m3\":\"minimax-m3\",\"accounts/fireworks/models/nemotron-3-u \u2026\n+\n+_OPENAI_HOSTS = (\"api.openai.com\",)\n+_ANTHROPIC_HOSTS = (\"api.anthropic.com\",)\n+_SKIP_FRAMES = (\"site-packages\", \"dist-packages\", os.sep + \"lib\" + os.sep + \"python\", \"router_runtime\", \"\u003cfrozen\")\n+\n+\n+def _load_catalog():\n+    try:\n+        d = json.loads(_CATALOG_JSON)\n+    except ValueError:\n+        d = {}\n+    for mid, row in (d.get(\"models\") or {}).items():\n+        CATALOG[mid] = row\n+    ALIASES.update(d.get(\"aliases\") or {})\n+    DATED.update(d.get(\"dated\") or {})\n+\n+\n+_load_catalog()\n+\n+\n+def active():\n+    off = (os.environ.get(\"ROUTER_MIGRATE_DISABLE\") or \"\").strip().lower() in (\"1\", \"true\", \"yes\", \"on\")\n+    return bool(os.environ.get(\"RAMP_ROUTER_API_KEY\")) and not off\n+\n+\n+def _feature_tags_on():\n+    return (os.environ.get(\"ROUTER_MIGRATE_FEATURE_TAG\") or \"\").strip().lower() not in (\"0\", \"off\", \"false\", \"no\")\n+\n+\n+def _base():\n+    b = (os.environ.get(\"RAMP_ROUTER_BASE_URL\") or \"https://api.router.com\").rstrip(\"/\")\n+    return b[:-3] if b.endswith(\"/v1\") else b\n+\n+\n+def resolve_model(name):\n+    \"\"\"Router id for a model name, or None when Router cannot serve that exact model (then the provider keeps it).\"\"\"\n+    if not isinstance(name, str) or not name:\n+        return None\n+    try:\n+        override = json.loads(os.environ.get(\"ROUTER_MIGRATE_MODEL_MAP\") or \"{}\")\n+    except ValueError:\n+        override = {}\n+    if name in override:\n+        return override[name] or None\n+    if name in CATALOG:\n+        return name\n+    if name in ALIASES:\n+        return ALIASES[name]\n+    ci = next((k for k in CATALOG if k.lower() == name.lower()), None)  # e.g. MiniMax-M3 -\u003e minimax-m3\n+    return ci or DATED.get(name)\n+\n+\n+def _feature():\n+    \"\"\"'\u003crelative file\u003e:\u003cfunction\u003e' of the first stack frame that belongs to this codebase (ROUTER_MIGRATE_FEATURE_TAG=off disables).\"\"\"\n+    if not _feature_tags_on():\n+        return None\n+    f = sys._getframe(1)\n+    cwd = os.getcwd()\n+    while f is not None:\n+        fn = f.f_code.co_filename\n+        if not any(s in fn for s in _SKIP_FRAMES):\n+            rel = os.path.relpath(fn, cwd) if fn.startswith(cwd) else os.path.basename(fn)\n+            return (\"%s:%s\" % (rel, f.f_code.co_name))[:200]\n+        f = f.f_back\n+    return None\n+\n+\n+# ------------------------------------------------------------------------------------------------ translation\n+class Untranslatable(Exception):\n+    \"\"\"Raised when a request uses something Router cannot serve; the request then goes to the original provider.\"\"\"\n+\n+\n+def _text_of(content):\n+    if isinstance(content, str):\n+        return content\n+    if isinstance(content, list):\n+        return \"\".join(p.get(\"text\", \"\") for p in content if isinstance(p, dict) and p.get(\"type\") in (\"text\", \"input_text\", \"output_text\"))\n+    return \"\" if content is None else str(content)\n+\n+\n+def _user_parts(content):\n+    if isinstance(content, str) or content is None:\n+        return content or \"\"\n+    parts = []\n+    for p in content:\n+        t = p.get(\"type\") if isinstance(p, dict) else None\n+        if t == \"text\":\n+            parts.append({\"type\": \"input_text\", \"text\": p.get(\"text\", \"\")})\n+        elif t == \"image_url\":\n+            iu = p.get(\"image_url\")\n+            url = iu.get(\"url\") if isinstance(iu, dict) else iu\n+            part = {\"type\": \"input_image\", \"image_url\": url}\n+            if isinstance(iu, dict) and iu.get(\"detail\"):\n+                part[\"detail\"] = iu[\"detail\"]\n+            parts.append(part)\n+        elif t == \"file\":\n+            f = p.get(\"file\") or {}\n+            part = {\"type\": \"input_file\"}\n+            if f.get(\"file_id\"):\n+                raise Untranslatable(\"file_id\")  # files live on the provider account; Router cannot see them\n+            for k in (\"file_data\", \"filename\"):\n+                if f.get(k):\n+                    part[k] = f[k]\n+            parts.append(part)\n+        else:  # input_audio and anything newer: Router cannot take it\n+            raise Untranslatable(\"content part %r\" % t)\n+    return parts\n+\n+\n+def chat_to_responses(body, router_model, owned_by, feature):\n+    \"\"\"Chat Completions request -\u003e Router Responses request. Returns (new_body, context for the reply).\"\"\"\n+    unsupported = [k for k in (\"audio\", \"modalities\", \"prediction\", \"web_search_options\", \"logit_bias\", \"functions_call_mode\") if body.get(k)]\n+    # not measured as accepted by Router, or no exact Responses equivalent: keep these calls on the provider unchanged\n+    unsupported += [\"seed\"] if body.get(\"seed\") is not None else []\n+    unsupported += [\"presence_penalty\"] if body.get(\"presence_penalty\") not in (None, 0) else []  # 0 is the default: dropped\n+    mot = body.get(\"max_completion_tokens\") or body.get(\"max_tokens\")\n+    if mot is not None and int(mot) \u003c 16:\n+        unsupported.append(\"max_tokens\u003c16\")  # Responses minimum is 16; clamping would change output length\n+    # a participant name is model-visible; on a tool result it only repeats the tool's name (the output is keyed by call id)\n+    if any(isinstance(m, dict) and m.get(\"name\") and m.get(\"role\") not in (\"function\", \"tool\") for m in body.get(\"messages\") or []):\n+        unsupported.append(\"message name\")\n+    tc0 = body.get(\"tool_choice\")\n+    if isinstance(tc0, dict) and tc0.get(\"type\") not in (None, \"function\"):\n+        unsupported.append(\"tool_choice %s\" % tc0.get(\"type\"))\n+    if (body.get(\"n\") or 1) != 1:\n+        unsupported.append(\"n\")\n+    if body.get(\"logprobs\") or body.get(\"top_logprobs\"):\n+        unsupported.append(\"logprobs\")\n+    if unsupported:\n+        raise Untranslatable(\",\".join(unsupported))\n+    info = CATALOG.get(router_model) or {}\n+    items = []\n+    call_ids = {}\n+    for i, m in enumerate(body.get(\"messages\") or []):\n+        role = m.get(\"role\")\n+        if role in (\"system\", \"developer\"):\n+            items.append({\"role\": role, \"content\": _text_of(m.get(\"content\"))})\n+        elif role == \"user\":\n+            items.append({\"role\": \"user\", \"content\": _user_parts(m.get(\"content\"))})\n+        elif role == \"assistant\":\n+            text = _text_of(m.get(\"content\"))\n+            refusal = m.get(\"refusal\") or \"\".join(p.get(\"refusal\", \"\") for p in (m.get(\"content\") if isinstance(m.get(\"content\"), list) else [])\n+                                                  if isinstance(p, dict) and p.get(\"type\") == \"refusal\")\n+            if refusal:\n+                parts = ([{\"type\": \"output_text\", \"text\": text}] if text else []) + [{\"type\": \"refusal\", \"refusal\": refusal}]\n+                items.append({\"role\": \"assistant\", \"content\": parts})\n+            elif text:\n+                items.append({\"role\": \"assistant\", \"content\": text})\n+            for tc in m.get(\"tool_calls\") or []:\n+                if tc.get(\"type\", \"function\") != \"function\":\n+                    raise Untranslatable(\"assistant tool_call type %r\" % tc.get(\"type\"))\n+                fn = tc.get(\"function\") or {}\n+                items.append({\"type\": \"function_call\", \"call_id\": tc.get(\"id\"), \"name\": fn.get(\"name\"),\n+                              \"arguments\": fn.get(\"arguments\") if isinstance(fn.get(\"arguments\"), str) else json.dumps(fn.get(\"arguments\") or {})})\n+            fc = m.get(\"function_call\")  # legacy functions API\n+            if fc:\n+                cid = \"call_legacy_%d\" % i\n+                call_ids[fc.get(\"name\")] = cid\n+                items.append({\"type\": \"function_call\", \"call_id\": cid, \"name\": fc.get(\"name\"), \"arguments\": fc.get(\"arguments\") or \"{}\"})\n+        elif role == \"tool\":\n+            items.append({\"type\": \"function_call_output\", \"call_id\": m.get(\"tool_call_id\"), \"output\": _text_of(m.get(\"content\"))})\n+        elif role == \"function\":\n+            items.append({\"type\": \"function_call_output\", \"call_id\": call_ids.get(m.get(\"name\"), \"call_legacy\"), \"output\": _text_of(m.get(\"content\"))})\n+        else:\n+            raise Untranslatable(\"role %r\" % role)\n+    out = {\"model\": router_model, \"input\": items}\n+    if mot is not None:\n+        out[\"max_output_tokens\"] = int(mot)\n+    temp_ok = info.get(\"t\") is not False\n+    for k in (\"temperature\", \"top_p\"):\n+        if body.get(k) is not None and temp_ok:\n+            out[k] = body[k]\n+    for k in (\"frequency_penalty\", \"parallel_tool_calls\", \"user\", \"service_tier\", \"prompt_cache_key\", \"safety_identifier\"):\n+        if body.get(k) is not None:\n+            out[k] = body[k]\n+    tools = []\n+    for t in body.get(\"tools\") or []:\n+        if t.get(\"type\") == \"function\":\n+            fn = t.get(\"function\") or {}\n+            nt = {\"type\": \"function\", \"name\": fn.get(\"name\"), \"parameters\": fn.get(\"parameters\") or {\"type\": \"object\", \"properties\": {}}}\n+            if fn.get(\"description\"):\n+                nt[\"description\"] = fn[\"description\"]\n+            nt[\"strict\"] = bool(fn.get(\"strict\"))  # Responses defaults tools to strict; Chat Completions does not\n+            tools.append(nt)\n+        else:\n+            raise Untranslatable(\"tool type %r\" % t.get(\"type\"))\n+    for fn in body.get(\"functions\") or []:  # legacy functions API\n+        tools.append({\"type\": \"function\", \"name\": fn.get(\"name\"), \"description\": fn.get(\"description\", \"\"),\n+                      \"parameters\": fn.get(\"parameters\") or {\"type\": \"object\", \"properties\": {}}, \"strict\": False})\n+    if tools:\n+        out[\"tools\"] = tools\n+    tc = body.get(\"tool_choice\", body.get(\"function_call\"))\n+    if isinstance(tc, dict):\n+        name = (tc.get(\"function\") or {}).get(\"name\") or tc.get(\"name\")\n+        out[\"tool_choice\"] = {\"type\": \"function\", \"name\": name}\n+    elif tc in (\"auto\", \"none\", \"required\"):\n+        out[\"tool_choice\"] = tc\n+    rf = body.get(\"response_format\")\n+    if isinstance(rf, dict) and rf.get(\"type\") in (\"json_object\", \"json_schema\"):\n+        if rf[\"type\"] == \"json_object\":\n+            fmt = {\"type\": \"json_object\"}\n+        else:\n+            js = rf.get(\"json_schema\") or {}\n+            fmt = {\"type\": \"json_schema\", \"name\": js.get(\"name\") or \"response\", \"schema\": js.get(\"schema\") or {}}\n+            for k in (\"strict\", \"description\"):\n+                if js.get(k) is not None:\n+                    fmt[k] = js[k]\n+        out[\"text\"] = {\"format\": fmt}\n+    if body.get(\"verbosity\"):\n+        out.setdefault(\"text\", {})[\"verbosity\"] = body[\"verbosity\"]\n+    effort = body.get(\"reasoning_effort\")\n+    if effort and info.get(\"r\"):\n+        if not (owned_by == \"anthropic\" and out.get(\"max_output_tokens\", 4096) \u003c 1100):  # Claude needs room for thinking [measured]\n+            out[\"reasoning\"] = {\"effort\": effort}\n+    stops = body.get(\"stop\")\n+    stops = [stops] if isinstance(stops, str) else [s for s in (stops or []) if s]\n+    if stops and owned_by != \"openai\":\n+        out[\"stop\"] = stops  # honored by non-OpenAI models [measured]; OpenAI models 501, so emulated client-side below\n+    meta = dict(body.get(\"metadata\") or {})\n+    if feature and \"feature\" not in meta and len(meta) \u003c 16:  # metadata is capped at 16 keys\n+        meta[\"feature\"] = feature\n+    if meta:\n+        out[\"metadata\"] = {k: str(v)[:512] for k, v in meta.items()}\n+    if owned_by == \"anthropic\" and \"prompt_cache_key\" not in out and feature:\n+        out[\"prompt_cache_key\"] = feature  # Claude via Responses does not cache without it [measured]\n+    if body.get(\"stream\"):\n+        out[\"stream\"] = True\n+    _service_tier(out)\n+    ctx = {\"stops\": stops if owned_by == \"openai\" else [], \"include_usage\": bool((body.get(\"stream_options\") or {}).get(\"include_usage\")),\n+           \"model\": body.get(\"model\"), \"legacy_functions\": bool(body.get(\"functions\"))}\n+    return out, ctx\n+\n+\n+def _service_tier(out):\n+    \"\"\"No tier is forced: Router's account default (Flex, where the model has it) applies. Latency guardrails come from the\n+    compiled policy (provider_timeout; service_tier only where a feature's latency need was judged). ROUTER_MIGRATE_SERVICE_TIER\n+    sets one tier for every routed call when the operator wants that ('auto' or unset: the account default).\"\"\"\n+    tier = (os.environ.get(\"ROUTER_MIGRATE_SERVICE_TIER\") or \"\").strip()\n+    if \"service_tier\" not in out and tier and tier != \"auto\":\n+        out[\"service_tier\"] = tier\n+\n+\n+# ------------------------------------------------------------------------------------------------ v2 compiled policy\n+# router.policy.json (repo root) is compiled by `router-migrate apply --decisions` into router_policy.py beside this file.\n+# No compiled policy, an invalid one, or ROUTER_MIGRATE_POLICY=off =\u003e exactly v1 behaviour. Semantics: CONTRACTS.md section 1.\n+_POLICY_KEYS = {\"allow_flex_tier\", \"prompt_cache_key\", \"metadata\", \"fallbacks\", \"provider_timeout\", \"service_tier\", \"model_map\", \"drop_params\"}\n+_POLICY_STATE = {\"loaded\": False, \"policy\": None, \"hash\": None, \"valid\": False, \"logged\": set()}\n+\n+\n+def _policy_log(key, msg):\n+    if key not in _POLICY_STATE[\"logged\"]:\n+        _POLICY_STATE[\"logged\"].add(key)\n+        sys.stderr.write(\"router-migrate policy %s\\n\" % msg)\n+\n+\n+def _valid_entry(e):\n+    if not isinstance(e, dict) or set(e) - _POLICY_KEYS:\n+        return False\n+    if \"allow_flex_tier\" in e and not isinstance(e[\"allow_flex_tier\"], bool):\n+        return False\n+    if \"prompt_cache_key\" in e and not (isinstance(e[\"prompt_cache_key\"], str) and e[\"prompt_cache_key\"]):\n+        return False\n+    if \"metadata\" in e and not (isinstance(e[\"metadata\"], dict) and all(isinstance(k, str) and isinstance(v, str) for k, v in e[\"metadata\"].items())):\n+        return False\n+    if \"fallbacks\" in e and not (isinstance(e[\"fallbacks\"], list) and 1 \u003c= len(e[\"fallbacks\"]) \u003c= 14 and all(isinstance(x, str) and x for x in e[\"fallbacks\"])):\n+        return False\n+    if \"provider_timeout\" in e:\n+        t = e[\"provider_timeout\"]\n+        if isinstance(t, bool) or not isinstance(t, (int, float)) or not 1 \u003c= t \u003c= 660:\n+            return False\n+    if \"service_tier\" in e and e[\"service_tier\"] not in (\"default\", \"flex\"):\n+        return False\n+    if \"model_map\" in e and not (isinstance(e[\"model_map\"], dict) and e[\"model_map\"] and\n+                                 all(isinstance(k, str) and isinstance(v, str) and k and v for k, v in e[\"model_map\"].items())):\n+        return False\n+    if \"drop_params\" in e and not (isinstance(e[\"drop_params\"], list) and e[\"drop_params\"] and all(isinstance(x, str) and x for x in e[\"drop_params\"])):\n+        return False\n+    return True\n+\n+\n+def policy_valid(p):\n+    if not isinstance(p, dict) or p.get(\"version\") != 1 or set(p) - {\"version\", \"defaults\", \"globs\", \"features\"}:\n+        return False\n+    if \"defaults\" in p and not _valid_entry(p[\"defaults\"]):\n+        return False","files":["llmcord.py","router_runtime.py"],"lines":1478,"truncated":true},"results":[],"model_change":true,"in_session":null,"actions":["undo"],"waiting":false},{"id":"m2","kind":"move","title":"Reuse one wrapped client per provider","summary":"AsyncOpenAI clients are cached by (base_url, api_key) instead of being rebuilt, with a new connection pool and a new Router transport, on every Discord message.","calls":["llmcord.py:297"],"level":null,"built":null,"gains":"One connection pool per provider instead of one per message: no socket churn or unclosed clients in a busy channel, and the Router transport (and its in-process catalog and policy state) is set up once.","loses":"nothing","price":"no change","why":"on_message built a fresh AsyncOpenAI for every message and never closed it, which was already wasteful and becomes more so with a transport underneath. Caching on the pair that defines the connection keeps the bot's hot-reloading promise intact: edit base_url or the key in config.yaml and the next message builds a new client.","commit":"556ce94","branch":null,"depends_on":["m1"],"excludes":[],"status":"in code","etag":"3ebc06dd3190","request":null,"stale":false,"due":false,"checked":[{"check":"simulator","label":null,"result":"pass","detail":"check --run after the change: still 1 valid Router request, client=llmcord.py:get_openai_client","source":"agent","samples":null},{"check":"tests","label":null,"result":"pass","detail":"repo suite: 2 passed","source":"agent","samples":null},{"check":"tests","result":"pass","detail":"2 passed on the migration branch; before: 2 passed (same as before)","source":"check"},{"check":"router-live","label":null,"result":"pass","source":"check","detail":"4 live request(s) through Router recorded, 4 ok (features: llmcord.py:on_message)"},{"check":"other","label":"Route","result":"pass","detail":"1 call seen going through Router (route truth)","source":"check"}],"flags":[],"diff":{"ref":"556ce94","how":"git show --stat --patch 556ce94","error":null,"text":"commit 556ce94d099feef9504940fd5ec0c07cb582f4c4\nAuthor: Sanjith Sambath \u003csanjith.sambath07@gmail.com\u003e\nDate:   Wed Oct 14 21:35:47 2026 -0400\n\n    Reuse one wrapped client per provider\n    \n    The bot built a fresh AsyncOpenAI (and a fresh httpx connection pool, now with\n    the Router transport under it) for every Discord message and never closed it.\n    Clients are cached by (base_url, api_key), so hot-reloading config.yaml still\n    picks up a changed base URL or key: a new pair builds a new client.\n---\n llmcord.py | 12 +++++++++++-\n 1 file changed, 11 insertions(+), 1 deletion(-)\n\ndiff --git a/llmcord.py b/llmcord.py\nindex c920fb4..61ba543 100644\n--- a/llmcord.py\n+++ b/llmcord.py\n@@ -64,6 +64,16 @@ discord_bot = commands.Bot(intents=intents, activity=activity, command_prefix=No\n \n httpx_client = httpx.AsyncClient()\n \n+openai_clients: dict[tuple[Optional[str], Optional[str]], AsyncOpenAI] = {}\n+\n+\n+def get_openai_client(base_url: Optional[str], api_key: Optional[str]) -\u003e AsyncOpenAI:\n+    \"\"\"One client (and one connection pool) per provider, built on first use and reused after that.\"\"\"\n+    if (cache_key := (base_url, api_key)) not in openai_clients:\n+        openai_clients[cache_key] = _router_wrap_openai(AsyncOpenAI(base_url=base_url, api_key=api_key))\n+\n+    return openai_clients[cache_key]\n+\n \n @dataclass\n class MsgNode:\n@@ -160,7 +170,7 @@ async def on_message(new_msg: discord.Message) -\u003e None:\n \n     base_url = provider_config[\"base_url\"]\n     api_key = provider_config.get(\"api_key\", \"sk-no-key-required\")\n-    openai_client = _router_wrap_openai(AsyncOpenAI(base_url=base_url, api_key=api_key))\n+    openai_client = get_openai_client(base_url, api_key)\n \n     model_parameters = config[\"models\"].get(provider_slash_model, None)\n ","files":["llmcord.py"],"lines":44,"truncated":false},"results":[],"model_change":false,"in_session":null,"actions":["undo"],"waiting":false},{"id":"m3","kind":"note","title":"A smoke test for the reply call site","summary":"tests/smoke_on_message.py drives on_message with a stubbed Discord layer so the real streaming call can be run against the simulator or real Router.","calls":["llmcord.py:297"],"level":null,"built":null,"gains":"The one call site can be exercised end to end without a Discord token: `router-migrate check --run \"python tests/smoke_on_message.py\" [--live]`. It asserts text came back and that the embed turned green, which is the app's own signal that the stream finished cleanly.","loses":"nothing","price":"well under a cent of live tokens per run","why":"The repo's suite only compiles and imports the module, so nothing would have caught a broken stream translation. The repo's .gitignore is a whitelist, so this commit also un-ignores tests/ and router.policy.json; without that the policy file the runtime compiles could not be committed at all.","commit":"ae8a1c8","branch":null,"depends_on":["m1"],"excludes":[],"status":"info","etag":"e3ad8c1135b9","request":null,"stale":false,"due":false,"checked":[{"check":"tests","label":null,"result":"pass","detail":"new test passes against router-sim and against real Router; repo suite unchanged at 2 passed","source":"agent","samples":null}],"flags":[],"diff":{"ref":"ae8a1c8","how":"git show --stat --patch ae8a1c8","error":null,"text":"commit ae8a1c8bba3129562cb82faa0d632cb58951b9d3\nAuthor: Sanjith Sambath \u003csanjith.sambath07@gmail.com\u003e\nDate:   Wed Oct 14 21:37:39 2026 -0400\n\n    Add the Router smoke test and whitelist it\n    \n    The repo's .gitignore is a whitelist, so tests/ and router.policy.json (the\n    runtime's per-feature Router fields) were being ignored. tests/smoke_on_message.py\n    drives on_message with a stubbed Discord layer; it is how the reply call site is\n    exercised against Router (`router-migrate check --run ... [--live]`).\n---\n .gitignore                |   3 ++\n tests/smoke_on_message.py | 111 ++++++++++++++++++++++++++++++++++++++++++++++\n 2 files changed, 114 insertions(+)\n\ndiff --git a/.gitignore b/.gitignore\nindex 719981d..c173f5d 100644\n--- a/.gitignore\n+++ b/.gitignore\n@@ -11,3 +11,6 @@\n !config.yaml\n !docker-compose.yaml\n !requirements.txt\n+\n+!tests/\n+!router.policy.json\ndiff --git a/tests/smoke_on_message.py b/tests/smoke_on_message.py\nnew file mode 100644\nindex 0000000..bf44795\n--- /dev/null\n+++ b/tests/smoke_on_message.py\n@@ -0,0 +1,111 @@\n+\"\"\"End-to-end smoke test for llmcord's reply path, with fake Discord objects.\n+\n+Drives `llmcord.on_message` for a DM that mentions the bot, with a stubbed Discord\n+layer, and asserts the bot streamed a reply back. Used to exercise the real LLM call\n+site (llmcord.py: chat.completions.create) against Router:\n+\n+    router-migrate check --run \"python tests/smoke_on_message.py\"          # simulator\n+    router-migrate check --run \"python tests/smoke_on_message.py\" --live   # real Router\n+\n+Needs no Discord token and makes no Discord API calls.\n+\"\"\"\n+\n+import asyncio\n+import os\n+import sys\n+\n+os.environ.setdefault(\"DISCORD_BOT_TOKEN\", \"dummy-token\")\n+os.environ.setdefault(\"DISCORD_CLIENT_ID\", \"0\")\n+os.environ.setdefault(\"OPENAI_API_KEY\", \"sk-dummy\")\n+\n+sys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n+\n+_real_run = asyncio.run\n+asyncio.run = lambda coro, **kw: coro.close()  # llmcord starts the bot at import time\n+import llmcord  # noqa: E402\n+\n+asyncio.run = _real_run\n+\n+BOT_ID = 1\n+BOT_MENTION = f\"\u003c@{BOT_ID}\u003e\"\n+\n+\n+class FakeUser:\n+    def __init__(self, id, bot=False):\n+        self.id = id\n+        self.bot = bot\n+        self.mention = f\"\u003c@{id}\u003e\"\n+\n+\n+class FakeTyping:\n+    async def __aenter__(self):\n+        return self\n+\n+    async def __aexit__(self, *exc):\n+        return False\n+\n+\n+class FakeChannel:\n+    def __init__(self):\n+        self.id = 100\n+        self.type = llmcord.discord.ChannelType.private\n+\n+    def typing(self):\n+        return FakeTyping()\n+\n+\n+class FakeMessage:\n+    _next_id = 1000\n+\n+    def __init__(self, content, author, channel):\n+        FakeMessage._next_id += 1\n+        self.id = FakeMessage._next_id\n+        self.content = content\n+        self.author = author\n+        self.channel = channel\n+        self.attachments = []\n+        self.embeds = []\n+        self.components = []\n+        self.mentions = []\n+        self.reference = None\n+        self.edits = []\n+\n+    async def reply(self, **kwargs):\n+        reply = FakeMessage(\"\", FakeUser(BOT_ID), self.channel)\n+        reply.sent_kwargs = kwargs\n+        SENT.append(reply)\n+        return reply\n+\n+    async def edit(self, **kwargs):\n+        self.edits.append(kwargs)\n+        SENT_EDITS.append(kwargs)\n+\n+\n+SENT = []\n+SENT_EDITS = []\n+\n+\n+async def main():\n+    bot_user = FakeUser(BOT_ID)\n+    llmcord.discord_bot._connection.user = bot_user\n+\n+    channel = FakeChannel()\n+    msg = FakeMessage(f\"{BOT_MENTION} what is 2+2? answer in one word\", FakeUser(42), channel)\n+\n+    await llmcord.on_message(msg)\n+\n+    texts = [m.sent_kwargs.get(\"embed\").description for m in SENT if getattr(m, \"sent_kwargs\", {}).get(\"embed\")]\n+    texts += [e[\"embed\"].description for e in SENT_EDITS if e.get(\"embed\")]\n+    assert SENT, \"the bot sent no reply\"\n+    assert any(t for t in texts), f\"the bot sent no text: {texts!r}\"\n+    final = (texts[-1] or \"\").strip()\n+    color = SENT[-1].sent_kwargs[\"embed\"].color\n+    print(f\"model={llmcord.curr_model} replies={len(SENT)} color={color} text={final[:120]!r}\")\n+    assert final, \"the final reply was empty\"\n+    # the embed turns green only when the stream reported a clean finish_reason\n+    assert color == llmcord.EMBED_COLOR_COMPLETE, f\"reply did not finish cleanly (color {color})\"\n+\n+\n+if __name__ == \"__main__\":\n+    asyncio.run(main())\n+    print(\"smoke_on_message: ok\")","files":[".gitignore","tests/smoke_on_message.py"],"lines":143,"truncated":false},"results":[],"model_change":false,"in_session":null,"actions":[],"waiting":false},{"id":"s1","kind":"stays","title":"Other providers keep their own hosts","summary":"openrouter, x-ai, google, azure-openai, lmstudio, ollama and vllm traffic, and any OpenAI model not in the catalog, still go straight to the configured endpoint.","calls":["llmcord.py:297"],"level":null,"built":null,"gains":"llmcord's selling point, any OpenAI-compatible endpoint including local models, survives the migration untouched; a user's own OpenRouter or Gemini key keeps paying for its own traffic.","loses":"nothing","price":"no change","why":"The runtime only plans requests to api.openai.com (and api.anthropic.com); every other host passes through. Routing them would move spend onto the Router key and needs an owner's decision plus model-id mapping, since ids like openrouter/~anthropic/claude-opus-latest are not catalog ids (item i5). Requests the runtime cannot translate (n\u003e1, seed, logprobs, audio or file-id content, an output cap under 16) also stay on the provider by design, so no configuration the bot supports stops working.","commit":null,"branch":null,"depends_on":[],"excludes":[],"status":"info","etag":"f641c755d4e3","request":null,"stale":false,"due":false,"checked":[{"check":"other","label":null,"result":"info","detail":"router_runtime._plan_request: only _OPENAI_HOSTS/_ANTHROPIC_HOSTS (plus explicitly unlocked hosts) are planned; a model outside the catalog is kept with reason 'model ... is not in the Router catalog'","source":"agent","samples":null},{"check":"other","label":"Route","result":"pass","detail":"1 call seen going through Router (route truth)","source":"check"}],"flags":[],"diff":null,"results":[],"model_change":false,"in_session":null,"actions":[],"waiting":false},{"id":"i1","kind":"improvement","title":"Start on gpt-5.6-luna instead of gpt-5.5","summary":"Make the bot's default model gpt-5.6-luna ($0.20/$1.20 per 1M) instead of gpt-5.5 ($5/$30), keeping gpt-5.5 in the /model list.","calls":["llmcord.py:297"],"level":"quick-win","built":true,"gains":"25x cheaper per token for the same family, same high reasoning effort, same image support: a reply with 2,000 input and 1,000 output tokens costs $0.0016 instead of $0.040, and a 25-message chain that reaches 20,000 input tokens costs $0.004 instead of $0.100. Both are Flex-eligible, so the account's cost-efficient routing still applies.","loses":"answers will differ: a smaller model writes the bot's snarky replies, and an admin who wants the old one switches back with /model (gpt-5.5 stays in the list)","price":"input $5 -\u003e $0.20 per 1M, output $30 -\u003e $1.20 per 1M (catalog, live 2026-10-14)","why":"The shipped default is the most expensive OpenAI id in the catalog, running at reasoning_effort: high, to produce brief snarky Discord replies for a bot whose own system prompt says 'optimize for brevity'. Input dominates the bill because every reply resends up to 25 messages of history, so the input price is the number that matters. gpt-5.6-luna was deliberate over gpt-6-luna ($0.10/$0.50): llmcord decides whether to send images by matching the model name against VISION_MODEL_TAGS, 'gpt-5' matches gpt-5.6-luna but nothing matches gpt-6-luna, so the cheaper id would silently stop accepting image attachments (see i7).","commit":"b4e2d76","branch":"router-migrate/improve/cheaper-default-model","depends_on":["m1"],"excludes":[],"status":"proposed","etag":"2f20edd380d4","request":null,"stale":false,"due":false,"checked":[{"check":"router-live","label":null,"result":"pass","detail":"check --run --live on the branch: 200 /v1/responses model=gpt-5.6-luna provider=openai, streamed reply 'Four', embed green","source":"agent","samples":null},{"check":"price","label":null,"result":"info","detail":"router-migrate levers: gpt-5.5 in $5 out $30; gpt-5.6-luna in $0.2 out $1.2, reasoning efforts to max, input modalities file/image/text, flex yes","source":"agent","samples":null},{"check":"tests","label":null,"result":"pass","detail":"repo suite: 2 passed; config loads with gpt-5.6-luna first, so curr_model starts there","source":"agent","samples":null},{"check":"tests","result":"pass","detail":"2 passed on this branch; before: 2 passed (same as before)","source":"check"},{"check":"side-by-side","result":"not-run","source":"check","label":null,"detail":"answers will differ; no side-by-side samples"}],"flags":[],"diff":{"ref":"router-migrate/improve/cheaper-default-model","how":"git diff router-migrate/migration...router-migrate/improve/cheaper-default-model","error":null,"text":" config.yaml | 5 +++++\n 1 file changed, 5 insertions(+)\n\ndiff --git a/config.yaml b/config.yaml\nindex 0650c52..59fa1a6 100644\n--- a/config.yaml\n+++ b/config.yaml\n@@ -59,6 +59,11 @@ providers:\n     base_url: http://localhost:8000/v1\n \n models:\n+  # The first entry is the model the bot starts with; admins can switch with /model.\n+  openai/gpt-5.6-luna:\n+    reasoning_effort: high\n+    verbosity: medium\n+\n   openai/gpt-5.5:\n     reasoning_effort: high\n     verbosity: medium","files":["config.yaml"],"lines":19,"truncated":false},"results":[],"model_change":true,"in_session":null,"actions":["approve","dismiss","postpone"],"waiting":true},{"id":"i2","kind":"improvement","title":"Bound the reply's stall, keep cache affinity","summary":"router.policy.json gives the reply feature provider_timeout 60 and prompt_cache_key $feature on Router-bound requests.","calls":["llmcord.py:297"],"level":"change","built":true,"gains":"A stalled provider now ends in a 504 after 60 s of stream silence instead of hanging the typing indicator and the orange 'incomplete' embed until the SDK's 600 s default. The cache key buys provider affinity for the growing prefix a reply chain shares between turns; measured on Router, a second call with a key read 8,832 of 9,020 tokens from cache and cost $0.00069 instead of $0.00135, and Claude does not cache on /v1/responses at all without one.","loses":"a generation that legitimately goes 60 s between stream events is cut off and the user sees the error path instead of a late answer","price":"no change to list price; cached input reads cost cache_read_input instead of input ($0.02 vs $0.20 per 1M on gpt-5.6-luna)","why":"This is the only call in the app and a human is watching it stream, so an unbounded stall is the worst failure mode and it is currently unbounded: the code sets no timeout anywhere. Both fields are policy-only, applied by the runtime to Router-bound /v1/responses requests, so the provider fallback path is untouched and the change is reversible by deleting one file.","commit":"57da6f6","branch":"router-migrate/improve/reply-guardrails","depends_on":["m1"],"excludes":["i3"],"status":"proposed","etag":"ab5931814551","request":null,"stale":false,"due":false,"checked":[{"check":"simulator","label":null,"result":"pass","detail":"_apply_policy on a request labelled llmcord.py:on_message produces prompt_cache_key=llmcord.py:on_message and provider_timeout=60; a request with any other label is left alone","source":"agent","samples":null},{"check":"tests","label":null,"result":"pass","detail":"repo suite: 2 passed","source":"agent","samples":null},{"check":"tests","result":"pass","detail":"2 passed on this branch; before: 2 passed (same as before)","source":"check"},{"check":"router-live","result":"not-run","source":"check","label":null,"detail":"not checked live by the agent"}],"flags":[],"diff":{"ref":"router-migrate/improve/reply-guardrails","how":"git diff router-migrate/migration...router-migrate/improve/reply-guardrails","error":null,"text":" router.policy.json | 9 +++++++++\n router_policy.py   | 6 ++++++\n 2 files changed, 15 insertions(+)\n\ndiff --git a/router.policy.json b/router.policy.json\nnew file mode 100644\nindex 0000000..4fdedcb\n--- /dev/null\n+++ b/router.policy.json\n@@ -0,0 +1,9 @@\n+{\n+  \"version\": 1,\n+  \"features\": {\n+    \"llmcord.py:on_message\": {\n+      \"provider_timeout\": 60,\n+      \"prompt_cache_key\": \"$feature\"\n+    }\n+  }\n+}\ndiff --git a/router_policy.py b/router_policy.py\nnew file mode 100644\nindex 0000000..8ac8880\n--- /dev/null\n+++ b/router_policy.py\n@@ -0,0 +1,6 @@\n+# router-migrate compiled policy (generated by `router-migrate apply --decisions` from router.policy.json; do not edit, re-run apply)\n+# The vendored router_runtime.py imports this module. Delete it (or set ROUTER_MIGRATE_POLICY=off) for v1 behaviour.\n+import json\n+\n+POLICY = json.loads('{\"features\":{\"llmcord.py:on_message\":{\"prompt_cache_key\":\"$feature\",\"provider_timeout\":60}},\"version\":1}')\n+POLICY_HASH = 'df92b00e2d03fc26ffbc20424adba9d2bc56da812cb8302534855c62578a1ce3'","files":["router.policy.json","router_policy.py"],"lines":31,"truncated":false},"results":[],"model_change":false,"in_session":null,"actions":["approve","dismiss","postpone"],"waiting":true},{"id":"i3","kind":"improvement","title":"Fail the reply over to another vendor","summary":"The same policy as i2 plus a Router fallback list (selected model, then gpt-5.6-luna, then claude-haiku-5-5) for the reply.","calls":["llmcord.py:297"],"level":"change","built":true,"gains":"An answer instead of silence when the first model is rate-limited, refused, missing or down: Router walks the list before generating. Today every provider failure lands in `except Exception: logging.exception(...)` and the Discord user is left with a stuck orange embed and no explanation. Candidates are image-capable, so attachments still work, and Router drops a candidate that cannot do what the request asks.","loses":"answers will differ when a fallback serves (a different model, at that candidate's price), and the candidate list is static, so it also applies when an admin has switched the bot to another catalog model","price":"unchanged while the first candidate serves; a fallback bills its own price (claude-haiku-5-5 $0.10/$0.50, gpt-5.6-luna $0.20/$1.20), and a truncated attempt is still billed","why":"A single-vendor outage currently takes the whole product down, and the bot has no retry of its own. Router's documented limit is worth knowing: a stream that has already started is not failed over, so this covers failures up to the first token, which is where provider outages, 429s and capacity errors show up. It supersedes i2 rather than stacking with it because both edit router.policy.json; apply one.","commit":"36b1225","branch":"router-migrate/improve/reply-fallbacks","depends_on":["m1"],"excludes":["i2"],"status":"proposed","etag":"228c45055ee9","request":null,"stale":false,"due":false,"checked":[{"check":"router-live","label":null,"result":"pass","detail":"check --run --live on the branch: 200 /v1/responses with a models list (model=None in the request log), streamed reply came back, provider=openai","source":"agent","samples":null},{"check":"simulator","label":null,"result":"pass","detail":"_apply_policy turns model=gpt-5.5 into models=[gpt-5.5, gpt-5.6-luna, claude-haiku-5-5] and keeps provider_timeout and the cache key","source":"agent","samples":null},{"check":"tests","label":null,"result":"pass","detail":"repo suite: 2 passed","source":"agent","samples":null},{"check":"tests","result":"pass","detail":"2 passed on this branch; before: 2 passed (same as before)","source":"check"},{"check":"side-by-side","result":"not-run","source":"check","label":null,"detail":"answers will differ; no side-by-side samples"}],"flags":[],"diff":{"ref":"router-migrate/improve/reply-fallbacks","how":"git diff router-migrate/migration...router-migrate/improve/reply-fallbacks","error":null,"text":" router.policy.json | 10 ++++++++++\n router_policy.py   |  6 ++++++\n 2 files changed, 16 insertions(+)\n\ndiff --git a/router.policy.json b/router.policy.json\nnew file mode 100644\nindex 0000000..94cbcea\n--- /dev/null\n+++ b/router.policy.json\n@@ -0,0 +1,10 @@\n+{\n+  \"version\": 1,\n+  \"features\": {\n+    \"llmcord.py:on_message\": {\n+      \"provider_timeout\": 60,\n+      \"prompt_cache_key\": \"$feature\",\n+      \"fallbacks\": [\"gpt-5.6-luna\", \"claude-haiku-5-5\"]\n+    }\n+  }\n+}\ndiff --git a/router_policy.py b/router_policy.py\nnew file mode 100644\nindex 0000000..ba0938f\n--- /dev/null\n+++ b/router_policy.py\n@@ -0,0 +1,6 @@\n+# router-migrate compiled policy (generated by `router-migrate apply --decisions` from router.policy.json; do not edit, re-run apply)\n+# The vendored router_runtime.py imports this module. Delete it (or set ROUTER_MIGRATE_POLICY=off) for v1 behaviour.\n+import json\n+\n+POLICY = json.loads('{\"features\":{\"llmcord.py:on_message\":{\"fallbacks\":[\"gpt-5.6-luna\",\"claude-haiku-5-5\"],\"prompt_cache_key\":\"$feature\",\"provider_timeout\":60}},\"version\":1}')\n+POLICY_HASH = '9b50edc894e42c688fcf54411f14903b7ffdbbedbdf35cccbe8d7f2376334d26'","files":["router.policy.json","router_policy.py"],"lines":32,"truncated":false},"results":[],"model_change":true,"in_session":null,"actions":["approve","dismiss","postpone"],"waiting":true},{"id":"i4","kind":"improvement","title":"One Router provider, the catalog as model list","summary":"Port the streamed reply to /v1/responses and add a single router provider whose /model list comes from Router's GET /v1/models.","calls":["llmcord.py:297"],"level":"rework","built":false,"gains":"The config stops being a hand-maintained map of vendors, base URLs and keys: one entry, one key, and /model autocompletes from the live catalog, so every vendor Router serves is one slash command away. On that path the Router levers go inline per request instead of through a static policy file: a fallback chain chosen for the model actually selected, prompt_cache_key per conversation (i7), provider_timeout, metadata {user: discord id} for spend per user or channel, and usage.cost per reply, which is the first time this bot could report or cap what a channel spends. It also drops the Chat-\u003eResponses translation from the request path, and lets the vision gate come from the catalog's input_modalities instead of substring tags (i7).","loses":"a real rewrite of the streaming loop: Router serves no /v1/chat/completions, so the reply must use responses.create with input/instructions and the event stream (response.output_text.delta, response.completed) in place of choice.delta.content and finish_reason, which is what drives message splitting and the embed colour. Calls on that provider entry also lose the runtime's per-request provider fallback, and provider-specific extras like openrouter:web_search have no equivalent there (Responses web_search instead).","price":"no change by itself; it is what makes per-request Flex, fallbacks and per-conversation caching available, and makes spend attributable per Discord user","why":"If you were writing llmcord today against Router, this is the shape: the gateway already is the multi-provider abstraction the config file hand-rolls, and it reports the cost of every reply. I did not build it inside the migration because it changes visible behaviour in the stream loop, where this app's whole UX lives, and because the runtime already gets the traffic onto Router with no behaviour change. Worth a conversation about keeping the legacy chat path for local models (Ollama, vLLM) alongside it, which Router does not serve.","commit":null,"branch":null,"depends_on":["m1"],"excludes":[],"status":"proposed","etag":"1a713423f8a5","request":null,"stale":false,"due":false,"checked":[{"check":"other","label":null,"result":"info","detail":"ROUTER.md section 2: no /v1/chat/completions endpoint; GET /v1/models is served in OpenAI list shape; usage.cost is on Responses only","source":"agent","samples":null},{"check":"router-live","label":null,"result":"not-run","detail":"not built; the migration's runtime path is what was verified live","source":"agent","samples":null},{"check":"other","label":"Check","result":"not-run","source":"check","detail":"proposed, not built yet: the apply session builds it after you approve, and the check runs then"}],"flags":[],"diff":null,"results":[],"model_change":false,"in_session":null,"actions":["approve","dismiss","postpone"],"waiting":true},{"id":"i5","kind":"needs-decision","title":"Should OpenRouter and xAI traffic route too?","summary":"The runtime can route another vendor's OpenAI-compatible host for catalog models, which would put the openrouter, x-ai and google provider entries on Router.","calls":["llmcord.py:297"],"level":null,"built":null,"gains":"All of the bot's hosted traffic on one key and one spend view, not just the OpenAI entry, with Router picking the upstream provider.","loses":"spend moves from the operator's own OpenRouter, xAI or Gemini account onto the Router key, and the model ids in config.yaml (for example openrouter/~anthropic/claude-opus-latest) are not catalog ids, so each needs a model_map entry before anything routes; OpenRouter-specific request extras such as the openrouter:web_search tool would stop being honoured on a routed request","price":"the catalog price of the mapped model instead of the vendor's own, per model","why":"This is a billing and ownership decision, not an engineering one, and it is per deployment: whoever runs the bot may be using OpenRouter precisely because that is where their credits are. Mechanically it is wrap_openai(client, unlock_hosts=[...]) plus a model_map, and it is a one-line change once someone says which hosts and which ids.","commit":null,"branch":null,"depends_on":[],"excludes":[],"status":"info","etag":"2ae1e97f2ab8","request":null,"stale":false,"due":false,"checked":[{"check":"other","label":null,"result":"info","detail":"router_runtime.wrap_openai unlock_hosts routes a named host's requests to Router when the model is a catalog id; ids are mapped by router.policy.json model_map","source":"agent","samples":null},{"check":"other","label":"Route","result":"pass","detail":"1 call seen going through Router (route truth)","source":"check"}],"flags":[],"diff":null,"results":[],"model_change":false,"in_session":null,"actions":["dismiss","postpone"],"waiting":true},{"id":"i6","kind":"improvement","title":"Tell the user when the reply fails","summary":"Replace the silent `except Exception: logging.exception(...)` around the stream with a short error message in the channel.","calls":["llmcord.py:297"],"level":"change","built":false,"gains":"A user who @-mentions the bot during an outage, a 504 from provider_timeout, a 429 or a spend cap sees why nothing came back instead of a dead orange embed; the operator sees the same failures in one place rather than only in logs.","loses":"an extra Discord message per failure, and whatever the error text reveals about the backend must be kept generic (never the model id or key)","price":"no change","why":"This is the gap the migration makes visible: Router's timeout and fallback behaviour both surface as errors the app currently swallows, and on a streamed reply the user is left looking at a half-written message in the 'incomplete' colour. It is a dozen lines in the existing except block, but it changes user-visible behaviour, so it belongs in front of a reviewer rather than inside the migration.","commit":null,"branch":null,"depends_on":[],"excludes":[],"status":"proposed","etag":"072ef291bf1c","request":null,"stale":false,"due":false,"checked":[{"check":"other","label":null,"result":"info","detail":"llmcord.py: the only error handling around the stream logs the traceback and falls through to the cleanup loop, sending nothing","source":"agent","samples":null},{"check":"other","label":"Check","result":"not-run","source":"check","detail":"proposed, not built yet: the apply session builds it after you approve, and the check runs then"},{"check":"router-live","result":"not-run","source":"check","label":null,"detail":"not checked live by the agent"}],"flags":[],"diff":null,"results":[],"model_change":false,"in_session":null,"actions":["approve","dismiss","postpone"],"waiting":true},{"id":"i7","kind":"improvement","title":"Cache per conversation, gate images on the catalog","summary":"Set prompt_cache_key per reply chain and decide image support from the catalog's input_modalities instead of matching model-name substrings.","calls":["llmcord.py:297"],"level":"quick-win","built":false,"gains":"A per-conversation cache key (the chain's root message id) caches the right prefix: every turn of a chain resends up to 25 messages, so turn N+1 shares turn N's prefix exactly and reads it at cache_read_input ($0.02 vs $0.20 per 1M on gpt-5.6-luna) instead of paying input again. Reading input_modalities from GET /v1/models also fixes a real trap: llmcord's VISION_MODEL_TAGS list silently drops image attachments for catalog ids it does not recognise, such as gpt-6-luna.","loses":"the cache key must only be sent on the Router path (an unknown field would break a local or third-party OpenAI-compatible server), so the call needs to know whether it is routed, which is natural after i4 and awkward before it","price":"cached input reads cost cache_read_input; no other change","why":"Caching pays only on an identical prefix above about 1,024 tokens, which is exactly what a reply chain is and what a per-feature key cannot express; i2's $feature key buys provider affinity but not the right granularity. Both halves are small, and both read naturally from the catalog once the app talks to Router directly, so this is best sequenced with i4.","commit":null,"branch":null,"depends_on":["i4"],"excludes":[],"status":"proposed","etag":"989f444b4c69","request":null,"stale":false,"due":false,"checked":[{"check":"other","label":null,"result":"info","detail":"ROUTER.md 6.3: caching pays on an identical prefix above the provider minimum (~1,024 tokens); the catalog exposes input_modalities per model","source":"agent","samples":null},{"check":"price","label":null,"result":"info","detail":"gpt-5.6-luna input $0.20 vs cache_read_input $0.02 per 1M (catalog, live 2026-10-14)","source":"agent","samples":null},{"check":"other","label":"Check","result":"not-run","source":"check","detail":"proposed, not built yet: the apply session builds it after you approve, and the check runs then"},{"check":"router-live","result":"not-run","source":"check","label":null,"detail":"not checked live by the agent"}],"flags":[],"diff":null,"results":[],"model_change":false,"in_session":null,"actions":["approve","dismiss","postpone"],"waiting":true},{"id":"i8","kind":"improvement","title":"Cap how much history one reply can send","summary":"Lower max_text from 100,000 characters (and consider max_messages) so one reply cannot send an unbounded prompt.","calls":["llmcord.py:297"],"level":"quick-win","built":false,"gains":"A bounded worst case per reply. Today max_messages 25 times max_text 100,000 characters is about 600,000 tokens in one request, beyond most models' context windows, so a user who attaches a few large text files turns the bot into an error, and anything short of that is billed at full input price (at gpt-5.5's
