<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>router-migrate</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: dark;
  /* surfaces (Router console) */
  --bg: #1B1A1A; --side: #201F1E; --panel: #242322; --panel-2: #2A2928; --hover: #2E2C2B; --code: #191818;
  --line: #33312F; --line-2: #44413E; --line-3: #57534F;
  --text: #EAE6E2; --text-2: #ADA7A2; --text-3: #7E7874;
  /* accents */
  --solar: #E4F222; --solar-hover: #D5E31B; --solar-ink: #1B1A1A; --solar-tint: rgba(228,242,34,.07); --solar-line: rgba(228,242,34,.40); --solar-text: #E8EF8F;
  --olive: #36311A; --olive-ink: #E8D46B;
  --green: #4BC876; --green-tint: rgba(75,200,118,.10); --green-line: rgba(75,200,118,.45);
  --lilac: #BAA6EE; --lilac-tint: rgba(186,166,238,.10); --lilac-line: rgba(186,166,238,.42);
  --amber: #E6B95D; --amber-tint: rgba(230,185,93,.10); --amber-line: rgba(230,185,93,.42);
  --red: #E9876F; --red-tint: rgba(233,135,111,.10);
  --add: rgba(75,200,118,.08); --add-strong: rgba(75,200,118,.24); --del: rgba(233,135,111,.07); --del-strong: rgba(233,135,111,.22);
  /* type + space + motion */
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --r: 8px; --r-sm: 5px;
  --ease: cubic-bezier(.2, .7, .2, 1); --fast: 140ms; --med: 220ms;
  --side-w: 236px; --content: 1080px;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/22px var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
h1, h2, h3, h4 { margin: 0; font-weight: 400; letter-spacing: -0.015em; }
p { margin: 0; }
a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--solar); outline-offset: 2px; border-radius: 3px; }
::selection { background: rgba(228,242,34,.22); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* ================= shell ================= */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 0 12px 16px; }
.brand { display: flex; align-items: center; gap: 7px; height: 64px; margin: 0 -12px; padding: 0 22px; border-bottom: 1px solid var(--line); flex: none; }
.brand b { font: 600 16px/22px var(--sans); letter-spacing: -0.02em; }
.brand span { font: 400 11px/14px var(--mono); color: var(--text-3); padding-top: 3px; }
.side .nav:first-of-type { margin-top: 16px; }
.dot { width: 6px; height: 6px; border-radius: 3px; background: var(--text-3); flex: none; }
.dot.live { background: var(--green); box-shadow: 0 0 0 0 rgba(75,200,118,.5); animation: ping 2.4s var(--ease) infinite; }
.dot.err { background: var(--red); }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(75,200,118,.45); } 70%, 100% { box-shadow: 0 0 0 6px rgba(75,200,118,0); } }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font: 500 10.5px/14px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); padding: 0 10px; margin: 0 0 6px; }
.nav-item { position: relative; appearance: none; border: 0; background: none; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 6px; color: var(--text-2); cursor: pointer; text-align: left; width: 100%;
  transition: background var(--fast) var(--ease), color var(--fast) var(--ease); }
.nav-item:hover { background: var(--hover); color: var(--text); }
.nav-item[aria-current="page"] { background: var(--panel-2); color: var(--text); }
.nav-item .lbl { flex: 1; white-space: nowrap; }
.nav-item .cnt { font: 500 11px/18px var(--mono); color: var(--text-3); min-width: 18px; text-align: right; }
.nav-item .cnt.hot { color: var(--solar-ink); background: var(--solar); padding: 0 6px; border-radius: 9px; text-align: center; }
.nav-item .step { font: 500 10.5px/14px var(--mono); color: var(--text-3); width: 16px; text-align: center; }
.side-spacer { flex: 1; min-height: 24px; }
.side-foot { padding: 14px 10px 0; margin-top: 12px; border-top: 1px solid var(--line); color: var(--text-3); font-size: 12px; line-height: 18px; }
.main { min-width: 0; }

/* ================= repo bar: every page is about this one repo ================= */
.topbar { position: sticky; top: 0; z-index: 20; height: 64px; background: rgba(27,26,26,.84); backdrop-filter: saturate(140%) blur(14px); -webkit-backdrop-filter: saturate(140%) blur(14px); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: calc(var(--content) + 112px); margin: 0 auto; height: 100%; padding: 0 56px; display: flex; align-items: center; gap: 14px; }
.repo-chip { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 0 1 auto; }
.repo-ic { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--olive); color: var(--olive-ink); flex: none; box-shadow: inset 0 0 0 1px rgba(232,212,107,.12); }
.repo-ic svg.i { width: 15px; height: 15px; }
.repo-id { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.repo-id .nm { font: 500 14.5px/19px var(--mono); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
.repo-id .path { font: 400 11.5px/15px var(--mono); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 460px; }
.repo-id .path b { font: 500 10px/15px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin-right: 6px; }
.crumb { display: inline-flex; align-items: center; gap: 12px; color: var(--text-2); font-size: 14px; white-space: nowrap; }
.crumb::before { content: ""; width: 1px; height: 22px; background: var(--line-2); transform: skewX(-18deg); }
.topbar .sp { flex: 1; }
.topbar .meta { color: var(--text-3); font-size: 12.5px; white-space: nowrap; }
.status { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--line-2); font-size: 12.5px; color: var(--text-2); white-space: nowrap; }
.status.live { color: var(--green); border-color: var(--green-line); background: var(--green-tint); }
.status.err { color: var(--red); border-color: rgba(233,135,111,.5); background: var(--red-tint); }
.status .dot { background: currentColor; }
.page { max-width: calc(var(--content) + 112px); margin: 0 auto; padding: 44px 56px 160px; }
.enter { animation: enter var(--med) var(--ease) both; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ================= page header ================= */
.ph { display: flex; align-items: flex-end; gap: 24px; margin-bottom: 36px; }
.ph-t { flex: 1; min-width: 0; }
.eyebrow { font: 500 11px/16px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.ph .eyebrow { margin-bottom: 10px; }
.ph h1 { font-size: 32px; line-height: 40px; letter-spacing: -0.02em; }
.ph .sub { color: var(--text-2); font-size: 15px; line-height: 24px; margin-top: 10px; max-width: 720px; }
.ph-side { display: flex; gap: 8px; align-items: center; flex: none; }

/* ================= sections ================= */
.sec { margin-top: 56px; }
.sec-h { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 16px; }
.sec-h .t { flex: 1; min-width: 0; }
.sec-h h2 { font-size: 19px; line-height: 26px; }
.sec-h p { color: var(--text-2); margin-top: 4px; }
.group { margin-top: 40px; }
.group:first-of-type { margin-top: 32px; }
.group-h { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.group-h .eyebrow { color: var(--c, var(--text-2)); white-space: nowrap; }
.group-h p { color: var(--text-3); font-size: 13px; line-height: 20px; flex: 1; min-width: 0; }
.panel { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); }
.link { appearance: none; background: none; border: 0; padding: 0; color: var(--text-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  transition: color var(--fast) var(--ease); font-size: 13px; }
.link svg.i { width: 14px; height: 14px; transition: transform var(--fast) var(--ease); }
.link:hover { color: var(--text); }
.link:hover svg.i { transform: translateX(2px); }
.empty { color: var(--text-2); padding: 28px 24px; }
.empty b { color: var(--text); font-weight: 500; }

/* ================= status vocabulary ================= */
.st { --c: var(--text-3); --t: transparent; --l: var(--line-2); }
.st-lossless { --c: var(--green); --t: var(--green-tint); --l: var(--green-line); }
.st-agent { --c: var(--lilac); --t: var(--lilac-tint); --l: var(--lilac-line); }
.st-unlocked { --c: var(--solar); --t: var(--solar-tint); --l: var(--solar-line); }
.st-decide { --c: var(--amber); --t: var(--amber-tint); --l: var(--amber-line); }
.st-left { --c: var(--text-3); --t: transparent; --l: var(--line-2); }
.sdot { width: 8px; height: 8px; border-radius: 4px; background: var(--c); flex: none; display: inline-block; }
.st-left .sdot, .sdot.st-left { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-3); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 5px; font-size: 12px; line-height: 16px; white-space: nowrap; border: 1px solid var(--line-2); color: var(--text-2); }
.pill svg.i { width: 13px; height: 13px; }
.pill.st { color: var(--c); background: var(--t); border-color: var(--l); }
.pill.live { color: var(--green); background: var(--green-tint); border-color: var(--green-line); }
.pill.solar { color: var(--solar-ink); background: var(--solar); border-color: var(--solar); font-weight: 500; }
.pill.warn { color: var(--amber); background: var(--amber-tint); border-color: var(--amber-line); }
.pill.agent { color: var(--lilac); background: var(--lilac-tint); border-color: var(--lilac-line); }
.save { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 4px; background: var(--solar); color: var(--solar-ink); font-size: 12px; font-weight: 500; white-space: nowrap; }
.save.neutral { background: transparent; color: var(--text-2); font-weight: 400; border: 1px solid var(--line-2); }
.save.cost { background: var(--red-tint); color: var(--red); }
.ic { width: 32px; height: 32px; border-radius: 7px; display: grid; place-items: center; background: var(--olive); color: var(--olive-ink); flex: none; }
.ic.sm { width: 28px; height: 28px; border-radius: 6px; }
.ic.sm svg.i { width: 14px; height: 14px; }
.ic.agent { background: var(--lilac-tint); color: var(--lilac); }

/* ================= overview: the three doors ================= */
.doors { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.door { appearance: none; text-align: left; color: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 16px; padding: 22px 22px 18px; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); min-width: 0;
  transition: border-color var(--fast) var(--ease), background var(--fast) var(--ease), transform var(--fast) var(--ease); }
.door:hover { border-color: var(--line-3); background: #262524; }
.door:active { transform: translateY(1px); }
.door-top { display: flex; align-items: center; gap: 12px; }
.door-top .t { flex: 1; min-width: 0; }
.door-top h3 { font-size: 16px; line-height: 22px; font-weight: 500; }
.door-big { display: flex; align-items: baseline; gap: 8px; }
.door-big .v { font-size: 40px; line-height: 44px; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.door-big .v small { font-size: 18px; color: var(--text-3); margin-left: 2px; letter-spacing: 0; }
.door-big .u { color: var(--text-2); font-size: 14px; }
.door.hot { border-color: var(--solar-line); background: linear-gradient(180deg, rgba(228,242,34,.05), rgba(228,242,34,0) 60%), var(--panel); }
.door.hot .door-big .v { color: var(--solar-text); }
.door-foot { display: flex; align-items: center; gap: 10px; margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); color: var(--text-3); font-size: 12.5px; line-height: 18px; }
.door-foot .sp { flex: 1; }
.door-foot .go { color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; }
.door-foot .go svg.i { width: 14px; height: 14px; transition: transform var(--fast) var(--ease); }
.door:hover .door-foot .go { color: var(--text); }
.door:hover .door-foot .go svg.i { transform: translateX(3px); }
.mini { display: flex; flex-direction: column; gap: 6px; color: var(--text-2); font-size: 13px; line-height: 18px; }
.mini span { display: flex; align-items: center; gap: 7px; }
.mini b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; min-width: 14px; }
.lever-dots { display: flex; gap: 6px; flex-wrap: wrap; }
.ldot { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; border: 1px solid var(--line); color: var(--text-3); background: var(--bg); }
.ldot svg.i { width: 13px; height: 13px; }
.ldot.live { color: var(--green); border-color: var(--green-line); background: var(--green-tint); }
.ldot.wait { color: var(--solar-text); border-color: var(--solar-line); }

/* segment bar */
.segbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; }
.segbar i { display: block; height: 100%; background: var(--c); min-width: 4px; border-radius: 2px; transform-origin: left center; }
.enter .segbar i { animation: grow 520ms var(--ease) both; }
.enter .segbar i:nth-child(2) { animation-delay: 60ms; } .enter .segbar i:nth-child(3) { animation-delay: 120ms; } .enter .segbar i:nth-child(4) { animation-delay: 180ms; } .enter .segbar i:nth-child(5) { animation-delay: 240ms; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.segbar i.st-left { background: repeating-linear-gradient(135deg, var(--line-2) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px var(--line-2); }
.segbar i.st-agent { background: repeating-linear-gradient(135deg, var(--lilac) 0 3px, rgba(186,166,238,.6) 3px 6px); }
.segbar.lg { height: 12px; border-radius: 5px; }
.counts { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--text-2); font-size: 13px; line-height: 18px; }
.counts span { display: inline-flex; align-items: center; gap: 7px; }
.counts b { color: var(--text); font-weight: 500; }

/* ================= flow diagram ================= */
.flow { position: relative; padding: 28px; overflow: hidden; background-image: radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px); background-size: 16px 16px; background-position: -8px -8px; }
.flow-grid { position: relative; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(96px, .8fr) minmax(0, 1fr); align-items: center; z-index: 1; }
.flow svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: visible; }
.wire { fill: none; stroke-width: 1.5; stroke-dasharray: 4 6; stroke-linecap: round; animation: flowdash 2.2s linear infinite; opacity: .9; }
.wires.fresh .wire { animation: flowdash 2.2s linear infinite, wirein 600ms var(--ease) both; }
.wire.lossless { stroke: var(--green); }
.wire.agent { stroke: var(--lilac); }
.wire.unlocked { stroke: var(--solar); }
@keyframes flowdash { to { stroke-dashoffset: -20; } }
@keyframes wirein { from { opacity: 0; } to { opacity: .9; } }
.fcol { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.fgroup { display: flex; flex-direction: column; gap: 8px; }
.fnode { position: relative; appearance: none; text-align: left; color: inherit; display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 7px; padding: 10px 12px; min-width: 0; cursor: pointer;
  transition: border-color var(--fast) var(--ease), background var(--fast) var(--ease); }
.fnode:hover { border-color: var(--c); background: #1F1E1D; }
.fnode .fn { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 20px; }
.fnode .sub { color: var(--text-3); font-size: 12px; line-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fnode .tx { min-width: 0; flex: 1; }
.router-node { justify-self: stretch; background: var(--bg); border: 1px solid var(--green-line); box-shadow: 0 0 0 5px rgba(75,200,118,.04), 0 12px 32px rgba(0,0,0,.25); border-radius: 10px; padding: 20px; }
.router-node .nm { display: flex; align-items: center; gap: 10px; font-size: 18px; line-height: 24px; }
.router-node .nm .ic { width: 28px; height: 28px; border-radius: 6px; background: var(--green-tint); color: var(--green); }
.router-node .host { color: var(--text-3); font-size: 12px; margin-top: 8px; }
.router-node .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.router-node .nochips { color: var(--text-3); font-size: 12.5px; margin-top: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 5px; font-size: 12px; background: var(--panel-2); color: var(--text-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.on { color: var(--green); border-color: var(--green-line); background: var(--green-tint); }
.chip svg.i { width: 13px; height: 13px; }
.flow-stay { position: relative; z-index: 1; margin-top: 24px; padding-top: 20px; border-top: 1px dashed var(--line-2); }
.stay-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.stay-grid .fnode { padding: 8px 10px; background: transparent; border-style: dashed; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--text-2); font-size: 12.5px; position: relative; z-index: 1; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend b { font-weight: 500; color: var(--text); }
.flow-empty { color: var(--text-2); padding: 12px 0; }
.facts-line { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 20px; color: var(--text-3); font-size: 12.5px; line-height: 18px; }
.facts-line span { display: inline-flex; align-items: center; gap: 7px; }
.facts-line b { color: var(--text-2); font-weight: 500; }

/* ================= cards: calls + improvements ================= */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.fchip { appearance: none; display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 16px; border: 1px solid var(--line-2); background: none; color: var(--text-2); cursor: pointer; font-size: 13px;
  transition: background var(--fast) var(--ease), color var(--fast) var(--ease), border-color var(--fast) var(--ease); }
.fchip:hover { color: var(--text); border-color: var(--line-3); }
.fchip[aria-pressed="true"] { background: var(--panel-2); color: var(--text); border-color: var(--line-3); }
.fchip .n { font: 500 11px/16px var(--mono); color: var(--text-3); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.card { position: relative; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 20px 24px; scroll-margin-top: 96px; transition: border-color var(--med) var(--ease), box-shadow var(--med) var(--ease); }
.card.flash { animation: flash 1.6s var(--ease); }
@keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(228,242,34,0); border-color: var(--line); } 15% { box-shadow: 0 0 0 3px rgba(228,242,34,.28); border-color: var(--solar-line); } 100% { box-shadow: 0 0 0 0 rgba(228,242,34,0); } }
.card.call { box-shadow: inset 3px 0 0 -1px var(--c); }
.call-h { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; }
.call-t { min-width: 0; flex: 1 1 240px; }
.call-t .fn { font-size: 15px; line-height: 22px; font-weight: 500; }
.call-t .loc { color: var(--text-3); margin-top: 2px; }
.route { display: inline-flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; white-space: nowrap; }
.route svg.i { width: 14px; height: 14px; color: var(--c); }
.route .dest { color: var(--text); }
.route .x { color: var(--text-3); }

  // ---------------- audit ----------------
  var diffCache = {text: null, files: []};
  function parseDiff(text) {
    if (diffCache.text === text) return diffCache.files;
    var files = [], cur = null, lines = String(text || "").split("\n"), oldN = 0, newN = 0;
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      if (l.indexOf("diff --git ") === 0) { cur = null; continue; }
      if (l.indexOf("--- ") === 0 && i + 1 < lines.length && lines[i + 1].indexOf("+++ ") === 0) {
        var a = l.slice(4).replace(/^a\//, "").split("\t")[0], b = lines[i + 1].slice(4).replace(/^b\//, "").split("\t")[0];
        cur = {file: b === "/dev/null" ? a : b, rows: [], add: 0, del: 0}; files.push(cur); i++; continue;
      }
      if (!cur) continue;
      var m = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@(.*)$/.exec(l);
      if (m) { oldN = +m[1]; newN = +m[2]; cur.rows.push({t: "hunk", c: l}); continue; }
      var ch = l.charAt(0);
      if (ch === "+") { cur.rows.push({t: "add", n: newN++, c: l.slice(1)}); cur.add++; }
      else if (ch === "-") { cur.rows.push({t: "del", o: oldN++, c: l.slice(1)}); cur.del++; }
      else if (ch === " ") cur.rows.push({t: "ctx", o: oldN++, n: newN++, c: l.slice(1)});
    }
    diffCache = {text: text, files: files};
    return files;
  }
  function diffTable(rows) {
    return '<div class="diff"><table><tbody>' + rows.map(function (r) {
      if (r.t === "hunk") return '<tr class="hunk"><td class="n"></td><td class="n"></td><td class="c">' + esc(r.c) + "</td></tr>";
      return '<tr class="' + r.t + '"><td class="n">' + (r.o != null ? r.o : "") + '</td><td class="n">' + (r.n != null ? r.n : "") + '</td><td class="c">' + esc(r.c) + "</td></tr>"; }).join("") + "</tbody></table></div>";
  }
  function renderAudit() {
    var h = [], L = obj(B && B.ledger), claims = arr(L.claims), files = parseDiff(B && B.diff), a = arr(V().assumptions), R = obj(B && B.run);
    h.push('<header class="ph"><div class="ph-t"><h1>Audit trail</h1><p class="sub">Everything behind the other pages: what the agent judged and claimed, with the lines it read, what it cost, and every file the run changed.</p></div></header>');
    var mg = obj(R.migrate), im = obj(R.improve);
    if (mg.usd != null || im.usd != null) h.push('<section class="sec" style="margin-top:0"><div class="sec-h"><div class="t"><h2>Cost and time</h2></div></div><div class="panel tbl-wrap"><table class="tbl"><thead><tr><th>Step</th><th>Agent spend</th><th>Time</th><th>Turns</th><th>Model</th></tr></thead><tbody>' +
      [["Migrate", mg], ["Improve", im]].map(function (p) { return "<tr><td>" + p[0] + '</td><td class="num">' + usd(p[1].usd) + '</td><td class="num">' + (p[1].minutes != null ? p[1].minutes + " min" : "–") + '</td><td class="num">' + fmtInt(p[1].turns) + '</td><td class="mono">' + esc(arr(p[1].model)[0] || arr(mg.model)[0] || "") + "</td></tr>"; }).join("") + "</tbody></table></div></section>");
    if (a.length) h.push('<section class="sec"><div class="sec-h"><div class="t"><h2>What the agent judged</h2><p>How each moved call is used, as the agent read it. Improvements rest on these.</p></div></div><div class="panel tbl-wrap"><table class="tbl"><thead><tr><th>Feature</th><th>Judgment</th><th>Agent’s reason</th><th>Read</th></tr></thead><tbody>' +
      a.map(function (x) { return '<tr><td class="mono">' + esc(x.fn) + "</td><td><div>" + esc(x.text) + '</div><div style="color:var(--text-3);font-size:12px;margin-top:2px">' + esc(x.label) + ": " + esc(x.value) + (arr(x.drives).length ? " · drives " + arr(x.drives).length + " " + plural(arr(x.drives).length, "change") : "") + '</div></td><td style="color:var(--text-2)">' + esc(trim(x.why, 400)) + "</td><td>" + evHtml(x.evidence) + "</td></tr>"; }).join("") + "</tbody></table></div></section>");
    if (claims.length) {
      var r = obj(L.result), f = obj(L.finish);
      h.push('<section class="sec"><div class="sec-h"><div class="t"><h2>What the agent claimed</h2><p>' + claims.length + " decisions on call sites, each checked by the tool. " + fmtInt(r.migrated_confirmed_claims || 0) + " moves confirmed, " + fmtInt(r.overridden_to_not_migrated || 0) + " overridden. The test gate " + (f.last_ok ? "passed" : "did not pass") + (f.reverted ? " (agent edits reverted)" : "") + '.</p></div></div><div class="panel tbl-wrap"><table class="tbl"><thead><tr><th>Site</th><th>Agent said</th><th>Tool says</th><th>Why</th><th>Read</th></tr></thead><tbody>' +
        claims.map(function (x) { return '<tr><td class="mono">' + esc(base(x.file)) + ":" + esc(x.line) + '</td><td><span class="pill">' + esc(x.outcome) + "</span>" + (x.reason_code ? '<div class="mono" style="color:var(--text-3);margin-top:6px">' + esc(x.reason_code) + "</div>" : "") + '</td><td style="color:var(--text-2)">' + esc(x.verdict || x.tool_outcome || "not seen") + (x.confirmed ? " · " + esc(x.confirmed) : "") + '</td><td style="color:var(--text-2)">' + esc(trim(x.why, 300)) + "</td><td>" + evHtml(x.evidence) + "</td></tr>"; }).join("") + "</tbody></table></div></section>");
    }
    h.push('<section class="sec"><div class="sec-h"><div class="t"><h2>Every file changed</h2><p>' + files.length + " " + plural(files.length, "file") + ": the rules’ changes, the agent’s edits and the decisions you applied.</p></div></div>" +
      (files.length ? '<div class="panel">' + files.map(function (f) { var k = "f-" + f.file; return '<details class="fdiff" data-key="' + esc(k) + '"' + (S.open[k] ? " open" : "") + "><summary>" + icon("chev") + '<span class="f">' + esc(f.file) + '</span><span class="plus">+' + f.add + '</span><span class="minus">−' + f.del + "</span></summary>" + diffTable(f.rows) + "</details>"; }).join("") + "</div>" : '<div class="panel empty">No file changes.</div>') + "</section>");
    return h.join("");
  }

  // ---------------- sticky apply bar ----------------
  function renderSticky() {
    var el = document.getElementById("sticky"), n = approved().length;
    if (!B || !n || S.tab === "setup" || S.tab === "audit") { el.innerHTML = ""; S.stickyN = 0; return; }
    var first = !S.stickyN; S.stickyN = n;
    el.innerHTML = '<div class="sticky' + (first ? " in" : "") + '"><div class="sticky-in"><span class="tx"><b>' + n + "</b> approved " + plural(n, "change") + " ready to apply</span><span class=\"sp\"></span>" +
      (LIVE ? "" : '<span class="tx" style="font-size:12.5px">Frozen report: apply from the live dashboard.</span>') +
      '<button class="btn primary lg" type="button" data-act="apply"' + (!LIVE || S.busy ? " disabled" : "") + ">" + busyLabel("apply", "Apply " + n + " " + plural(n, "change")) + "</button></div></div>";
  }

  // ---------------- render ----------------
  function renderAll(enter) {
    S.pending = false;
    renderSide();
    renderTop();
    var main = document.getElementById("main");
    if (!B) {
      main.innerHTML = '<header class="ph"><div class="ph-t"><h1>No data</h1><p class="sub">This page shows a router-migrate run. Run <code>router-migrate run . --agent claude</code> (or <code>router-migrate up</code>) to open it with data.</p></div></header>';
      document.getElementById("sticky").innerHTML = ""; return;
    }
    var banner = "";
    if (LIVE && S.conn === "auth") banner = '<div class="banner neg">' + icon("warn") + "<span>The session token was rejected. Re-run the command and open the new link.</span></div>";
    else if (LIVE && S.conn === "down") banner = '<div class="banner warn">' + icon("warn") + "<span>Lost the local server. Decisions are paused until it is running again.</span></div>";
    if (B.view_error) banner += '<div class="banner warn">' + icon("warn") + "<span>Part of this view could not be built: " + esc(B.view_error) + "</span></div>";
    var fn = {overview: renderOverview, migrate: renderMigrate, improve: renderImprove, decisions: renderDecisions, setup: renderSetup, audit: renderAudit}[S.tab] || renderOverview;
    main.innerHTML = '<div class="' + (enter ? "enter" : "") + '">' + banner + fn() + "</div>";
    renderSticky();
    if (S.tab === "overview") { flowSig = ""; requestAnimationFrame(function () { drawFlow(true); }); }
  }
  function setTab(t, push) {
    t = ALIAS[t] || t;
    if (!PAGES.concat(MORE).some(function (x) { return x[0] === t; })) t = "overview";
    var changed = t !== S.tab;
    S.tab = t;
    if (push && location.hash !== "#" + t) { try { history.replaceState(null, "", location.pathname + location.search + "#" + t); } catch (e) {} }
    renderAll(changed);
  }
  function goTo(id) {
    var el = document.getElementById(id); if (!el) return;
    var bar = document.getElementById("topbar"), off = (bar ? bar.getBoundingClientRect().bottom : 0) + 24;
    var top = el.getBoundingClientRect().top + window.scrollY - off;
    window.scrollTo({top: top, behavior: "smooth"});
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  }
  function go(tab, id) { var same = S.tab === tab; setTab(tab, true); if (id) requestAnimationFrame(function () { requestAnimationFrame(function () { goTo(id); }); }); else if (!same) window.scrollTo({top: 0}); }

  // ---------------- events ----------------
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-tab],[data-act],[data-go-call],[data-go-imp]");
    if (!t) return;
    if (t.hasAttribute("data-go-call")) { go("migrate", "call-" + t.getAttribute("data-go-call")); return; }
    if (t.hasAttribute("data-go-imp")) { var gid = t.getAttribute("data-go-imp"), s = stateOf(gid); go(s === "applied" ? "improve" : "decisions", "imp-" + gid); return; }
    if (t.hasAttribute("data-tab") && !t.hasAttribute("data-act")) { go(t.getAttribute("data-tab")); return; }
    var a = t.getAttribute("data-act"), id = t.getAttribute("data-id");
    if (a === "filter") { S.filter = t.getAttribute("data-v"); renderAll(false); }
    else if (a === "decide") doDecide(id, t.getAttribute("data-a"));
    else if (a === "approve-safe") doApproveMany(waiting().filter(function (i) { return safeOne(i) && !isModel(i); }).map(function (i) { return i.id; }));
    else if (a === "apply") doApply();
    else if (a === "close-result") { S.applyResult = null; renderAll(false); }
    else if (a === "form") {
      var kk = t.getAttribute("data-k"), cur = S.form[id];
      if (cur && cur.k === kk) delete S.form[id];
      else S.form[id] = {k: kk, v: kk === "postpone" ? new Date(Date.now() + 14 * 864e5).toISOString().slice(0, 10) : ""};
      renderAll(false); var inp = document.querySelector('[data-form="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]'); if (inp) inp.focus({preventScroll: true});
    }
    else if (a === "form-cancel") { delete S.form[id]; renderAll(false); }
    else if (a === "confirm") {
      var f = S.form[id]; if (!f) return; var v = String(f.v || "").trim();
      if (f.k === "dismiss") { if (!v) { toast("Add a reason to dismiss", true); return; } doDecide(id, "dismiss", {reason: v}); }
      else { if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { toast("Pick a date", true); return; } doDecide(id, "postpone", {until: v}); }
    }
    else if (a === "setup-done") { var it = setupItems().filter(function (x) { return x.id === id; })[0]; if (it) { store(setupKey(it), setupDone(it) ? "0" : "1"); renderAll(false); } }
    else if (a === "copy") {
      var val = t.getAttribute("data-v");
      var ok = function () { var old = t.textContent; t.textContent = "Copied"; setTimeout(function () { t.textContent = old; }, 1200); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(val).then(ok, function () { toast("Copy failed", true); }); else toast(val);
    }
  });
  document.addEventListener("toggle", function (e) { var d = e.target; if (d.tagName === "DETAILS" && d.hasAttribute("data-key")) S.open[d.getAttribute("data-key")] = d.open; }, true);
  document.addEventListener("input", function (e) { var t = e.target; if (t.hasAttribute("data-form")) { var f = S.form[t.getAttribute("data-form")]; if (f) f.v = t.value; } });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.hasAttribute && e.target.hasAttribute("data-form")) { var b = e.target.parentNode.querySelector('[data-act="confirm"]'); if (b) b.click(); }
    if (e.key === "Escape" && e.target.hasAttribute && e.target.hasAttribute("data-form")) { delete S.form[e.target.getAttribute("data-form")]; renderAll(false); }
  });
  document.addEventListener("focusout", function () { setTimeout(function () { if (S.pending) { var ae = document.activeElement; if (!ae || !/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) renderAll(false); } }, 0); });
  window.addEventListener("hashchange", function () { var h = location.hash.replace(/^#/, ""); if (h && (ALIAS[h] || h) !== S.tab) setTab(h, false); });
  var rz; window.addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(function () { if (S.tab === "overview") drawFlow(false); }, 100); });

  // ---------------- boot ----------------
  var h0 = location.hash.replace(/^#/, ""); if (h0) S.tab = ALIAS[h0] || h0;
  if (!PAGES.concat(MORE).some(function (x) { return x[0] === S.tab; })) S.tab = "overview";
  S.sig = sigOf(B);
  renderAll(true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (S.tab === "overview") drawFlow(false); });
  if (LIVE) { refresh(false); setInterval(function () { if (document.visibilityState !== "hidden") refresh(false); }, 2000); }
})();
</script>
