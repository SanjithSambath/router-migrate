<!doctype html>
<html lang="en">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #1A1919; --subtle: #201F1E; --muted: #2A2827; --border: #32302F; --border-strong: #46423F;
  --text: #D2CECB; --text-2: #A39D99; --text-3: #7A7471;
  --solar: #E4F222; --solar-hover: #D6E41A; --on-solar: #1A1919;
  --pos: #7CC08E; --pos-bg: #1E2B21; --neg: #E58A66; --neg-bg: #33221B;
  --warn: #D2B36F; --warn-bg: #2F2A1A; --info: #93A9D6; --info-bg: #1F2533;
  --add-bg: #1C2620; --del-bg: #2B1F1A; --hunk-bg: #242221;
  --inv-bg: #D2CECB; --inv-text: #1A1919;
  --scrim: rgba(0,0,0,.5);
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/20px var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-weight: 400; letter-spacing: -0.02em; margin: 0; }
h1 { font-size: 28px; line-height: 36px; }
h2 { font-size: 20px; line-height: 28px; }
h3 { font-size: 16px; line-height: 24px; }
p { margin: 0; }
a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--border-strong); }
a:hover { text-decoration-color: currentColor; }
code, .mono, .num { font-family: var(--mono); font-size: 0.93em; }
.num { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.top { border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 20; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 32px; }
.bar { display: flex; align-items: center; gap: 12px; height: 56px; }
.brand { font: 500 13px/20px var(--mono); color: var(--text); letter-spacing: 0; white-space: nowrap; }
.brand-sep { color: var(--text-3); }
.brand-repo { color: var(--text-2); font: 400 13px/20px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.spacer { flex: 1; }
.mode { display: inline-flex; align-items: center; gap: 8px; height: 24px; padding: 0 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; color: var(--text-2); white-space: nowrap; }
.dot { width: 6px; height: 6px; border-radius: 3px; background: var(--text-3); flex: none; }
.mode.live .dot { background: var(--pos); animation: pulse 1.6s ease-in-out infinite; }
.mode.err .dot { background: var(--neg); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; height: 44px; padding: 0 12px; color: var(--text-2); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); }
.count { font: 500 11px/16px var(--mono); padding: 0 6px; border-radius: 8px; background: var(--muted); color: var(--text-2); }
.tab[aria-selected="true"] .count { background: var(--inv-bg); color: var(--inv-text); }
main { padding: 32px 0 64px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.meta { color: var(--text-2); font-size: 13px; line-height: 20px; }
.meta .sep { color: var(--text-3); padding: 0 6px; }
.section { margin-top: 40px; }
.section:first-child { margin-top: 0; }
.section-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.section-head .meta { margin-left: 0; }
.section-sub { color: var(--text-2); font-size: 13px; margin: -4px 0 16px; max-width: 760px; }
.pane { border: 1px solid var(--border); border-radius: 12px; background: var(--bg); }
.pane-pad { padding: 20px; }
.subtle { background: var(--subtle); }
.banner { display: block; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--subtle); color: var(--text-2); font-size: 13px; margin-bottom: 24px; }
.banner code { color: var(--text); background: var(--muted); padding: 1px 6px; border-radius: 4px; }
.banner.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
.banner.neg { background: var(--neg-bg); border-color: transparent; color: var(--neg); }

/* ---------- buttons, chips ---------- */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover:not(:disabled) { background: var(--muted); }
.btn:disabled { cursor: not-allowed; opacity: .45; }
.btn.lg { height: 40px; padding: 0 16px; font-size: 14px; }
.btn.inv { background: var(--inv-bg); color: var(--inv-text); border-color: var(--inv-bg); }
.btn.inv:hover:not(:disabled) { background: var(--inv-bg); opacity: .88; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.ghost:hover:not(:disabled) { color: var(--text); background: var(--muted); }
.btn.primary { background: var(--solar); color: var(--on-solar); border-color: var(--solar); }
.btn.primary:hover:not(:disabled) { background: var(--solar-hover); border-color: var(--solar-hover); }
.btn.primary:disabled { background: var(--muted); border-color: var(--border); color: var(--text-2); opacity: 1; }
.btn.on { background: var(--muted); border-color: var(--text-2); }
.icon-btn { width: 32px; padding: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--subtle); color: var(--text-2); font-size: 12px; line-height: 16px; white-space: nowrap; max-width: 100%; }
.chip .k { color: var(--text-3); }
.chip.mono { font-family: var(--mono); font-size: 11.5px; }
.chip.trunc { overflow: hidden; text-overflow: ellipsis; display: inline-block; line-height: 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 8px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--muted); color: var(--text-2); }
.pill.pos { background: var(--pos-bg); color: var(--pos); }
.pill.neg { background: var(--neg-bg); color: var(--neg); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.info { background: var(--info-bg); color: var(--info); }
.pill.solid { background: var(--inv-bg); color: var(--inv-text); }
.chip.emu { background: var(--info-bg); color: var(--info); border-color: transparent; }
.chip.drop { background: var(--warn-bg); color: var(--warn); border-color: transparent; }

/* ---------- overview ---------- */
.stepper { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.step { padding: 16px; border-right: 1px solid var(--border); min-width: 0; position: relative; }
.step:last-child { border-right: 0; }
.step-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.step-ic { width: 20px; height: 20px; border-radius: 10px; flex: none; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border-strong); color: var(--text-3); }
.step-ic svg { width: 12px; height: 12px; }
.step.done .step-ic { background: var(--inv-bg); border-color: var(--inv-bg); color: var(--inv-text); }
.step.running .step-ic { border-color: var(--info); color: var(--info); }
.step.running .step-ic::after { content: ""; width: 8px; height: 8px; border-radius: 4px; background: var(--info); animation: pulse 1.2s ease-in-out infinite; }
.step.error .step-ic { background: var(--neg-bg); border-color: var(--neg); color: var(--neg); }
.step.skipped .step-ic { border-style: dashed; }
.step-name { font-weight: 500; font-size: 13px; }
.step-status { font-size: 12px; color: var(--text-2); }
.step.error .step-status { color: var(--neg); }
.step-counts { font-size: 12px; line-height: 18px; color: var(--text-2); }
.step-counts .num { color: var(--text); font-size: 12px; }
.step-msg { font-size: 12px; line-height: 16px; color: var(--text-3); margin-top: 4px; overflow-wrap: anywhere; }
.step.running { background: var(--subtle); }
.step-bar { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: transparent; }
.step.running .step-bar { background: var(--info); }
.step.error .step-bar { background: var(--neg); }

.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: 2fr 1fr 1fr 1fr; }
.kpi { padding: 20px; min-width: 0; }
.kpi-label { color: var(--text-2); font-size: 13px; }
.kpi-value { font: 400 32px/40px var(--mono); letter-spacing: -0.02em; margin-top: 8px; font-variant-numeric: tabular-nums; }
.kpi-value small { font-size: 14px; color: var(--text-2); letter-spacing: 0; margin-left: 4px; }
.kpi-sub { color: var(--text-2); font-size: 12px; margin-top: 4px; line-height: 16px; }
.kpi-pair { display: grid; grid-template-columns: 1fr 1fr; }
.kpi-pair > .kpi + .kpi { border-left: 1px solid var(--border); }
.kpi-foot { grid-column: 1 / -1; border-top: 1px solid var(--border); padding: 10px 20px; font-size: 12px; color: var(--text-2); background: var(--subtle); border-radius: 0 0 12px 12px; }
.delta { font-family: var(--mono); font-size: 12px; color: var(--pos); }

.funnel { padding: 8px 20px; }
.frow { display: grid; grid-template-columns: 180px 1fr 64px; gap: 16px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
.frow:last-child { border-bottom: 0; }
.flabel { font-size: 13px; }
.flabel .meta { display: block; font-size: 12px; line-height: 16px; }
.ftrack { height: 12px; background: var(--muted); border-radius: 4px; overflow: hidden; }
.ffill { height: 100%; border-radius: 4px; background: var(--text-2); min-width: 2px; }
.ffill.z { min-width: 0; }
.ffill.all { background: var(--border-strong); }
.ffill.serv { background: var(--text-2); }
.ffill.moved { background: var(--pos); }
.ffill.review { background: var(--warn); }
.ffill.kept { background: var(--text-3); }
.fnum { text-align: right; font: 400 16px/24px var(--mono); font-variant-numeric: tabular-nums; }
.two { grid-template-columns: 3fr 2fr; }
.list { margin: 0; padding: 0; list-style: none; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
.li:last-child { border-bottom: 0; }
.li-main { flex: 1; min-width: 0; }
.li-title { font-size: 14px; }
.li-sub { color: var(--text-2); font-size: 12px; line-height: 16px; margin-top: 2px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; }
.kv dt { color: var(--text-2); }
.kv dd { margin: 0; font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }

/* ---------- tables ---------- */
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; }
.seg button { appearance: none; border: 0; background: var(--bg); height: 30px; padding: 0 12px; font-size: 13px; color: var(--text-2); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--muted); color: var(--text); }
.seg .num { font-size: 11.5px; color: var(--text-3); }
.input { height: 32px; border: 1px solid var(--border-strong); border-radius: 8px; padding: 0 10px; background: var(--bg); min-width: 0; }
.input::placeholder { color: var(--text-3); }
.input:focus { outline: none; border-color: var(--text-2); }
.tbl-wrap { position: relative; overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--text-2); font-size: 12px; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--subtle); white-space: nowrap; }
td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--subtle); }
td.site { font-family: var(--mono); font-size: 12px; min-width: 220px; }
td.nw { white-space: nowrap; }
td.site .ln { color: var(--text-3); }
td.reason { color: var(--text-2); min-width: 300px; max-width: 440px; }
td .mono { font-size: 12px; }
.empty { padding: 40px 20px; text-align: center; color: var(--text-2); }

/* ---------- diff ---------- */
.diff { font: 400 12px/18px var(--mono); overflow-x: auto; background: var(--bg); }
.diff table { font: inherit; width: 100%; min-width: max-content; }
.diff td { padding: 0 8px; border: 0; white-space: pre; vertical-align: top; }
.diff tbody tr:hover td { background: inherit; }
.diff td.n { color: var(--text-3); text-align: right; user-select: none; width: 1%; min-width: 40px; }
.diff tr.add td { background: var(--add-bg); }
.diff tr.del td { background: var(--del-bg); }
.diff tr.add td.c::before { content: "+"; color: var(--pos); padding-right: 8px; }
.diff tr.del td.c::before { content: "-"; color: var(--neg); padding-right: 8px; }
.diff tr.ctx td.c::before { content: " "; padding-right: 8px; }
.diff tr.hunk td { background: var(--hunk-bg); color: var(--text-2); padding-top: 4px; padding-bottom: 4px; }
.code { font: 400 12px/18px var(--mono); white-space: pre; overflow-x: auto; padding: 12px 16px; margin: 0; background: var(--subtle); }

.drawer-scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(880px, 100%); background: var(--bg); border-left: 1px solid var(--border); z-index: 41; display: flex; flex-direction: column; }
.drawer-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.drawer-files { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--subtle); }
.drawer-files button { font-family: var(--mono); font-size: 11.5px; }
.drawer-body { flex: 1; overflow: auto; }
.file-head { display: flex; align-items: center; gap: 8px; padding: 10px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--subtle); font: 500 12px/18px var(--mono); z-index: 1; }
.stat-add { color: var(--pos); font-family: var(--mono); }
.stat-del { color: var(--neg); font-family: var(--mono); }

/* ---------- cards ---------- */
.cards { display: grid; gap: 12px; }
.card { border: 1px solid var(--border); border-radius: 12px; background: var(--bg); }
.card.sel { border-color: var(--text-2); }
.card.decided { background: var(--subtle); }
.card-main { padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.card-head { display: flex; gap: 8px 12px; align-items: flex-start; flex-wrap: wrap; }
.card-title { flex: 1 1 240px; min-width: 0; }
.card-title h3 { overflow-wrap: anywhere; }
.card-meta { color: var(--text-2); font-size: 12.5px; margin-top: 4px; }
.card-meta .sep { color: var(--text-3); padding: 0 6px; }
.card-meta .num { font-size: 12px; color: var(--text); }
.check { width: 16px; height: 16px; margin: 4px 0 0; accent-color: var(--text); flex: none; cursor: pointer; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 24px; }
.fact-label { color: var(--text-3); font-size: 12px; line-height: 16px; margin-bottom: 4px; }
.fact-val { font-size: 13px; }
.impact { font-family: var(--mono); font-size: 15px; font-variant-numeric: tabular-nums; }
.impact.save { color: var(--pos); }
.impact.cost { color: var(--neg); }
.loses { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; }
.loses li { display: flex; gap: 8px; }
.loses li::before { content: ""; width: 6px; height: 6px; border-radius: 3px; background: var(--neg); margin-top: 7px; flex: none; }
.loses.none li::before { background: var(--pos); }
.ev { display: inline-flex; align-items: center; gap: 4px; }
.ev i { width: 8px; height: 8px; border-radius: 4px; border: 1px solid var(--border-strong); display: inline-block; }
.ev i.on { background: var(--text); border-color: var(--text); }
.ev i.need { border-color: var(--warn); border-style: dashed; }
.ev-lbl { font: 400 12px/16px var(--mono); color: var(--text-2); margin-left: 6px; }
.rule { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.rule .rid { font: 500 12px/16px var(--mono); }
.rule .chip { height: auto; min-height: 24px; padding-top: 3px; padding-bottom: 3px; white-space: normal; overflow-wrap: anywhere; display: inline-block; }
.chip { overflow: hidden; }
details.more { border-top: 1px solid var(--border); }
details.more > summary { list-style: none; cursor: pointer; padding: 10px 20px; color: var(--text-2); font-size: 13px; display: flex; gap: 8px; align-items: center; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); margin-right: 4px; transition: transform .12s; }
details.more[open] > summary::before { transform: rotate(45deg); }
details.more > summary:hover { color: var(--text); }
.more-body { padding: 0 20px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.more-body > * { min-width: 0; }
.more-body .diff, .more-body .code { border: 1px solid var(--border); border-radius: 8px; }
.ev-results { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13px; }
.ev-results li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.ev-results .lv { font: 500 11.5px/16px var(--mono); color: var(--text-2); width: 22px; flex: none; }
.ev-results .src { color: var(--text-3); font-size: 12px; }
.options { display: grid; gap: 6px; }
.opt { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
.opt .mono { font-size: 12px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 20px; border-top: 1px solid var(--border); }
.actions .spacer { min-width: 8px; }
.actions .note { color: var(--text-3); font-size: 12px; }
.inline-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 20px; border-top: 1px solid var(--border); background: var(--subtle); }
.inline-form .input { flex: 1; min-width: 200px; }
.inline-form input[type=date].input { flex: 0 0 auto; min-width: 160px; }
.decision { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); }
.group-title { display: flex; align-items: center; gap: 10px; margin: 24px 0 10px; font-size: 13px; color: var(--text-2); }
.group-title:first-of-type { margin-top: 0; }
.group-title .line { flex: 1; height: 1px; background: var(--border); }
.recom-only { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--info); background: var(--info-bg); border-radius: 8px; padding: 2px 8px; font-weight: 500; }
.cnr td.rid { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.cnr td.why { color: var(--text-2); }

#sticky { position: sticky; bottom: 0; z-index: 30; }
.sticky { border-top: 1px solid var(--border); background: var(--bg); }
.sticky .wrap { display: flex; align-items: center; gap: 12px; height: 64px; }
.sticky .sum { font-size: 13px; color: var(--text-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sticky .sum b { font-weight: 500; color: var(--text); font-family: var(--mono); }

.result { margin-bottom: 24px; }
.result-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
.result .code { background: var(--bg); border-radius: 0 0 12px 12px; max-height: 280px; overflow: auto; }

/* ---------- setup ---------- */
.setup-item { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 20px; }
.setup-item + .setup-item { border-top: 1px solid var(--border); }
.tick { width: 24px; height: 24px; border-radius: 12px; border: 1px solid var(--border-strong); display: inline-flex; align-items: center; justify-content: center; color: transparent; }
.tick svg { width: 12px; height: 12px; }

.values .vrow:last-child { border-bottom: 0; }

.setup-actions .btn { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.progress { height: 4px; background: var(--muted); border-radius: 2px; overflow: hidden; width: 160px; }
.progress > i { display: block; height: 100%; background: var(--text); }

.phase.err .big { color: var(--neg); }

  border-right: 1px solid var(--border-strong); transform: rotate(45deg); background: var(--bg); z-index: 1; }
.run-foot { display: flex; gap: 24px; flex-wrap: wrap; padding: 12px 18px; border-top: 1px solid var(--border); background: var(--subtle); color: var(--text-2); font-size: 12.5px; grid-column: 1 / -1; }

@media (max-width: 960px) { .run { grid-template-columns: 1fr 1fr; } .phase { border-bottom: 1px solid var(--border); } .phase::after { display: none; } }

", \"\") for p in (m.get(\"content\") if isinstance(m.get(\"content\"), list) else [])\n+                                                  if isinstance(p, dict) and p.get(\"type\") == \"refusal\")\n+            if refusal:\n+                parts = ([{\"type\": \"output_text\", \"text\": text}] if text else []) + [{\"type\": \"refusal\", \"refusal\": refusal}]\n+                items.append({\"role\": \"assistant\", \"content\": parts})\n+            elif text:\n+                items.append({\"role\": \"assistant\", \"content\": text})\n+            for tc in m.get(\"tool_calls\") or []:\n+                if tc.get(\"type\", \"function\") != \"function\":\n+                    raise Untranslatable(\"assistant tool_call type %r\" % tc.get(\"type\"))\n+                fn = tc.get(\"function\") or {}\n+                items.append({\"type\": \"function_call\", \"call_id\": tc.get(\"id\"), \"name\": fn.get(\"name\"),\n+                              \"arguments\": fn.get(\"arguments\") if isinstance(fn.get(\"arguments\"), str) else json.dumps(fn.get(\"arguments\") or {})})\n+            fc = m.get(\"function_call\")  # legacy functions API\n+            if fc:\n+                cid = \"call_legacy_%d\" % i\n+                call_ids[fc.get(\"name\")] = cid\n+                items.append({\"type\": \"function_call\", \"call_id\": cid, \"name\": fc.get(\"name\"), \"arguments\": fc.get(\"arguments\") or \"{}\"})\n+        elif role == \"tool\":\n+            items.append({\"type\": \"function_call_output\", \"call_id\": m.get(\"tool_call_id\"), \"output\": _text_of(m.get(\"content\"))})\n+        elif role == \"function\":\n+            items.append({\"type\": \"function_call_output\", \"call_id\": call_ids.get(m.get(\"name\"), \"call_legacy\"), \"output\": _text_of(m.get(\"content\"))})\n+        else:\n+            raise Untranslatable(\"role %r\" % role)\n+    out = {\"model\": router_model, \"input\": items}\n+    if mot is not None:\n+        out[\"max_output_tokens\           js = rf.get(\"json_schema\") or {}\n+            fmt = {\"type\": \"json_schema\", \"name\": js.get(\"name\") or \"response\", \"schema\": js.get(\"schema\") or {}}\n+            for k in (\"strict\", \"description\"):\n+                if js.get(k) is not None:\n+                    fmt[k] = js[k]\n+        out[\"text\"] = {\"format\": fmt}\n+    if body.get(\"verbosity\"):\n+        out.setdefault(\"text\", {})[\"verbosity\"] = body[\"verbosity\"]\n+    effort = body.get(\"reasoning_effort\")\n+    if effort and info.get(\"r\"):\n+        if not (owned_by == \"anthropic\" and out.get(\"max_output_tokens\", 4096) \u003c 1100):  # Claude needs room for thinking [measured]\n+            out[\"reasoning\"] = {\"effort\": effort}\n+    stops = body.get(\"stop\")\n+    stops = [stops] if isinstance(stops, str) else [s for s in (stops or []) if s]\n+    if stops and owned_by != \"openai\":\n+        out[\"stop\"] = stops  # honored by non-OpenAI models [measured]; OpenAI models 501, so emulated client-side below\n+    meta = dict(body.get(\"metadata\") or {})\n+    if feature and \"feature\" not in meta and len(meta) \u003c 16:  # metadata is capped at 16 keys\n+        meta[\"feature\"] = feature\n+    if meta:\n+        out[\"metadata\"] = {k: str(v)[:512] for k, v in meta.items()}\n+    if owned_by == \"anthropic\" and \"prompt_cache_key\" not in out and feature:\n+        out[\"prompt_cache_key\"] = feature  # Claude via Responses does not cache without it [measured]\n+    if body.get(\"stream\"):\n+        out[\"stream\"] = True\n+    _service_tier(out)\n+    ctx = {\"stops\": stops if owned_by == \"openai\" else [], \"include_usage\": bool((body.get(\"stream_options\") or {}).get(\"include_usage\")),\n+           \"model\": body.get(\"model\"), \"legacy_functions\": bool(body.get(\"functions\"))}\n+    return out, ctx\n+\n+\n+def _service_tier(out):\n+    \"\"\"Default tier unless the caller chose one: the account-level flex default adds latency the original call never had [measured].\n+    ROUTER_MIGRATE_SERVICE_TIER overrides; 'auto' leaves it to the account default.\"\"\"\n+    tier = (os.environ.get(\"ROUTER_MIGRATE_SERVICE_TIER\") or \"default\").strip()\n+    if \"service_tier\" not in out and tier != \"auto\":\n+        out[\"service_tier\"] = tier\n+\n+\n+# ------------------------------------------------------------------------------------------------ v2 compiled policy\n+# router.policy.json (repo root) is compiled by `router-migrate apply --decisions` into router_policy.py beside this file.\n+# No compiled policy, an invalid one, or ROUTER_MIGRATE_POLICY=off =\u003e exactly v1 behaviour. Semantics: CONTRACTS.md section 1.\n+_POLICY_KEYS = {\"allow_flex_tier\", \"prompt_cache_key\", \"metadata\", \"fallbacks\", \"provider_timeout\"}\n+_POLICY_STATE = {\"loaded\": False, \"policy\": None, \"hash\": None, \"valid\": False, \"logged\": set()}\n+\n+\n+def _policy_log(key, msg):\n+    if key not in _POLICY_STATE[\"logged\"]:\n+        _POLICY_STATE[\"logged\"].add(key)\n+        sys.stderr.write(\"router-migrate policy %s\\n\" % msg)\n+\n+\n+def _valid_entry(e):\n+    if not isinstance(e, dict) or set(e) - _POLICY_KEYS:\n+        return False\n+    if \"allow_flex_tier\" in e and not isinstance(e[\"allow_flex_tier\"], bool):\n+        return False\n+    if \"prompt_cache_key\" in e and not (isinstance(e[\"prompt_cache_key\"], str) and e[\"prompt_cache_key\"]):\n+        return False\n+    if \"metadata\" in e and not (isinstance(e[\"metadata\"], dict) and all(isinstance(k, str) and isinstance(v, str) for k, v in e[\"metadata\"].items())):\n+        return False\n+    if \"fallbacks\" in e and not (isinstance(e[\"fallbacks\"], list) and 1 \u003c= len(e[\"fallbacks\"]) \u003c= 14 and all(isinstance(x, str) and x for x in e[\"fallbacks\"])):\n+        return False\n+    if \"provider_timeout\" in e:\n+        t = e[\"provider_timeout\"]\n+        if isinstance(t, bool) or not isinstance(t, (int, float)) or not 1 \u003c= t \u003c= 660:\n+            return False\n+    return True\n+\n+\n+def policy_valid(p):\n+    if not isinstance(p, dict) or p.get(\"version\") != 1 or set(p) - {\"version\", \"defaults\", \"globs\", \"features\"}:\n+        return False\n+    if \"defaults\" in p and not _valid_entry(p[\"defaults\"]):\n+        return False\n+    for k in (\"globs\", \"features\"):\n+        if k in p and not (isinstance(p[k], dict) and all(isinstance(n, str) and _valid_entry(e) for n, e in p[k].items())):\n+            return False\n+    return True\n+\n+\n+def set_policy(policy, policy_hash=None):\n+    \"\"\"Install a policy (what router_policy.py does on import; tests use it directly). None removes it.\"\"\"\n+    _POLICY_STATE.update(loaded=True, policy=policy, hash=policy_hash, valid=policy is not None and policy_valid(policy), logged=set())\n+\n+\n+def _load_policy():\n+    if not _POLICY_STATE[\"loaded\"]:\n+        _POLICY_STATE[\"loaded\"] = True\n+        mod = None\n+        try:\n+            if __package__:\n+                mod = importlib.import_module(__package__ + \".router_policy\")\n+            else:\n+                raise ImportError\n+        except Exception:\n+            try:  # sibling file (runtime imported as a top-level module or by path)\n+                import importlib.util as _u\n+                p = os.path.join(os.path.dirname(os.path.abspath(__file__)), \"router_policy.py\")\n+                if os.path.exists(p):\n+                    spec = _u.spec_from_file_location(\"_router_migrate_policy\", p)\n+                    mod = _u.module_from_spec(spec)\n+                    spec.loader.exec_module(mod)\n+            except Exception:\n+                mod = None\n+        if mod is not None and hasattr(mod, \"POLICY\"):\n+            pol = getattr(mod, \"POLICY\")\n+            _POLICY_STATE.update(policy=pol, hash=getattr(mod, \"POLICY_HASH\", None), valid=policy_valid(pol))\n+    if (os.environ.get(\"ROUTER_MIGRATE_POLICY\") or \"\").strip().lower() in (\"off\", \"0\", \"false\", \"no\"):\n+        return None\n+    if _POLICY_STATE[\"policy\"] is None:\n+        return None\n+    h8 = str(_POLICY_STATE[\"hash\"] or \"(no hash)\")[:8]\n+    if not _POLICY_STATE[\"valid\"]:\n+        _policy_log(\"invalid\", \"%s invalid: ignored (v1 behaviour)\" % h8)\n+        return None\n+    _policy_log(\"hash\", h8)\n+    return _POLICY_STATE[\"policy\"]\n+\n+\n+def _glob_re(pat):\n+    out, i = \"\", 0\n+    while i \u003c len(pat):\n+        if pat.startswith(\"**\", i):\n+            out, i = out + \".*\", i + 2\n+        elif pat[i] == \"*\":\n+            out, i = out + \"[^/]*\", i + 1\n+        elif pat[i] == \"?\":\n+            out, i = out + \"[^/]\", i + 1\n+        else:\n+            out, i = out + re.escape(pat[i]), i + 1\n+    return re.compile(\"^\" + out + \"$\")\n+\n+\n+def policy_for(feature, policy=None):\n+    \"\"\"Effective settings for a feature id: exact feature \u003e longest matching glob \u003e defaults, per key; metadata merged.\"\"\"\n+    p = policy if policy is not None else _load_policy()\n+    if not p:\n+        return {}\n+    layers = [p.get(\"defaults\") or {}]\n+    if feature:\n+        globs = sorted(((g, e) for g, e in (p.get(\"globs\") or {}).items() if _glob_re(g).match(feature)), key=lambda x: (len(x[0]), x[0]))\n+        layers += [e for _, e in globs]\n+        if feature in (p.get(\"features\") or {}):\n+            layers.append(p[\"features\"][feature])\n+    eff, meta = {}, {}\n+    for e in layers:\n+        for k, v in e.items():\n+            if k == \"metadata\":\n+                meta.update(v)\n+            else:\n+                eff[k] = v\n+    if meta:\n+        eff[\"metadata\"] = meta\n+    return eff\n+\n+\n+def _request_modalities(nb):\n+    mods = set()\n+    for it in nb.get(\"input\") if isinstance(nb.get(\"input\"), list) else []:\n+        for part in (it.get(\"content\") if isinstance(it, dict) and isinstance(it.get(\"content\"), list) e         return '<tr><td class="rid">' + esc(x.rule) + "</td><td>" + (scope.length ? '<div class="chips">' + scope.slice(0, 3).map(function (s) { return '<span class="chip mono trunc" title="' + esc(s) + '">' + esc(String(s).replace(/^(ts|py):/, "")) + "</span>"; }).join("") +
          (scope.length > 3 ? '<span class="chip">+' + (scope.length - 3) + "</span>" : "") + "</div>" : '<span class="meta">repo-wide</span>') + '</td><td class="why">' + esc(x.reason) + "</td></tr>";
      }).join("") + "</tbody></table></div></div>");
    return h.join("");
  }
  function renderSticky() {
    var el = document.getElementById("sticky");
    if (!B) { el.innerHTML = ""; return; }
    var pend = pendingApply().length, sel = selectedIds().length, n = pend + sel;
    if (S.tab !== "improve" && n === 0) { el.innerHTML = ""; return; }
    var parts = ['<b>' + fmtInt(pend) + "</b> approved, not applied"];
    if (LIVE) parts.push('<b>' + fmtInt(sel) + "</b> selected");
    el.innerHTML = '<div class="sticky"><div class="wrap"><div class="sum">' + (LIVE ? parts.join(" · ") : esc(FROZEN_NOTE)) + '</div><span class="spacer"></span>' +
      (LIVE && sel ? '<button class="btn lg" type="button" data-act="bulk"' + (S.busy ? " disabled" : "") + ">Approve " + sel + " selected</button>" : "") +
      '<button class="btn lg primary" type="button" data-act="apply"' + (!LIVE || !n || S.busy ? " disabled" : "") + (LIVE ? "" : ' title="' + esc(FROZEN_NOTE) + '"') + ">" +
      (S.busy ? "Working…" : "Apply " + n + " " + plural(n, "change")) + "</button></div></div>";
  }

  // ---------------- setup ----------------
  function renderSetup() {
    var items = setupItems(), done = items.filter(setupDone).length, h = [];
    h.push('<div class="page-head"><div><h1>Router setup</h1><div class="meta" style="margin-top:4px">Account settings the tool cannot change. Copy the exact values into the Router app; “Mark done” is saved in this browser only.</div></div>' +
      (items.length ? '<div style="display:flex;align-items:center;gap:12px"><span class="meta"><span class="num">' + done + "/" + items.length + '</span> done</span><div class="progress"><i style="width:' + (100 * done / items.length).toFixed(1) + '%"></i></div></div>' : "") + "</div>");
    if (!items.length) { h.push('<div class="pane empty">No account settings recommended.</div>'); return h.join(""); }
    h.push('<div class="pane">' + items.map(function (it) {
      var dn = setupDone(it), link = safeLink(it.link), vals = obj(it.values), ks = Object.keys(vals);
      var ap = arr(it.applies_to);
      return '<div class="setup-item' + (dn ? " done" : "") + '"><span class="tick">' + ICON.check + '</span><div style="min-width:0"><h3 class="setup-title">' + esc(it.title) +
        (it.na ? ' <span class="pill">not applicable here</span>' : (ap.length ? ' <span class="pill info">' + ap.length + " " + plural(ap.length, "feature") + "</span>" : "")) + "</h3>" +
        (it.why ? '<p class="setup-why">' + esc(it.why) + "</p>" : "") +
        (ap.length ? '<div class="applies"><span class="meta" style="font-size:12px">applies to</span>' + ap.slice(0, 6).map(function (f) { return '<span class="chip mono trunc" title="' + esc(f) + '">' + esc(f) + "</span>"; }).join("") +
          (ap.length > 6 ? '<span class="chip">+' + (ap.length - 6) + " more</span>" : "") + "</div>" : "") +
        (ks.length ? '<div class="values">' + ks.map(function (k) {
          var v = vals[k]; v = typeof v === "object" ? JSON.stringify(v) : String(v);
          return '<div class="vrow"><span class="vk">' + esc(k) + '</span><span class="vv">' + esc(v) + '</span><button class="btn ghost" type="button" data-act="copy" data-v="' + esc(v) + '">Copy</button></div>';
        }).join("") + "</div>" : "") +
        '<div class="setup-actions">' + (link ? '<a class="btn" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer" title="' + esc(link) + '">' + esc(linkLabel(link)) + " " + ICON.ext + "</a>" : "") +
        '<button class="btn' + (dn ? " on" : "") + '" type="button" data-act="setup-done" data-id="' + esc(it.id) + '">' + (dn ? "Done — undo" : "Mark done") + "</button>" +
        '<span class="meta mono" style="align-self:center;font-size:11.5px">' + esc(it.id) + "</span></div></div></div>";
    }).join("") + "</div>");
    return h.join("");
  }

  // ---------------- unsupported ----------------
  function renderUnsupported() {
    var u = arr(B.unsupported), groups = {}, order = [];
    u.forEach(function (x) { var s = String(obj(x).surface || "other").replace(/^framework\./, ""); if (!groups[s]) { groups[s] = []; order.push(s); } groups[s].push(x); });
    var h = ['<div class="page-head"><div><h1>Unsupported</h1><div class="meta" style="margin-top:4px">Production calls to endpoints Router does not serve. They stay on their provider and are not counted as unlockable.</div></div></div>'];
    if (!u.length) { h.push('<div class="pane empty">Every production call targets an endpoint Router serves.</div>'); return h.join(""); }
    order.forEach(function (s) {
      var list = groups[s];
      h.push('<div class="section"><div class="section-head"><h2>' + esc(s.charAt(0).toUpperCase() + s.slice(1).replace(/_/g, " ")) + '</h2><span class="meta"><span class="num">' + list.length + "</span> " + plural(list.length, "site") +
        (SURFACE_NOTE[s] ? " · " + esc(SURFACE_NOTE[s]) : "") + '</span></div><div class="tbl-wrap"><table><thead><tr><th>Site</th><th>Reason</th></tr></thead><tbody>' + list.map(function (x) {
          x = obj(x);
          return '<tr><td class="site">' + pathHtml(x.file || x.site) + (x.line ? '<span class="ln">:' + esc(x.line) + "</span>" : "") + '</td><td class="reason">' + esc(x.reason || "") + "</td></tr>";
        }).join("") + "</tbody></table></div></div>");
    });
    return h.join("");
  }

  // ---------------- render ----------------
  function renderAll() {
    S.pending = false;
    renderHeader();
    var main = document.getElementById("main");
    if (!B) {
      main.innerHTML = '<div class="pane empty" style="margin-top:40px"><h2>No data</h2><p class="meta" style="margin-top:8px">This page shows a router-migrate bundle. Run <span class="mono">router-migrate up</span> to open it with data.</p></div>';
      document.getElementById("sticky").innerHTML = ""; return;
    }
    var banner = "";
    if (LIVE && S.conn === "auth") banner = '<div class="banner neg">The session token was rejected. Re-run <code>router-migrate up</code> and use the new link.</div>';
    else if (LIVE && S.conn === "down") banner = '<div class="banner warn">Lost the local server. Decisions are paused until <code>router-migrate up</code> is running again.</div>';
    var fn = {overview: renderOverview, migration: renderMigration, improve: renderImprove, setup: renderSetup, unsupported: renderUnsupported}[S.tab] || renderOverview;
    var focusId = document.activeElement && document.activeElement.id === "site-q" ? "site-q" : null, caret = focusId ? document.activeElement.selectionStart : 0;
    main.innerHTML = banner + fn();
    if (focusId) { var q = document.getElementById(focusId); if (q) { q.focus(); try { q.setSelectionRange(caret, caret); } catch (e) {} } }
    renderSticky(); renderDrawer();
  }
  function setTab(t, push) {
    if (!TABS.some(function (x) { return x[0] === t; })) t = "overview";
    S.tab = t; S.drawer = null;
    if (push && location.hash !== "#" + t) { try { history.replaceState(null, "", location.pathname + location.search + "#" + t); } catch (e) {} }
    renderAll();
  }

  // ---------------- events ----------------
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-tab],[data-act]");
    if (!t) return;
    if (t.hasAttribute("data-tab") && !t.hasAttribute("data-act")) { setTab(t.getAttribute("data-tab"), true); window.scrollTo(0, 0); return; }
    var a = t.getAttribute("data-act"), id = t.getAttribute("data-id");
    if (a === "filter") { S.filter = t.getAttribute("data-v"); renderAll(); }
    else if (a === "drawer") { S.drawer = t.getAttribute("data-file"); renderDrawer(); var db = document.querySelector(".drawer-body"); if (db) db.scrollTop = 0; }
    else if (a === "close-drawer") { S.drawer = null; renderDrawer(); }
    else if (a === "select") { S.selected[id] = t.checked; renderSticky(); var card = t.closest(".card"); if (card) card.classList.toggle("sel", t.checked); }
    else if (a === "select-all") { var el = cards().filter(bulkEligible), allSel = selectedIds().length === el.length; S.selected = {}; if (!allSel) el.forEach(function (c) { S.selected[c.id] = true; }); renderAll(); }
    else if (a === "undecided") { S.undecidedOnly = !S.undecidedOnly; renderAll(); }
    else if (a === "lever") { var lk = t.getAttribute("data-k"); S.lever = S.lever === lk ? null : lk; S.showAll = !!S.lever; renderAll(); }
    else if (a === "show-all") { S.showAll = !S.showAll; renderAll(); }
    else if (a === "decide") { doDecide(id, t.getAttribute("data-a")); }
    else if (a === "form") {
      var k = t.getAttribute("data-k"), cur = S.form[id];
      if (cur && cur.k === k) delete S.form[id];
      else { var dflt = ""; if (k === "postpone") { var dt = new Date(Date.now() + 14 * 864e5); dflt = dt.toISOString().slice(0, 10); } S.form[id] = {k: k, v: dflt}; }
      renderAll(); var inp = document.querySelector('[data-form="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]'); if (inp) inp.focus();
    }
    else if (a === "form-cancel") { delete S.form[id]; renderAll(); }
    else if (a === "confirm") {
      var f = S.form[id]; if (!f) return;
      var v = String(f.v || "").trim();
      if (f.k === "dismiss") { if (!v) { toast("A reason is required to dismiss", true); return; } doDecide(id, "dismiss", {reason: v}); }
      else { if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { toast("Pick a date", true); return; } doDecide(id, "postpone", {until: v}); }
    }
    else if (a === "bulk") { doBulkApprove(); }
    else if (a === "apply") { doApply(); }
    else if (a === "close-result") { S.applyResult = null; renderAll(); }
    else if (a === "setup-done") {
      var it = setupItems().filter(function (x) { return x.id === id; })[0]; if (!it) return;
      store(setupKey(it), setupDone(it) ? "0" : "1"); renderAll();
    }
    else if (a === "copy") {
      var val = t.getAttribute("data-v");
      var ok = function () { var old = t.textContent; t.textContent = "Copied"; setTimeout(function () { t.textContent = old; }, 1200); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(val).then(ok, function () { toast("Copy failed", true); }); else toast(val);
    }
  });
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.id === "site-q") { S.q = t.value; renderAll(); }
    else if (t.hasAttribute("data-form")) { var f = S.form[t.getAttribute("data-form")]; if (f) f.v = t.value; }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && S.drawer) { S.drawer = null; renderDrawer(); }
    if (e.key === "Enter" && e.target.hasAttribute && e.target.hasAttribute("data-form")) { var b = e.target.parentNode.querySelector('[data-act="confirm"]'); if (b) b.click(); }
  });
  document.addEventListener("toggle", function (e) { var d = e.target; if (d.tagName === "DETAILS" && d.hasAttribute("data-key")) S.open[d.getAttribute("data-key")] = d.open; }, true);
  document.addEventListener("focusout", function () { setTimeout(function () { if (S.pending) { var ae = document.activeElement; if (!ae || !/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) renderAll(); } }, 0); });
  window.addEventListener("hashchange", function () { var h = location.hash.replace(/^#/, ""); if (h && h !== S.tab) setTab(h, false); });

  // ---------------- boot ----------------
  var h0 = location.hash.replace(/^#/, ""); if (h0) S.tab = h0;
  if (!TABS.some(function (x) { return x[0] === S.tab; })) S.tab = "overview";
  if (B) { try { S.lastText = JSON.stringify(B); } catch (e) {} }
  renderAll();
  if (LIVE) {
    refresh(false);
    setInterval(function () { if (document.visibilityState !== "hidden") refresh(false); }, 2000);
  }
})();
</script>
</body>
</html>
