<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>router-migrate</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #1B1A1A; --side: #211F1F; --panel: #242322; --panel-2: #2A2827; --hover: #2F2D2C;
  --line: #34312F; --line-2: #45423F;
  --text: #E8E4E0; --text-2: #ADA7A2; --text-3: #7E7874;
  --solar: #E4F222; --solar-hover: #D4E21A; --solar-ink: #1B1A1A; --solar-tint: rgba(228,242,34,.07); --solar-line: rgba(228,242,34,.42); --solar-text: #E6EE8A;
  --olive: #37321A; --olive-ink: #E8D46B;
  --green: #48C774; --green-tint: rgba(72,199,116,.10); --green-line: rgba(72,199,116,.5);
  --lilac: #B9A5EE; --lilac-tint: rgba(185,165,238,.10); --lilac-line: rgba(185,165,238,.45);
  --amber: #E5B85C; --amber-tint: rgba(229,184,92,.10); --amber-line: rgba(229,184,92,.45);
  --red: #E8866E; --red-tint: rgba(232,134,110,.10);
  --gray-line: rgba(173,167,162,.35);
  --add: rgba(72,199,116,.09); --add-strong: rgba(72,199,116,.24); --del: rgba(232,134,110,.08); --del-strong: rgba(232,134,110,.22);
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --r: 6px;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/21px var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; font-weight: 400; letter-spacing: -0.015em; }
p { margin: 0; }
a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
a:hover { text-decoration-color: currentColor; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--solar); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- shell: the Router console's frame ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 10px 12px; gap: 4px; }
.brand { display: flex; align-items: baseline; gap: 6px; padding: 0 10px 2px; }
.brand b { font: 600 17px/22px var(--sans); letter-spacing: -0.02em; }
.brand span { font: 400 11px/14px var(--mono); color: var(--text-3); }
.repo { padding: 10px 10px 14px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.repo-name { font: 500 14px/20px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.repo-meta { display: flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 12px; margin-top: 2px; }
.dot { width: 6px; height: 6px; border-radius: 3px; background: var(--text-3); flex: none; }
.dot.live { background: var(--green); animation: pulse 1.8s ease-in-out infinite; }
.dot.err { background: var(--red); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { appearance: none; border: 0; background: none; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: var(--r); color: var(--text-2); cursor: pointer; text-align: left; width: 100%; }
.nav-item:hover { background: var(--hover); color: var(--text); }
.nav-item[aria-current="page"] { background: var(--panel-2); color: var(--text); }
.nav-item .lbl { flex: 1; white-space: nowrap; }
.nav-item .cnt { font: 500 11px/16px var(--mono); color: var(--text-3); }
.nav-item .cnt.hot { color: var(--solar-ink); background: var(--solar); padding: 0 6px; border-radius: 9px; }
.side-spacer { flex: 1; }
.side-foot { border-top: 1px solid var(--line); margin: 6px -10px -12px; padding: 12px 20px 14px; }
.side-foot .v { font: 500 16px/22px var(--sans); }
.side-foot .k { color: var(--text-3); font-size: 12px; }
.meter { height: 3px; border-radius: 2px; background: var(--panel-2); margin-top: 8px; display: flex; overflow: hidden; gap: 2px; }
.meter i { display: block; height: 100%; background: var(--solar); }
.meter i.b { background: var(--lilac); }
.main { min-width: 0; }
.page { max-width: 1120px; margin: 0 auto; padding: 44px 48px 140px; }

/* ---------- page header ---------- */
.ph { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 28px; }
.ph-t { flex: 1; min-width: 0; }
.ph h1 { font-size: 34px; line-height: 42px; }
.ph .sub { color: var(--text-2); font-size: 16px; line-height: 24px; margin-top: 8px; max-width: 760px; }
.eyebrow { font: 500 11px/16px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }

/* ---------- tiles (console stat tiles) ---------- */
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 40px; }
.tile { appearance: none; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 14px 16px 15px; cursor: pointer; color: inherit; min-width: 0; }
.tile:hover { border-color: var(--line-2); }
.tile .k { color: var(--text-2); font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.tile .v { font-size: 26px; line-height: 32px; margin-top: 6px; letter-spacing: -0.02em; }
.tile .v small { font-size: 15px; color: var(--text-3); margin-left: 3px; }
.tile .s { color: var(--text-3); font-size: 12px; line-height: 17px; margin-top: 4px; }
.tile.hi { background: var(--solar-tint); border-color: var(--solar-line); }
.tile.hi .k, .tile.hi .v { color: var(--solar-text); }

/* ---------- sections ---------- */
.sec { margin-top: 44px; }
.sec:first-child { margin-top: 0; }
.sec-h { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 14px; }
.sec-h .t { flex: 1; min-width: 0; }
.sec-h h2 { font-size: 21px; line-height: 28px; }
.sec-h p { color: var(--text-2); margin-top: 4px; }
.panel { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); }
.link { appearance: none; background: none; border: 0; padding: 0; color: var(--text-2); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); white-space: nowrap; }
.link:hover { color: var(--text); text-decoration-color: currentColor; }

/* ---------- status vocabulary ---------- */
.st { --c: var(--text-3); --t: transparent; --l: var(--line-2); }
.st-lossless { --c: var(--green); --t: var(--green-tint); --l: var(--green-line); }
.st-agent { --c: var(--lilac); --t: var(--lilac-tint); --l: var(--lilac-line); }
.st-unlocked { --c: var(--solar); --t: var(--solar-tint); --l: var(--solar-line); }
.st-decide { --c: var(--amber); --t: var(--amber-tint); --l: var(--amber-line); }
.st-left { --c: var(--text-3); --t: transparent; --l: var(--gray-line); }
.sdot { width: 8px; height: 8px; border-radius: 4px; background: var(--c); flex: none; }
.st-left .sdot { background: transparent; border: 1.5px solid var(--text-3); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 4px; font-size: 12px; line-height: 16px; white-space: nowrap; border: 1px solid var(--line-2); color: var(--text-2); }
.pill.st { color: var(--c); background: var(--t); border-color: var(--l); }
.pill.live { color: var(--green); background: var(--green-tint); border-color: var(--green-line); }
.pill.solar { color: var(--solar-ink); background: var(--solar); border-color: var(--solar); font-weight: 500; }
.pill.warn { color: var(--amber); background: var(--amber-tint); border-color: var(--amber-line); }
.pill.agent { color: var(--lilac); background: var(--lilac-tint); border-color: var(--lilac-line); }
.save { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 3px; background: var(--solar); color: var(--solar-ink); font-size: 12px; font-weight: 500; white-space: nowrap; }
.save.neutral { background: var(--panel-2); color: var(--text-2); font-weight: 400; border: 1px solid var(--line-2); }
.save.cost { background: var(--red-tint); color: var(--red); }

/* ---------- flow diagram: how traffic moved ---------- */
.flow { position: relative; padding: 26px 24px 18px; overflow: hidden; background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 18px 18px; background-position: -9px -9px; }
.flow-grid { position: relative; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(90px, .9fr) minmax(0, 1fr); align-items: center; z-index: 1; }
.flow svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: visible; }
.wire { fill: none; stroke-width: 1.6; stroke-dasharray: 5 5; animation: flowdash 1.6s linear infinite; }
.wire.lossless { stroke: var(--green); }
.wire.agent { stroke: var(--lilac); }
.wire.unlocked { stroke: var(--solar); }
@keyframes flowdash { to { stroke-dashoffset: -20; } }
.fcol { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.fgroup { display: flex; flex-direction: column; gap: 8px; }
.fgroup .eyebrow { padding-left: 2px; }
.fnode { position: relative; display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--line-2); border-radius: var(--r); padding: 9px 12px; min-width: 0; cursor: pointer; }
.fnode:hover { border-color: var(--text-3); }
.fnode .fn { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fnode .sub { color: var(--text-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fnode .tx { min-width: 0; flex: 1; }
.fnode.left { border-style: dashed; opacity: .75; }
.fnode .stays { font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.router-node { justify-self: stretch; background: var(--bg); border: 1px solid var(--green-line); box-shadow: 0 0 0 4px rgba(72,199,116,.05); border-radius: 8px; padding: 18px 18px 16px; }
.router-node .nm { display: flex; align-items: center; gap: 8px; font-size: 18px; line-height: 24px; }
.router-node .host { color: var(--text-3); font-size: 12px; margin-top: 2px; }
.router-node .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.router-node .nochips { color: var(--text-3); font-size: 12px; margin-top: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 4px; font-size: 12px; background: var(--panel-2); color: var(--text-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.on { color: var(--green); border-color: var(--green-line); background: var(--green-tint); }
.chip svg.i { width: 13px; height: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--text-2); font-size: 12.5px; position: relative; z-index: 1; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend b { font-weight: 500; color: var(--text); }
.flow-empty { color: var(--text-2); padding: 20px 0; text-align: center; }
.flow-stay { position: relative; z-index: 1; margin-top: 22px; padding-top: 16px; border-top: 1px dashed var(--line-2); }
.stay-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.stay-grid .fnode { padding: 7px 10px; }
.stay-grid .fnode .stays { display: none; }

/* ---------- the two steps ---------- */
.steps { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.step { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 20px 22px 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.step-top { display: flex; align-items: center; gap: 12px; }
.ic { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; background: var(--olive); color: var(--olive-ink); flex: none; }
.ic.sm { width: 26px; height: 26px; border-radius: 5px; }
.ic.sm svg.i { width: 14px; height: 14px; }
.step-top h3 { font-size: 19px; line-height: 24px; }
.step-top .t { flex: 1; min-width: 0; }
.step p.d { color: var(--text-2); }
.segbar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; gap: 2px; background: transparent; }
.segbar i { display: block; height: 100%; background: var(--c); min-width: 3px; }
.segbar i.st-left { background: repeating-linear-gradient(135deg, var(--line-2) 0 2px, transparent 2px 5px); border: 1px solid var(--line-2); }
.segbar i.st-agent { background: repeating-linear-gradient(135deg, var(--lilac) 0 3px, rgba(185,165,238,.55) 3px 6px); }
.segbar.lg { height: 14px; }
.counts { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--text-2); font-size: 12.5px; }
.counts span { display: inline-flex; align-items: center; gap: 6px; }
.counts b { color: var(--text); font-weight: 500; }
.step-foot { display: flex; align-items: center; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line); margin-top: auto; color: var(--text-3); font-size: 12.5px; }
.step-foot .sp { flex: 1; }
.lev-row { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.lev { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px 8px; border-radius: 5px; border: 1px solid var(--line); background: var(--bg); text-align: center; min-width: 0; }
.lev .ln { font-size: 11.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.lev .ls { font: 500 11px/14px var(--mono); color: var(--text-3); }
.lev.live { border-color: var(--green-line); }
.lev.live .ls { color: var(--green); }
.lev.wait .ls { color: var(--solar-text); }
.lev.none { opacity: .55; }
.lev svg.i { color: var(--text-2); }
.lev.live svg.i { color: var(--green); }

/* ---------- lists: decisions + assumptions on the overview ---------- */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .tx { flex: 1; min-width: 0; }
.row .tt { font-weight: 500; }
.row .ss { color: var(--text-2); font-size: 13px; margin-top: 2px; }
.row .ic.sm { margin-top: 1px; }
.empty { color: var(--text-2); padding: 22px 18px; }
.empty b { color: var(--text); font-weight: 500; }

/* ---------- call rows (Migrate) ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 6px; }
.fchip { appearance: none; display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--line-2); background: none; color: var(--text-2); cursor: pointer; font-size: 13px; }
.fchip:hover { color: var(--text); border-color: var(--text-3); }
.fchip[aria-pressed="true"] { background: var(--panel-2); color: var(--text); border-color: var(--text-3); }
.fchip .n { font: 500 11px/16px var(--mono); color: var(--text-3); }
.group { margin-top: 30px; }
.group-h { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.group-h .eyebrow { color: var(--c); }
.group-h p { color: var(--text-3); font-size: 13px; }
.calls { display: flex; flex-direction: column; gap: 10px; }
.call { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 15px 18px 16px; border-left: 2px solid var(--c); scroll-margin-top: 24px; }
.call-h { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.call-t { min-width: 0; flex: 1 1 220px; }
.call-t .fn { font-size: 15px; font-weight: 500; }
.call-t .loc { color: var(--text-3); }
.route { display: inline-flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; white-space: nowrap; }
.route svg.i { width: 14px; height: 14px; color: var(--c); }
.route .dest { color: var(--text); }
.route .x { color: var(--text-3); }
.mchip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); color: var(--text-2); white-space: nowrap; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
.mchip em { font-style: normal; color: var(--green); font-size: 11px; }
.mchip em.rt { color: var(--text-3); }
.call .why { color: var(--text-2); margin-top: 10px; }
.quote { display: flex; gap: 10px; margin-top: 12px; padding: 10px 12px; border-radius: 5px; background: var(--lilac-tint); border: 1px solid rgba(185,165,238,.18); }
.quote svg.i { color: var(--lilac); margin-top: 2px; }
.quote .qt { color: var(--text); font-size: 13px; }
.quote .qt b { font-weight: 500; color: var(--lilac); }
.evs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.ev { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 3px; background: var(--bg); border: 1px solid var(--line); color: var(--text-2); font: 400 11.5px/16px var(--mono); }

/* ---------- stylized code change ---------- */
.code { margin-top: 12px; border: 1px solid var(--line); border-radius: 5px; background: #191818; overflow: hidden; }
.code + .code { margin-top: 8px; }
.code-h { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--line); color: var(--text-3); font-size: 12px; }
.code-h .f { font-family: var(--mono); font-size: 11.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.code-h .by { font: 500 10.5px/14px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.code-b { padding: 6px 0; font: 400 12.5px/20px var(--mono); }
.cl { display: flex; padding: 0 12px 0 0; }
.cl .sg { width: 26px; flex: none; text-align: center; color: var(--text-3); user-select: none; }
.cl .tx { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; color: var(--text-2); }
.cl.add { background: var(--add); }
.cl.add .sg { color: var(--green); }
.cl.add .tx { color: var(--text); }
.cl.del { background: var(--del); }
.cl.del .sg { color: var(--red); }
.cl.del .tx { color: var(--text-3); }
.cl ins { text-decoration: none; background: var(--add-strong); color: #DDF5E4; border-radius: 2px; }
.cl del { text-decoration: line-through; text-decoration-color: rgba(232,134,110,.6); background: var(--del-strong); color: #F2D3CA; border-radius: 2px; }
.cl.ctx .tx { color: var(--text-3); }

/* ---------- request diff ---------- */
.req { font: 400 12.5px/21px var(--mono); border: 1px solid var(--line); border-radius: 5px; background: #191818; padding: 6px 0; }
.req .br { color: var(--text-3); padding-left: 26px; }
.kv { display: flex; padding-right: 12px; }
.kv .sg { width: 26px; text-align: center; flex: none; color: var(--text-3); }
.kv .k { color: var(--text-2); padding-left: 12px; }
.kv .k::after { content: ":"; color: var(--text-3); margin-right: 8px; }
.kv .v { color: var(--text-2); overflow-wrap: anywhere; min-width: 0; }
.kv.add { background: var(--add); }
.kv.add .sg, .kv.add .k { color: var(--green); }
.kv.add .v { color: var(--text); }
.kv.del { background: var(--del); }
.kv.del .sg { color: var(--red); }
.kv.del .k, .kv.del .v { color: var(--text-3); text-decoration: line-through; text-decoration-color: rgba(232,134,110,.5); }

/* ---------- improvement cards (strategy cards) ---------- */
.levers { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-bottom: 8px; }
.lcard { appearance: none; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 12px 12px 11px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; color: inherit; min-width: 0; }
.lcard:hover { border-color: var(--line-2); }
.lcard[aria-pressed="true"] { border-color: var(--text-3); background: var(--panel-2); }
.lcard .nm { font-weight: 500; font-size: 13.5px; }
.lcard .hn { color: var(--text-3); font-size: 12px; line-height: 16px; }
.lcard .stt { font: 500 11.5px/16px var(--mono); color: var(--text-3); margin-top: auto; }
.lcard .stt.live { color: var(--green); }
.lcard .stt.wait { color: var(--solar-text); }
.imps { display: flex; flex-direction: column; gap: 12px; }

.blk .lbl { font: 500 10.5px/14px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); margin-bottom: 7px; display: flex; gap: 8px; align-items: center; }

.notes { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }

.note svg.i { margin-top: 2px; width: 15px; height: 15px; }
.note.agent svg.i { color: var(--lilac); }
.note.trade svg.i { color: var(--amber); }
.note.choice { padding: 10px 12px; border-radius: 5px; background: var(--amber-tint); border: 1px solid rgba(229,184,92,.25); color: var(--text); }
.note.choice svg.i { color: var(--amber); }
.note b { color: var(--text); font-weight: 500; }

.imp-f .meta { color: var(--text-3); font-size: 12.5px; }
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 4px; border: 1px solid var(--line-2); background: transparent; color: var(--text); cursor: pointer; white-space: nowrap; font-size: 13px; }
.btn:hover:not(:disabled) { border-color: var(--text-3); background: var(--hover); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--solar); border-color: var(--solar); color: var(--solar-ink); font-weight: 500; }
.btn.primary:hover:not(:disabled) { background: var(--solar-hover); border-color: var(--solar-hover); }
.btn.ghost { border-color: transparent; color: var(--text-2); padding: 0 8px; }
.btn.ghost:hover:not(:disabled) { color: var(--text); background: var(--hover); border-color: transparent; }
.btn.lg { height: 40px; padding: 0 18px; font-size: 14px; }
.form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.form input { height: 32px; border-radius: 4px; border: 1px solid var(--line-2); background: var(--bg); padding: 0 10px; min-width: 240px; }
details.more { margin-top: 12px; }
details.more > summary { cursor: pointer; color: var(--text-3); font-size: 12.5px; list-style: none; display: inline-flex; align-items: center; gap: 6px; }
details.more > summary::-webkit-details-marker { display: none; }

.more-b { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; color: var(--text-2); font-size: 13px; }
.facts { margin: 0; padding-left: 18px; }

.badge-sug { font: 500 10.5px/14px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--solar-ink); background: var(--solar); padding: 2px 6px; border-radius: 3px; }

/* ---------- result / banners / sticky / toast ---------- */
.banner { padding: 12px 16px; border-radius: 5px; border: 1px solid var(--line-2); color: var(--text-2); margin-bottom: 18px; }
.banner.warn { border-color: var(--amber-line); background: var(--amber-tint); color: var(--text); }

    h.push('<header class="ph"><div class="ph-t"><h1>Audit trail</h1><p class="sub">Everything behind the summary: what the agent claimed and judged, with the lines it read, and every file the run changed.</p></div></header>');
    if (a.length) h.push('<section class="sec"><div class="sec-h"><div class="t"><h2>Agent judgments</h2><p>How each moved call is used, as the agent read it. Improvements rest on these.</p></div></div><div class="panel tbl-wrap"><table class="tbl"><thead><tr><th>Feature</th><th>Judgment</th><th>Agent’s reason</th><th>Read</th></tr></thead><tbody>' +
      a.map(function (x) { return '<tr><td class="mono">' + esc(x.fn) + '</td><td><div>' + esc(x.text) + '</div><div style="color:var(--text-3);font-size:12px">' + esc(x.label) + ": " + esc(x.value) + "</div></td><td style=\"color:var(--text-2)\">" + esc(trim(x.why, 400)) + "</td><td>" + evHtml(x.evidence) + "</td></tr>"; }).join("") + "</tbody></table></div></section>");
    if (claims.length) {
      var r = obj(L.result), f = obj(L.finish);
      h.push('<section class="sec"><div class="sec-h"><div class="t"><h2>Agent claims</h2><p>' + claims.length + " decisions on call sites, each checked by the tool. " + fmtInt(r.migrated_confirmed_claims || 0) + " moves confirmed, " + fmtInt(r.overridden_to_not_migrated || 0) + " overridden. Gate " + (f.last_ok ? "passed" : "not passed") + (f.reverted ? " (agent edits reverted)" : "") + '.</p></div></div><div class="panel tbl-wrap"><table class="tbl"><thead><tr><th>Site</th><th>Agent said</th><th>Tool says</th><th>Why</th><th>Read</th></tr></thead><tbody>' +
        claims.map(function (x) { return '<tr><td class="mono">' + esc(base(x.file)) + ":" + esc(x.line) + '</td><td><span class="pill">' + esc(x.outcome) + "</span>" + (x.reason_code ? '<div class="mono" style="color:var(--text-3);margin-top:4px">' + esc(x.reason_code) + "</div>" : "") + "</td><td style=\"color:var(--text-2)\">" + esc(x.verdict || x.tool_outcome || "not seen") + (x.confirmed ? " · " + esc(x.confirmed) : "") + "</td><td style=\"color:var(--text-2)\">" + esc(trim(x.why, 300)) + "</td><td>" + evHtml(x.evidence) + "</td></tr>"; }).join("") + "</tbody></table></div></section>");
    }
    var mg = obj(R.migrate), im = obj(R.improve);
    if (mg.usd != null || im.usd != null) h.push('<section class="sec"><div class="sec-h"><div class="t"><h2>Cost and time</h2></div></div><div class="panel tbl-wrap"><table class="tbl"><thead><tr><th>Phase</th><th>Agent spend</th><th>Time</th><th>Turns</th></tr></thead><tbody>' +
      [["Migrate", mg], ["Improve", im]].map(function (p) { return "<tr><td>" + p[0] + '</td><td class="num">' + usd(p[1].usd) + '</td><td class="num">' + (p[1].minutes != null ? p[1].minutes + " min" : "–") + '</td><td class="num">' + fmtInt(p[1].turns) + "</td></tr>"; }).join("") + "</tbody></table></div></section>");
    h.push('<section class="sec"><div class="sec-h"><div class="t"><h2>Every file changed</h2><p>' + files.length + " " + plural(files.length, "file") + ": the rules’ floor, the agent’s edits and applied decisions.</p></div></div>" +
      (files.length ? '<div class="panel">' + files.map(function (f) { return '<details class="fdiff"><summary><span class="f">' + esc(f.file) + '</span><span class="plus">+' + f.add + '</span><span class="minus">−' + f.del + "</span></summary>" + diffTable(f.rows) + "</details>"; }).join("") + "</div>" : '<div class="panel empty">No file changes.</div>') + "</section>");
    return h.join("");
  }

  // ---------------- sticky apply bar ----------------
  function renderSticky() {
    var el = document.getElementById("sticky"), n = approvedNotApplied().length;
    if (!B || !n || S.tab === "setup" || S.tab === "audit") { el.innerHTML = ""; return; }
    el.innerHTML = '<div class="sticky"><div class="sticky-in"><span class="tx"><b>' + n + "</b> approved " + plural(n, "change") + " not in the code yet</span><span class=\"sp\"></span>" +
      (LIVE ? "" : '<span class="tx" style="font-size:12.5px">' + esc(FROZEN_NOTE) + "</span>") +
      '<button class="btn primary lg" type="button" data-act="apply"' + (!LIVE || S.busy ? " disabled" : "") + ">Apply " + n + " " + plural(n, "change") + "</button></div></div>";
  }

  // ---------------- render ----------------
  function renderAll() {
    S.pending = false;
    renderSide();
    var main = document.getElementById("main");
    if (!B) {
      main.innerHTML = '<header class="ph"><div class="ph-t"><h1>No data</h1><p class="sub">This page shows a router-migrate run. Run <code>router-migrate run . --agent claude</code> (or <code>router-migrate up</code>) to open it with data.</p></div></header>';
      document.getElementById("sticky").innerHTML = ""; return;
    }
    var banner = "";
    if (LIVE && S.conn === "auth") banner = '<div class="banner neg">The session token was rejected. Re-run the command and open the new link.</div>';
    else if (LIVE && S.conn === "down") banner = '<div class="banner warn">Lost the local server. Decisions are paused until it is running again.</div>';
    if (B.view_error) banner += '<div class="banner warn">Part of this view could not be built: ' + esc(B.view_error) + "</div>";
    var fn = {overview: renderOverview, migrate: renderMigrate, improve: renderImprove, decisions: renderDecisions, setup: renderSetup, audit: renderAudit}[S.tab] || renderOverview;
    main.innerHTML = banner + fn();
    renderSticky();
    if (S.tab === "overview") requestAnimationFrame(drawFlow);
  }
  function setTab(t, push) {
    t = ALIAS[t] || t;
    if (!PAGES.concat(MORE).some(function (x) { return x[0] === t; })) t = "overview";
    S.tab = t;
    if (push && location.hash !== "#" + t) { try { history.replaceState(null, "", location.pathname + location.search + "#" + t); } catch (e) {} }
    renderAll();
  }
  function goTo(id) {
    var el = document.getElementById(id); if (!el) return;
    el.scrollIntoView({block: "start", behavior: "smooth"});
    el.animate && el.animate([{boxShadow: "0 0 0 2px var(--solar-line)"}, {boxShadow: "0 0 0 0 transparent"}], {duration: 1400});
  }

  // ---------------- events ----------------
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-tab],[data-act],[data-goto]");
    if (!t) return;
    if (t.hasAttribute("data-tab") && !t.hasAttribute("data-act")) {
      var g = t.getAttribute("data-goto"); setTab(t.getAttribute("data-tab"), true);
      if (g) requestAnimationFrame(function () { goTo(g); }); else window.scrollTo(0, 0);
      return;
    }
    if (t.hasAttribute("data-goto") && !t.hasAttribute("data-act")) { setTab("migrate", true); var gid = t.getAttribute("data-goto"); requestAnimationFrame(function () { goTo(gid); }); return; }
    var a = t.getAttribute("data-act"), id = t.getAttribute("data-id");
    if (a === "filter") { S.filter = t.getAttribute("data-v"); renderAll(); }
    else if (a === "lever") { var k = t.getAttribute("data-k"); S.lever = S.lever === k ? null : k; renderAll(); }
    else if (a === "decide") doDecide(id, t.getAttribute("data-a"));
    else if (a === "approve-safe") doApproveMany(waiting().filter(safeOne).map(function (i) { return i.id; }));
    else if (a === "apply") doApply();
    else if (a === "close-result") { S.applyResult = null; renderAll(); }
    else if (a === "form") {
      var kk = t.getAttribute("data-k"), cur = S.form[id];
      if (cur && cur.k === kk) delete S.form[id];
      else S.form[id] = {k: kk, v: kk === "postpone" ? new Date(Date.now() + 14 * 864e5).toISOString().slice(0, 10) : ""};
      renderAll(); var inp = document.querySelector('[data-form="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]'); if (inp) inp.focus();
    }
    else if (a === "form-cancel") { delete S.form[id]; renderAll(); }
    else if (a === "confirm") {
      var f = S.form[id]; if (!f) return; var v = String(f.v || "").trim();
      if (f.k === "dismiss") { if (!v) { toast("A reason is required to dismiss", true); return; } doDecide(id, "dismiss", {reason: v}); }
      else { if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { toast("Pick a date", true); return; } doDecide(id, "postpone", {until: v}); }
    }
    else if (a === "setup-done") { var it = setupItems().filter(function (x) { return x.id === id; })[0]; if (it) { store(setupKey(it), setupDone(it) ? "0" : "1"); renderAll(); } }
    else if (a === "copy") {
      var val = t.getAttribute("data-v");
      var ok = function () { var old = t.textContent; t.textContent = "Copied"; setTimeout(function () { t.textContent = old; }, 1200); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(val).then(ok, function () { toast("Copy failed", true); }); else toast(val);
    }
  });
  document.addEventListener("input", function (e) { var t = e.target; if (t.hasAttribute("data-form")) { var f = S.form[t.getAttribute("data-form")]; if (f) f.v = t.value; } });
  document.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target.hasAttribute && e.target.hasAttribute("data-form")) { var b = e.target.parentNode.querySelector('[data-act="confirm"]'); if (b) b.click(); } });
  document.addEventListener("focusout", function () { setTimeout(function () { if (S.pending) { var ae = document.activeElement; if (!ae || !/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) renderAll(); } }, 0); });
  window.addEventListener("hashchange", function () { var h = location.hash.replace(/^#/, ""); if (h && (ALIAS[h] || h) !== S.tab) setTab(h, false); });
  var rz; window.addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(function () { if (S.tab === "overview") drawFlow(); }, 80); });

  // ---------------- boot ----------------
  var h0 = location.hash.replace(/^#/, ""); if (h0) S.tab = ALIAS[h0] || h0;
  if (!PAGES.concat(MORE).some(function (x) { return x[0] === S.tab; })) S.tab = "overview";
  if (B) { try { S.lastText = JSON.stringify(B); } catch (e) {} }
  renderAll();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (S.tab === "overview") drawFlow(); });
  if (LIVE) { refresh(false); setInterval(function () { if (document.visibilityState !== "hidden") refresh(false); }, 2000); }
})();
</script>
</body>
</html>
