  --mono: ui-monospace, "SF Mono", SFMono-Regular, "IBM Plex Mono", Menlo, Consolas, monospace;

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/22px var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-x: hidden; }
h1, h2, h3, h4 { margin: 0; font-weight: 400; letter-spacing: -0.015em; }
p { margin: 0; }
a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
button, input, select, textarea { font: inherit; color: inherit; }
code { font-family: var(--mono); font-size: 12px; background: var(--panel-2); padding: 1px 6px; border-radius: 4px; color: var(--text); overflow-wrap: anywhere; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
::selection { background: rgba(228,242,34,.25); }
.mono { font-family: var(--mono); font-size: 12.5px; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* tones: one vocabulary for kinds, statuses, results and routes */
.tone-green { --c: var(--green); --t: var(--green-tint); --l: var(--green-line); }
.tone-solar { --c: var(--solar-text); --t: var(--solar-tint); --l: var(--solar-line); }
.tone-blue { --c: var(--blue); --t: var(--blue-tint); --l: var(--blue-line); }
.tone-amber { --c: var(--amber); --t: var(--amber-tint); --l: var(--amber-line); }
.tone-red { --c: var(--red); --t: var(--red-tint); --l: var(--red-line); }
.tone-lilac { --c: var(--lilac); --t: var(--lilac-tint); --l: var(--lilac-line); }
.tone-neutral { --c: var(--text-2); --t: var(--panel-2); --l: var(--line-2); }
.tone-muted { --c: var(--text-3); --t: transparent; --l: var(--line-2); }

/* ================= shell ================= */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 0 12px 16px; }
.brand { display: flex; align-items: center; gap: 7px; height: 64px; margin: 0 -12px; padding: 0 22px; border-bottom: 1px solid var(--line); flex: none; }
.brand b { font: 600 16px/22px var(--sans); letter-spacing: -0.02em; }
.brand span { font: 400 11px/14px var(--mono); color: var(--text-3); padding-top: 3px; }
.side .nav:first-of-type { margin-top: 16px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font: 500 10.5px/14px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); padding: 0 10px; margin: 0 0 6px; }
.nav-item { position: relative; appearance: none; border: 0; background: none; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 6px; color: var(--text-2); cursor: pointer; text-align: left; width: 100%; transition: background var(--fast) var(--ease), color var(--fast) var(--ease); }
.nav-item:hover { background: var(--hover); color: var(--text); }
.nav-item[aria-current="page"] { background: var(--panel-2); color: var(--text); }
.nav-item .nl { flex: 1; white-space: nowrap; }
.nav-item .cnt { font: 500 11px/18px var(--mono); color: var(--text-3); min-width: 18px; text-align: right; }
.nav-item .cnt.hot { color: var(--solar-ink); background: var(--solar); padding: 0 6px; border-radius: 9px; text-align: center; }
.side-spacer { flex: 1; min-height: 24px; }
.side-foot { padding: 14px 10px 0; margin-top: 12px; border-top: 1px solid var(--line); color: var(--text-3); font-size: 12px; line-height: 18px; }
.main { min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 20; height: 64px; background: var(--bar); backdrop-filter: saturate(140%) blur(14px); -webkit-backdrop-filter: saturate(140%) blur(14px); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: calc(var(--content) + 112px); margin: 0 auto; height: 100%; padding: 0 56px; display: flex; align-items: center; gap: 12px; }
.repo-chip { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 0 1 auto; }
.repo-ic { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--olive); color: var(--olive-ink); flex: none; }
.repo-ic svg.i { width: 15px; height: 15px; }
.repo-id { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.repo-id .nm { font: 500 14.5px/19px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
.repo-id .path { font: 400 11.5px/15px var(--mono); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 420px; }
.crumb { display: inline-flex; align-items: center; gap: 12px; color: var(--text-2); white-space: nowrap; }
.crumb::before { content: ""; width: 1px; height: 22px; background: var(--line-2); transform: skewX(-18deg); }
.topbar .sp { flex: 1; }
.status { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--line-2); font-size: 12.5px; color: var(--text-2); white-space: nowrap; }
.status svg.i { width: 14px; height: 14px; }
.status.live { color: var(--green); border-color: var(--green-line); background: var(--green-tint); }
.status.err { color: var(--red); border-color: var(--red-line); background: var(--red-tint); }
.status.frozen { color: var(--blue); border-color: var(--blue-line); background: var(--blue-tint); }
.dot { width: 6px; height: 6px; border-radius: 3px; background: currentColor; flex: none; }
.dot.ping { animation: ping 2.4s var(--ease) infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(75,200,118,.45); } 70%, 100% { box-shadow: 0 0 0 6px rgba(75,200,118,0); } }
.iconbtn { appearance: none; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line-2); background: none; color: var(--text-2); display: grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn:hover { color: var(--text); background: var(--hover); }
.page { max-width: calc(var(--content) + 112px); margin: 0 auto; padding: 44px 56px 160px; }
.enter { animation: enter var(--med) var(--ease) both; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ================= page header + sections ================= */
.ph { display: flex; align-items: flex-end; gap: 24px; margin-bottom: 32px; }
.ph-t { flex: 1; min-width: 0; }
.eyebrow { font: 500 11px/16px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.ph .eyebrow { margin-bottom: 10px; }
.ph h1 { font-size: 32px; line-height: 40px; letter-spacing: -0.02em; }
.ph h1 .muted { color: var(--text-3); }
.ph .sub { color: var(--text-2); font-size: 15px; line-height: 24px; margin-top: 10px; max-width: 760px; }
.ph-side { display: flex; gap: 8px; align-items: center; flex: none; }
.sec { margin-top: 48px; }
.sec-h { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 14px; }
.sec-h .t { flex: 1; min-width: 0; }
.sec-h h2 { font-size: 19px; line-height: 26px; }
.sec-h p { color: var(--text-2); margin-top: 4px; }
.sec-h .n, .group-h .n { font: 500 12px/18px var(--mono); color: var(--text-3); margin-left: 8px; }
.group-h h2 { font-size: 17px; line-height: 24px; }
.panel { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); }
.empty { color: var(--text-2); padding: 24px; }
.empty b { color: var(--text); font-weight: 500; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px; border-radius: 7px; border: 1px solid var(--line-2); color: var(--text); margin-bottom: 20px; font-size: 13px; line-height: 20px; }
.banner svg.i { margin-top: 2px; color: var(--c, var(--text-3)); }
.banner .tx { flex: 1; min-width: 0; }
.banner .tx b { font-weight: 500; }
.banner.tone-amber, .banner.tone-red, .banner.tone-blue, .banner.tone-green { border-color: var(--l); background: var(--t); }
.banner ul { margin: 6px 0 0; padding-left: 18px; color: var(--text-2); }
.link { appearance: none; background: none; border: 0; padding: 0; color: var(--text-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 13px; transition: color var(--fast) var(--ease); }
.link svg.i { width: 14px; height: 14px; transition: transform var(--fast) var(--ease); }
.link:hover { color: var(--text); }
.link:hover svg.i { transform: translateX(2px); }

/* ================= overview ================= */
.doors { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.door { appearance: none; text-align: left; color: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 14px; padding: 22px 22px 18px; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); min-width: 0; transition: border-color var(--fast) var(--ease), background var(--fast) var(--ease), transform var(--fast) var(--ease); }
.door:hover { border-color: var(--line-3); background: var(--raise); }
.door:active { transform: translateY(1px); }
.door-top { display: flex; align-items: center; gap: 12px; }
.door-top h3 { font-size: 15px; line-height: 22px; font-weight: 500; flex: 1; min-width: 0; }
.ic { width: 32px; height: 32px; border-radius: 7px; display: grid; place-items: center; background: var(--olive); color: var(--olive-ink); flex: none; }
.ic.t { background: var(--t); color: var(--c); }
.door-big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.door-big .v { font-size: 40px; line-height: 44px; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.door-big .v.word { font-size: 30px; line-height: 44px; letter-spacing: -0.02em; color: var(--c); }
.door-big .v small { font-size: 18px; color: var(--text-3); margin-left: 2px; letter-spacing: 0; }
.door-big .u { color: var(--text-2); font-size: 14px; }
.door.hot { border-color: var(--solar-line); background: linear-gradient(180deg, var(--solar-tint), transparent 60%), var(--panel); }
.door.hot .door-big .v { color: var(--solar-text); }
.door-foot { display: flex; align-items: center; gap: 10px; margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); color: var(--text-3); font-size: 12.5px; line-height: 18px; }
.door-foot .sp { flex: 1; }
.door-foot .go { color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.door-foot .go svg.i { width: 14px; height: 14px; transition: transform var(--fast) var(--ease); }
.door:hover .door-foot .go { color: var(--text); }
.door:hover .door-foot .go svg.i { transform: translateX(3px); }
.mini { display: flex; flex-direction: column; gap: 6px; color: var(--text-2); font-size: 13px; line-height: 18px; }
.mini span { display: flex; align-items: baseline; gap: 7px; }
.mini b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; min-width: 14px; }
.mini .sdot { align-self: center; }
.sdot { width: 8px; height: 8px; border-radius: 4px; background: var(--c); flex: none; display: inline-block; }
.sdot.o { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
.segbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; }
.segbar i { display: block; height: 100%; background: var(--c); min-width: 4px; border-radius: 2px; }
.segbar i.o { background: repeating-linear-gradient(135deg, var(--c) 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1px var(--l); }
.segbar i.muted { background: repeating-linear-gradient(135deg, var(--line-2) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px var(--line-2); }
.quote { display: flex; gap: 12px; padding: 16px 18px; border-radius: var(--r); background: var(--lilac-tint); border: 1px solid var(--lilac-line); }
.quote svg.i { color: var(--lilac); margin-top: 3px; }
.quote .qt { color: var(--text); font-size: 14.5px; line-height: 23px; max-width: 860px; }
.quote .by { display: block; font: 500 10.5px/14px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--lilac); margin-bottom: 6px; }
.reviewed { display: flex; gap: 12px; align-items: flex-start; margin-top: 12px; padding: 12px 16px; border-radius: var(--r); border: 1px solid var(--line); color: var(--text-2); font-size: 13.5px; line-height: 21px; }
.reviewed svg.i { margin-top: 3px; color: var(--text-3); }
.reviewed b { color: var(--text); font-weight: 500; }
.reviewed .tx { flex: 1; min-width: 0; }
.reviewed.big { padding: 22px 24px; border-color: var(--solar-line); background: var(--solar-tint); }
.reviewed.big .tx { font-size: 15px; line-height: 24px; color: var(--text); }
.reviewed.big b { display: block; font-size: 17px; line-height: 24px; margin-bottom: 6px; }
.reviewed.big svg.i { color: var(--solar-text); width: 18px; height: 18px; }
.kchips { display: flex; flex-wrap: wrap; gap: 8px; }
.facts-line { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 18px; color: var(--text-3); font-size: 12.5px; line-height: 18px; }
.facts-line span { display: inline-flex; align-items: center; gap: 7px; }
.facts-line b { color: var(--text-2); font-weight: 500; }

/* traffic flow: each call, from its file to Router */
.flow { position: relative; padding: 28px; overflow: hidden; background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 16px 16px; background-position: -8px -8px; }
.flow-grid { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(64px, .7fr) minmax(0, 1fr); align-items: center; }
.flow svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: visible; }
.wire { fill: none; stroke: var(--c, var(--green)); stroke-width: 1.5; stroke-dasharray: 4 6; stroke-linecap: round; opacity: .9; animation: flowdash 2.2s linear infinite; }
.wires.fresh .wire { animation: flowdash 2.2s linear infinite, wirein 600ms var(--ease) both; }
.wire.o { stroke-dasharray: 1 6; }
.wire.broken, .wires.fresh .wire.broken { stroke-dasharray: 3 5; animation: wirein 600ms var(--ease) both; }
.wire-x { fill: none; stroke: var(--c); stroke-width: 1.6; stroke-linecap: round; }
@keyframes flowdash { to { stroke-dashoffset: -20; } }
@keyframes wirein { from { opacity: 0; } to { opacity: .9; } }
.fcol { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.fgroup { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.fgroup-h { display: flex; align-items: baseline; gap: 8px; min-width: 0; font: 400 11.5px/16px var(--mono); color: var(--text-3); }
.fgroup-h .p { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fgroup-h .n { flex: none; }
.fnode { appearance: none; position: relative; display: flex; align-items: center; gap: 10px; width: 100%; min-width: 0; padding: 9px 12px; text-align: left; color: inherit; background: var(--bg); border: 1px solid var(--line-2); border-radius: 7px; cursor: pointer;
  transition: border-color var(--fast) var(--ease), background var(--fast) var(--ease); }
.fnode:hover { border-color: var(--l); background: var(--hover); }
.fnode .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.fnode .fn { font: 500 12.5px/18px var(--mono); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fnode .sub { color: var(--text-3); font-size: 12px; line-height: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fnode svg.go { width: 13px; height: 13px; color: var(--text-3); opacity: 0; transform: translateX(-3px); transition: opacity var(--fast) var(--ease), transform var(--fast) var(--ease); }
.fnode:hover svg.go, .fnode:focus-visible svg.go { opacity: 1; transform: none; }
.router-node { position: relative; min-width: 0; background: var(--bg); border: 1px solid var(--green-line); border-radius: 10px; padding: 20px; box-shadow: 0 0 0 5px var(--green-tint), 0 14px 32px -14px var(--shadow); }
.router-node .nm { display: flex; align-items: center; gap: 10px; font-size: 18px; line-height: 24px; }
.router-node .host { color: var(--text-3); margin-top: 10px; overflow-wrap: anywhere; }
.rchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.rchip { appearance: none; display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-width: 0; height: 26px; padding: 0 9px; border-radius: 5px; font-size: 12px; color: var(--c); background: var(--t); border: 1px solid var(--l); cursor: pointer; }
.rchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rchip svg.i { width: 13px; height: 13px; }
.flow-stay { position: relative; z-index: 1; margin-top: 24px; padding-top: 20px; border-top: 1px dashed var(--line-2); }
.stay-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin-top: 10px; }
.stay-grid .fnode { padding: 8px 10px; background: transparent; border-style: dashed; }
.flow .legend { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--text-2); font-size: 12.5px; line-height: 18px; }
.legend > span { display: inline-flex; align-items: center; gap: 8px; }
.legend b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
.legend svg { width: 22px; height: 8px; flex: none; }
.legend svg line { stroke: var(--c); stroke-width: 1.5; stroke-dasharray: 4 3; stroke-linecap: round; }
.legend svg.o line { stroke-dasharray: 1 3.5; }
.legend .box { width: 16px; height: 11px; border: 1px dashed var(--line-3); border-radius: 3px; flex: none; }
.flow-empty { color: var(--text-2); padding: 12px 0; }

/* ================= badges ================= */
.kb { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 4px; font: 500 10.5px/14px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--c); background: var(--t); border: 1px solid var(--l); white-space: nowrap; flex: none; }
.kb svg.i { width: 12px; height: 12px; }
.sc { display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 12px; line-height: 16px; color: var(--c); background: var(--t); border: 1px solid var(--l); white-space: nowrap; flex: none; }
.sc .dot { width: 6px; height: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 5px; font-size: 12px; line-height: 16px; white-space: nowrap; border: 1px solid var(--l, var(--line-2)); color: var(--c, var(--text-2)); background: var(--t, transparent); }
.pill svg.i { width: 12px; height: 12px; }

/* ================= the one card ================= */
.card { position: relative; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 20px 24px; scroll-margin-top: 96px; transition: border-color var(--med) var(--ease), box-shadow var(--med) var(--ease); }
.card.flash { animation: flash 1.6s var(--ease); }
@keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(228,242,34,0); } 15% { box-shadow: 0 0 0 3px var(--solar-line); border-color: var(--solar-line); } 100% { box-shadow: 0 0 0 0 rgba(228,242,34,0); } }
.item.waiting { border-color: var(--solar-line); }
.ih { display: flex; align-items: flex-start; gap: 8px 12px; flex-wrap: wrap; }
.ih .kb { margin-top: 1px; }
.ih .it { flex: 1 1 240px; min-width: 0; font-size: 16px; line-height: 24px; font-weight: 500; overflow-wrap: anywhere; }
.isum { color: var(--text-2); margin-top: 8px; max-width: 860px; }
.row { display: flex; align-items: baseline; gap: 6px 10px; flex-wrap: wrap; margin-top: 12px; }
.lbl { font: 500 10.5px/14px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }
.row > .lbl { min-width: 72px; }
.cref { appearance: none; display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 22px; padding: 0 8px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); color: var(--text-2); font: 400 11.5px/16px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
button.cref:hover { color: var(--text); border-color: var(--line-3); }
span.cref { cursor: default; color: var(--text-3); border-style: dashed; }
.cref em { font-style: normal; color: var(--text-3); }
.glp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 16px; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.glp > div { padding: 10px 14px; border-left: 1px solid var(--line); min-width: 0; font-size: 13px; line-height: 20px; overflow-wrap: anywhere; }
.glp > div:first-child { border-left: 0; }
.glp .lbl { margin-bottom: 4px; display: block; }
.glp .g { color: var(--text); }
.glp .l { color: var(--text-2); }
.glp .l.none { color: var(--text-3); }
.glp .pr { color: var(--text); font-variant-numeric: tabular-nums; }
.chk { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 6px 10px; margin-top: 16px; }
.chk > .lbl { padding-top: 4px; }
.evl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.ev { display: grid; grid-template-columns: 74px auto minmax(0, 1fr) auto; grid-template-areas: "r k d s"; gap: 0 10px; align-items: baseline; font-size: 13px; line-height: 20px; }
.ev .r { grid-area: r; display: inline-flex; align-items: center; gap: 5px; font: 500 11px/20px var(--mono); color: var(--c); white-space: nowrap; }
.ev .r svg.i { width: 13px; height: 13px; align-self: center; }
.ev .k { grid-area: k; color: var(--text); font-weight: 500; white-space: nowrap; }
.ev .d { grid-area: d; color: var(--text-2); overflow-wrap: anywhere; min-width: 0; }
.ev .s { grid-area: s; font: 500 9.5px/16px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); border: 1px solid var(--line-2); border-radius: 3px; padding: 0 5px; white-space: nowrap; }
.ev .s.agent { color: var(--lilac); border-color: var(--lilac-line); }
.mc { margin-top: 16px; padding: 14px 16px; border-radius: 7px; border: 1px solid var(--lilac-line); background: var(--lilac-tint); }
.mc-h { display: flex; gap: 10px; align-items: flex-start; }
.mc-h svg.i { color: var(--lilac); margin-top: 3px; }
.mc-h .tx { flex: 1; min-width: 0; color: var(--text-2); font-size: 13px; line-height: 20px; }
.mc-h .tx b { display: block; color: var(--text); font-weight: 500; font-size: 14px; }
.mc .evl { margin-top: 10px; }
.samples { margin-top: 12px; display: grid; gap: 8px; }
.sample { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); font-size: 12.5px; line-height: 19px; }
.sample > div { padding: 8px 10px; border-left: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
.sample > div:first-child { border-left: 0; color: var(--text-2); }
.sample .lbl { display: block; margin-bottom: 2px; }
.sample.diff > div:last-child { background: var(--amber-tint); }
.flags { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; padding: 10px 14px; border-radius: 7px; border: 1px solid var(--amber-line); background: var(--amber-tint); font-size: 13px; line-height: 20px; }
.flags svg.i { color: var(--amber); margin-top: 2px; }
.flags .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.flags .fk { color: var(--amber); font-weight: 500; margin-right: 6px; }
.flags .fd { color: var(--text); overflow-wrap: anywhere; }
.flags .ff { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.rel { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; margin-top: 12px; font-size: 13px; }
.ilink { appearance: none; background: none; border: 0; padding: 0; display: inline-flex; align-items: baseline; gap: 7px; color: var(--text); cursor: pointer; text-align: left; font-size: 13px; line-height: 20px; max-width: 100%; }
.ilink .sdot { align-self: center; width: 7px; height: 7px; }
.ilink .tt { text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; overflow-wrap: anywhere; }
.ilink:hover .tt { text-decoration-color: var(--text-2); }
.note { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; padding: 10px 14px; border-radius: 7px; border: 1px solid var(--l, var(--line)); background: var(--t, transparent); font-size: 13px; line-height: 20px; color: var(--text-2); }
.note svg.i { color: var(--c, var(--text-3)); margin-top: 2px; width: 15px; height: 15px; }
.note .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.note b { color: var(--text); font-weight: 500; }
.note .meta { color: var(--text-3); }
.disc { display: flex; flex-direction: column; gap: 2px; margin-top: 14px; }
details.more > summary { cursor: pointer; color: var(--text-2); font-size: 13px; list-style: none; display: inline-flex; align-items: center; gap: 7px; user-select: none; padding: 3px 0; transition: color var(--fast) var(--ease); }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary svg.i { width: 12px; height: 12px; transition: transform var(--med) var(--ease); }
details.more[open] > summary svg.i:first-child { transform: rotate(90deg); }
details.more > summary:hover { color: var(--text); }
details.more > summary .meta { color: var(--text-3); font-family: var(--mono); font-size: 11.5px; }
details.more[open] > .more-b { animation: reveal var(--med) var(--ease) both; }
@keyframes reveal { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.more-b { margin: 8px 0 10px; color: var(--text-2); font-size: 13.5px; line-height: 21px; }
.whyt { padding: 12px 14px; border-left: 2px solid var(--lilac-line); background: var(--lilac-tint); border-radius: 0 6px 6px 0; color: var(--text); max-width: 860px; }
.nodiff { color: var(--text-3); font-size: 12.5px; display: inline-flex; align-items: center; gap: 7px; padding: 3px 0; }
.nodiff svg.i { width: 12px; height: 12px; }
.ifoot { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.ifoot .sp { flex: 1; }
.ref { display: inline-flex; align-items: center; gap: 6px; color: var(--text-3); font: 400 12px/18px var(--mono); min-width: 0; max-width: 100%; }
.ref svg.i { width: 13px; height: 13px; }
.ref span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* buttons + forms */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line-2); background: transparent; color: var(--text); cursor: pointer; white-space: nowrap; font-size: 13px; transition: background var(--fast) var(--ease), border-color var(--fast) var(--ease), transform var(--fast) var(--ease), opacity var(--fast) var(--ease); }
.btn svg.i { width: 14px; height: 14px; }
.btn:hover:not(:disabled) { border-color: var(--line-3); background: var(--hover); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--solar); border-color: var(--solar); color: var(--solar-ink); font-weight: 500; }
.btn.primary:hover:not(:disabled) { background: var(--solar-hover); border-color: var(--solar-hover); }
.btn.ghost { border-color: transparent; color: var(--text-2); padding: 0 10px; }
.btn.ghost:hover:not(:disabled) { color: var(--text); background: var(--hover); border-color: transparent; }
.btn.warn { color: var(--amber); border-color: var(--amber-line); }
.btn.lg { height: 40px; padding: 0 18px; font-size: 14px; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; display: inline-block; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; width: 100%; animation: enter var(--med) var(--ease) both; }
.form input { height: 32px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--bg); padding: 0 10px; flex: 1 1 240px; min-width: 0; max-width: 460px; }
.form input[type=date] { flex: 0 1 180px; }
.form input:focus { outline: none; border-color: var(--solar-line); }
.form .hint { color: var(--text-3); font-size: 12.5px; flex: 1 1 100%; }

/* filters */
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
.filters > .lbl { min-width: 52px; }
.fchip { appearance: none; display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--line-2); background: none; color: var(--text-2); cursor: pointer; font-size: 13px; transition: background var(--fast) var(--ease), color var(--fast) var(--ease), border-color var(--fast) var(--ease); }
.fchip:hover { color: var(--text); border-color: var(--line-3); }
.fchip[aria-pressed="true"] { background: var(--panel-2); color: var(--text); border-color: var(--line-3); }
.fchip .n { font: 500 11px/16px var(--mono); color: var(--text-3); }
.fchip .sdot { width: 7px; height: 7px; }
.group { margin-top: 36px; }
.group:first-child { margin-top: 28px; }
.group-h { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.group-h p { color: var(--text-3); font-size: 13px; line-height: 20px; flex: 1 1 300px; min-width: 0; }

/* calls table */
.tblw { overflow: hidden; }
.ctbl { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 20px; }
.ctbl th { text-align: left; font-weight: 400; color: var(--text-3); font-size: 12px; padding: 11px 16px; border-bottom: 1px solid var(--line); background: var(--raise); white-space: nowrap; }
.ctbl td { padding: 13px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
.ctbl tr:last-child td { border-bottom: 0; }
.ctbl tr { scroll-margin-top: 96px; }
.ctbl tr.flash td { animation: rowflash 1.6s var(--ease); }
@keyframes rowflash { 15% { background: var(--solar-tint); } }
.ctbl .site { font-family: var(--mono); font-size: 12.5px; color: var(--text); white-space: nowrap; }
.ctbl .sub { color: var(--text-3); font-size: 12px; line-height: 18px; margin-top: 2px; overflow-wrap: anywhere; }
.ctbl .mdl { font-family: var(--mono); font-size: 12px; color: var(--text-2); overflow-wrap: anywhere; }
.route { display: inline-flex; align-items: center; gap: 7px; color: var(--c); white-space: nowrap; font-weight: 500; }
.lat { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); white-space: nowrap; }

/* queue */
.prow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px 14px; padding: 14px 18px; border-top: 1px solid var(--line); }
.prow:first-child { border-top: 0; }
.prow .tx { min-width: 0; }
.prow .pa { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.prow .ss { color: var(--text-3); font-size: 12.5px; line-height: 18px; margin-top: 3px; overflow-wrap: anywhere; }
.atag { display: inline-flex; align-items: center; justify-content: center; min-width: 58px; height: 24px; padding: 0 8px; border-radius: 5px; font: 500 11px/14px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--c); background: var(--t); border: 1px solid var(--l); flex: none; }
.applybar { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding: 16px 18px; border-top: 1px solid var(--line); background: var(--raise); border-radius: 0 0 var(--r) var(--r); }
.applybar .tx { flex: 1 1 300px; min-width: 0; color: var(--text-2); font-size: 13px; line-height: 20px; }
.applybar .tx b { color: var(--text); font-weight: 500; }
.applybar .why { flex: 1 1 100%; color: var(--amber); font-size: 12.5px; line-height: 18px; display: flex; gap: 8px; align-items: flex-start; }
.applybar .why svg.i { width: 14px; height: 14px; margin-top: 2px; }
.term { margin: 0; padding: 14px 16px; font: 400 12px/19px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-2); max-height: 260px; overflow: auto; background: var(--code); border-top: 1px solid var(--line); border-radius: 0 0 var(--r) var(--r); }
.result-h { display: flex; align-items: center; gap: 12px; padding: 14px 18px; font-size: 13.5px; flex-wrap: wrap; }
.result-h .tx { flex: 1 1 260px; min-width: 0; }
.result-h .tx b { font-weight: 500; }
.copyv { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; height: 32px; padding: 0 4px 0 12px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--bg); font: 400 12.5px/18px var(--mono); color: var(--text); }
.copyv .cv { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.copyv .btn { height: 24px; padding: 0 8px; font-size: 11.5px; flex: none; }

/* history */
.sess { overflow: hidden; }
.sess-h { display: flex; align-items: center; gap: 12px 14px; padding: 16px 20px; flex-wrap: wrap; }
.sid { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--line-2); font: 500 13px/16px var(--mono); color: var(--text); flex: none; }
.sess-h .tx { flex: 1 1 220px; min-width: 0; }
.sess-h .tx b { font-weight: 500; font-size: 15px; }
.sess-h .tx .mt { display: block; color: var(--text-3); font-size: 12.5px; line-height: 18px; margin-top: 2px; }
.sess-sum { padding: 0 20px 16px; color: var(--text); max-width: 900px; }
.rrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; padding: 13px 20px; border-top: 1px solid var(--line); align-items: start; }
.rrow .tx { min-width: 0; }
.rrow .nt { color: var(--text-2); font-size: 13px; line-height: 20px; margin-top: 4px; overflow-wrap: anywhere; }
.rrow .cm { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.rrow .rt { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.sess-ck { padding: 14px 20px 18px; border-top: 1px solid var(--line); background: var(--raise); }
.sess-ck .lbl { display: block; margin-bottom: 8px; }

/* setup */
.prog { display: flex; align-items: center; gap: 12px; }
.prog-bar { display: flex; gap: 4px; }
.prog-bar i { width: 22px; height: 6px; border-radius: 3px; background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line-2); }
.prog-bar i.on { background: var(--solar); box-shadow: none; }
.prog .tx { color: var(--text-2); font-size: 13px; white-space: nowrap; }
.prog .tx b { color: var(--text); font-weight: 500; }
.scard { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 0 16px; padding: 22px 24px; }
.scard.done .s-body { opacity: .6; }
.s-rail { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.s-num { font: 500 11px/14px var(--mono); color: var(--text-3); letter-spacing: .06em; }
.check { appearance: none; width: 26px; height: 26px; border-radius: 13px; border: 1.5px solid var(--line-3); background: none; flex: none; cursor: pointer; display: grid; place-items: center; color: var(--solar-ink); transition: background var(--fast) var(--ease), border-color var(--fast) var(--ease); }
.check:hover { border-color: var(--solar-line); }
.check.on { background: var(--solar); border-color: var(--solar); }
.check svg.i { width: 12px; height: 12px; stroke-width: 2; }
.s-head { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.s-head h3 { font-size: 16px; line-height: 24px; font-weight: 500; }
.prio { font: 500 10.5px/14px var(--mono); letter-spacing: .07em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--l, var(--line-2)); color: var(--c, var(--text-3)); background: var(--t, transparent); white-space: nowrap; }
.s-lead { color: var(--text-2); margin-top: 8px; max-width: 760px; }
.s-block { margin-top: 16px; }
.s-block > .lbl { display: block; margin-bottom: 8px; }
.taglist { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 5px; font-size: 12px; background: var(--panel-2); color: var(--text-2); border: 1px solid var(--line); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.where { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 12px; padding: 6px 10px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); font-size: 12.5px; color: var(--text-2); }
.where .r { font-weight: 500; color: var(--text); }
.where svg.i { width: 12px; height: 12px; color: var(--text-3); }
.s-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.s-foot .nt { color: var(--text-3); font-size: 12.5px; }
a.btn { text-decoration: none; }

/* diff */
.dv { margin-top: 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--code); overflow: hidden; }
.dv-h { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--text-2); }
.dv-h .msg { color: var(--text); font-weight: 500; flex: 1 1 240px; min-width: 0; overflow-wrap: anywhere; }
.dv-h .mono { color: var(--text-3); font-size: 11.5px; }
.dv-trunc { padding: 8px 14px; color: var(--amber); font-size: 12px; border-top: 1px solid var(--line); background: var(--amber-tint); }
.df + .df { border-top: 1px solid var(--line); }
.df-h { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--panel-2); border-bottom: 1px solid var(--line); font: 400 12px/18px var(--mono); }
.df-h .f { flex: 1; min-width: 0; overflow-wrap: anywhere; color: var(--text); }
.df-h .m { color: var(--amber); font-size: 11px; }
.plus { color: var(--green); }
.minus { color: var(--red); }
.df-b { overflow-x: auto; scrollbar-width: thin; }
.df-b table { border-collapse: collapse; min-width: 100%; font: 400 12px/19px var(--mono); }
.df-b td { padding: 0; vertical-align: top; }
.df-b td.n { width: 1%; min-width: 38px; padding: 0 8px; color: var(--text-3); text-align: right; user-select: none; opacity: .8; }
.df-b td.g { width: 14px; padding: 0 4px; color: var(--text-3); user-select: none; text-align: center; }
.df-b td.c { white-space: pre; padding-right: 14px; color: var(--text-2); }
.df-b tr.add { background: var(--add); }
.df-b tr.add td.g { color: var(--green); }
.df-b tr.add td.c { color: var(--text); }
.df-b tr.del { background: var(--del); }
.df-b tr.del td.g { color: var(--red); }
.df-b tr.hunk td { background: var(--hunk); color: var(--text-3); padding-top: 2px; padding-bottom: 2px; }
.df-b tr.hunk td.c { white-space: pre-wrap; overflow-wrap: anywhere; }
.sy-k { color: var(--syn-k); }
.sy-s { color: var(--syn-s); }
.sy-n { color: var(--syn-n); }
.sy-c { color: var(--syn-c); font-style: italic; }
.stat { padding: 8px 14px; font: 400 11.5px/18px var(--mono); color: var(--text-3); border-bottom: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }

/* sticky + toast */
#sticky:empty { display: none; }
.sticky { position: fixed; left: var(--side-w); right: 0; bottom: 0; z-index: 30; background: var(--sticky); backdrop-filter: saturate(140%) blur(10px); -webkit-backdrop-filter: saturate(140%) blur(10px); border-top: 1px solid var(--line); }
.sticky.in { animation: up 320ms var(--ease) both; }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
.sticky-in { max-width: calc(var(--content) + 112px); margin: 0 auto; padding: 12px 56px; display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; }
.sticky-in .tx { flex: 1 1 200px; color: var(--text-2); min-width: 0; }
.sticky-in .tx b { color: var(--text); font-weight: 500; }
#toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 40; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
.toast { display: flex; align-items: center; gap: 10px; background: var(--text); color: var(--bg); border-radius: 8px; padding: 10px 16px; font-size: 13px; box-shadow: 0 10px 30px var(--shadow); animation: toastin 260ms var(--ease) both; }
.toast.out { animation: toastout 200ms var(--ease) both; }
.toast svg.i { width: 15px; height: 15px; }
.toast.err { background: var(--red); color: #fff; }
@keyframes toastin { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes toastout { to { opacity: 0; transform: translateY(6px); } }

           print_debug=False,\n+                msg_history=msg_history,\n+                temperature=temperature,\n+            )\n+            content.append(c)\n+            new_msg_history.append(hist)\n     else:\n         content, new_msg_history = [], []\n         for _ in range(n_responses):\ndiff --git a/ai_scientist/router_policy.py b/ai_scientist/router_policy.py\nindex 385b432..51109bd 100644\n--- a/ai_scientist/router_policy.py\n+++ b/ai_scientist/router_policy.py\n@@ -2,5 +2,5 @@\n # The vendored router_runtime.py imports this module. Delete it (or set ROUTER_MIGRATE_POLICY=off) for v1 behaviour.\n import json\n \n-POLICY = json.loads('{\"defaults\":{\"drop_params\":[\"seed\"]},\"version\":1}')\n-POLICY_HASH = '38b72c81e035145453a3256d43a0de69e1ae7a2368be250132a2efdf38234cd3'\n+POLICY = json.loads('{\"defaults\":{\"drop_params\":[\"seed\"],\"prompt_cache_key\":\"$feature\"},\"version\":1}')\n+POLICY_HASH = 'f14c7f1716cd2056b8166c57b0847c8c6d95eb8031fe4b939790e319d6b1c915'\ndiff --git a/router.policy.json b/router.policy.json\nindex 0af5415..dccefe1 100644\n--- a/router.policy.json\n+++ b/router.policy.json\n@@ -2,7 +2,8 @@\n  \"defaults\": {\n   \"drop_params\": [\n    \"seed\"\n-  ]\n+  ],\n+  \"prompt_cache_key\": \"$feature\"\n  },\n  \"version\": 1\n }","files":["ai_scientist/llm.py","ai_scientist/router_policy.py","router.policy.json"],"lines":116,"truncated":false},"results":[],"model_change":false,"in_session":null,"actions":["undo"],"waiting":false},{"id":"m4","kind":"trade-off","title":"Map retired model ids to catalog models","summary":"The model ids the app offers that Router no longer lists - including its default Claude model and its hard-coded reviewer model - are mapped to catalog models on Router-bound requests.","calls":["ai_scientist/llm.py:196","ai_scientist/llm.py:235","ai_scientist/llm.py:267","ai_scientist/llm.py:283"],"gains":"The default path moves at all: of the 40 ids in AVAILABLE_LLMS the catalog serves only gpt-4o-mini and =4096, which a current reasoning\n    model can spend on reasoning before answering; that risk exists today on o1 itself.\n---\n ai_scientist/router_policy.py |  4 ++--\n router.policy.json            | 21 +++++++++++++++++++++\n 2 files changed, 23 insertions(+), 2 deletions(-)\n\ndiff --git a/ai_scientist/router_policy.py b/ai_scientist/router_policy.py\nindex 51109bd..57c2ec0 100644\n--- a/ai_scientist/router_policy.py\n+++ b/ai_scientist/router_policy.py\n@@ -2,5 +2,5 @@\n # The vendored router_runtime.py imports this module. Delete it (or set ROUTER_MIGRATE_POLICY=off) for v1 behaviour.\n import json\n \n-POLICY = json.loads('{\"defaults\":{\"drop_params\":[\"seed\"],\"prompt_cache_key\":\"$feature\"},\"version\":1}')\n-POLICY_HASH = 'f14c7f1716cd2056b8166c57b0847c8c6d95eb8031fe4b939790e319d6b1c915'\n+POLICY = json.loads('{\"defaults\":{\"drop_params\":[\"seed\"],\"model_map\":{\"claude-3-5-sonnet-20240620\":\"claude-sonnet-4-5\",\"claude-3-5-sonnet-20241022\":\"claude-sonnet-4-5\",\"deepseek-chat\":\"deepseek-v4-flash\",\"deepseek-coder\":\"deepseek-v4-flash\",\"deepseek-reasoner\":\"deepseek-v4.1-flash\",\"gpt-4.1\":\"gpt-4.1-mini\",\"gpt-4.1-2025-04-14\":\"gpt-4.1-mini\",\"gpt-4.1-nano\":\"gpt-4o-mini\",\"gpt-4.1-nano-2025-04-14\": \u2026\n+POLICY_HASH = 'f1ff77e1bdc4b683d55d17d0c5fe282e03a699b3f7d6fe6e252c82aa7480d44d'\ndiff --git a/router.policy.json b/router.policy.json\nindex dccefe1..0b5a970 100644\n--- a/router.policy.json\n+++ b/router.policy.json\n@@ -3,6 +3,27 @@\n   \"drop_params\": [\n    \"seed\"\n   ],\n+  \"model_map\": {\n+   \"claude-3-5-sonnet-20240620\": \"claude-sonnet-4-5\",\n+   \"claude-3-5-sonnet-20241022\": \"claude-sonnet-4-5\",\n+   \"deepseek-chat\": \"deepseek-v4-flash\",\n+   \"deepseek-coder\": \"deepseek-v4-flash\",\n+   \"deepseek-reasoner\": \"deepseek-v4.1-flash\",\n+   \"gpt-4.1\": \"gpt-4.1-mini\",\n+   \"gpt-4.1-2025-04-14\": \"gpt-4.1-mini\",\n+   \"gpt-4.1-nano\": \"gpt-4o-mini\",\n+   \"gpt-4.1-nano-2025-04-14\": \"gpt al behavior\n         _router_wrap_anthropic = lambda c, *a, **k: c  # noqa: E731\n         _router_wrap_openai = lambda c, *a, **k: c  # noqa: E731\n+        _router_install_litellm = lambda *a, **k: None  # noqa: E731\n+\n+\n+def route_aider_through_router():\n+    \"\"\"Send aider's LiteLLM traffic through Router as well, for the providers the runtime covers.\n+\n+    LiteLLM builds OpenAI SDK clients on litellm.client_session, so aider's requests for an\n+    OpenAI model go through Router; its Anthropic path uses LiteLLM's own handler and stays on\n+    Anthropic. Does nothing until RAMP_ROUTER_API_KEY is set. Safe to call more than once.\n+    \"\"\"\n+    _router_install_litellm()\n \n MAX_NUM_TOKENS = 4096\n \ndiff --git a/ai_scientist/perform_writeup.py b/ai_scientist/perform_writeup.py\nindex 8fe07cb..291e618 100644\n--- a/ai_scientist/perform_writeup.py\n+++ b/ai_scientist/perform_writeup.py\n@@ -8,7 +8,11 @@ import subprocess\n from typing import Optional, Tuple\n \n from ai_scientist.generate_ideas import search_for_papers\n-from ai_scientist.llm import get_response_from_llm, extract_json_between_markers, create_client, AVAILABLE_LLMS\n+from ai_scientist.llm import get_response_from_llm, extract_json_between_markers, create_client, AVAILABLE_LLMS, route_aider_through_router\n+\n+# router-migrate: this module's __main__ builds an aider Coder; route its LiteLLM requests for\n+# OpenAI models through Router too (no-op without RAMP_ROUTER_API_KEY).\n+route_aider_through_router()\n \n \n # GENERATE LATEX\ndiff --git a/experimental/launch_oe_scientist.py b/experimental/launch_oe_scientist.py\nindex 8d63ab1..7c8f78a 100644\n--- a/experimental/launch_oe_scientist.py\n+++ b/experimental/launch_oe_scientist.py\n@@ -14,11 +14,15 @@ from aider.models import Model\n from datetime import datetime\n \n from ai_scientist.generate_ideas import generate_next_idea, check_idea_novelty\n-from ai_scientist.llm import create_client, AVAILABLE_LLMS\n+from ai_scientist.llm impo   function applyTheme() { if (S.theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", S.theme); }

  // ---------------- events ----------------
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-tab],[data-act],[data-go-call],[data-go-item],[data-go-kind]");
    if (!t) return;
    if (t.hasAttribute("data-go-call")) { go("calls", "call-" + callIndex(t.getAttribute("data-go-call"))); return; }
    if (t.hasAttribute("data-go-item")) {
      var gid = t.getAttribute("data-go-item"), here = document.getElementById("item-" + gid);
      if (here && !t.closest("#item-" + cssId(gid))) { goTo("item-" + gid); return; }
      S.fk = "all"; S.fs = "all"; go("changes", "item-" + gid); return;
    }
    if (t.hasAttribute("data-go-kind")) { S.fk = t.getAttribute("data-go-kind"); S.fs = "all"; go("changes"); return; }
    if (t.hasAttribute("data-tab") && !t.hasAttribute("data-act")) { go(t.getAttribute("data-tab")); return; }
    var a = t.getAttribute("data-act"), id = t.getAttribute("data-id");
    if (a === "filter") { if (t.getAttribute("data-f") === "k") { S.fk = t.getAttribute("data-v"); S.fs = "all"; } else S.fs = t.getAttribute("data-v"); renderAll(false); }
    else if (a === "approve") request(id, "apply");
    else if (a === "withdraw") withdraw(id);
    else if (a === "apply") doApply();
    else if (a === "close-result") { S.applyResult = null; if (B) delete B.launch; renderAll(false); }
    else if (a && a.indexOf("form-") === 0 && a !== "form-cancel") {
      var k = a.slice(5), cur = S.form[id];
      if (cur && cur.k === k) delete S.form[id]; else S.form[id] = {k: k, v: k === "postpone" ? plusDays(14) : ""};
      renderAll(false);
      var inp = document.querySelector('[data-form="' + cssId(id) + '"]'); if (inp) inp.focus({preventScroll: true});
    }
    else if (a === "form-cancel") { delete S.form[id]; renderAll(false); }
    else if (a === "confirm") {
      var f = S.form[id]; if (!f) return; var v = String(f.v || "").trim();
      if (f.k === "postpone") { if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { toast("Pick a date", true); return; } request(id, "postpone", {until: v}); }
      else request(id, f.k, {reason: v});
    }
    else if (a === "theme") { S.theme = S.theme === "auto" ? "light" : S.theme === "light" ? "dark" : "auto"; store("rm.theme", S.theme === "auto" ? null : S.theme); applyTheme(); renderTop(); }
    else if (a === "setup-done") { var s = setupSteps().filter(function (x) { return x.id === id; })[0]; if (s) { store(setupKey(s), setupDone(s) ? null : "1"); renderAll(false); } }
    else if (a === "copy") {
      var val = t.getAttribute("data-v"), ok = function () { var old = t.textContent; t.textContent = "Copied"; setTimeout(function () { t.textContent = old; }, 1200); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(val).then(ok, function () { toast("Copy failed", true); }); else toast(val);
    }
  });
  document.addEventListener("toggle", function (e) { var d = e.target; if (d.tagName === "DETAILS" && d.hasAttribute("data-key")) S.open[d.getAttribute("data-key")] = d.open; }, true);
  document.addEventListener("input", function (e) { var t = e.target; if (t.hasAttribute && t.hasAttribute("data-form")) { var f = S.form[t.getAttribute("data-form")]; if (f) f.v = t.value; } });
  document.addEventListener("keydown", function (e) {
    var t = e.target; if (!t.hasAttribute || !t.hasAttribute("data-form")) return;
    if (e.key === "Enter") { var b = t.parentNode.querySelector('[data-act="confirm"]'); if (b) b.click(); }
    if (e.key === "Escape") { delete S.form[t.getAttribute("data-form")]; renderAll(false); }
  });
  document.addEventListener("focusout", function () { setTimeout(function () { if (S.pending) { var ae = document.activeElement; if (!ae || !/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) renderAll(false); } }, 0); });
  var rz; window.addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(drawFlow, 100); });
  window.addEventListener("hashchange", function () { var h = location.hash.replace(/^#/, ""); if (h && h !== S.tab) setTab(h, false); });

  // ---------------- boot ----------------
  S.theme = store("rm.theme") || "auto"; if (["auto", "light", "dark"].indexOf(S.theme) < 0) S.theme = "auto"; applyTheme();
  var h0 = location.hash.replace(/^#/, ""); if (h0) S.tab = h0;
  if (!PAGES.concat(MORE).some(function (x) { return x[0] === S.tab; })) S.tab = "overview";
  S.sig = sigOf(B);
  renderAll(true);
  if (LIVE) {
    refresh(false);
    setInterval(function () { if (document.visibilityState !== "hidden") refresh(false); }, 2000);
    document.addEventListener("visibilitychange", function () { if (document.visibilityState !== "hidden") refresh(false); });
  }
})();
