<head>

<style>
/* Router console tokens (app.router.com, dark) + the v4 showcase's components */
:root {
  color-scheme: dark;
  --bg: #1A1919; --side: #242322; --panel: #201F1E; --panel-2: #2A2827; --hover: #2A2827; --sel: #32302F; --code: #181717; --raise: #222120;
  --line: #32302F; --line-2: #474543; --line-3: #5E5B58;
  --text: #D9D5D2; --text-hi: #EDEAE7; --text-2: #A39D99; --text-3: #7C7774;
  --solar: #E4F222; --solar-hover: #D5E31B; --solar-ink: #1A1919; --solar-tint: rgba(228,242,34,.07); --solar-line: rgba(228,242,34,.42); --solar-text: #E3EC7A;
  --olive: #3B361E; --olive-ink: #E6D877;
  --green: #4BC876; --green-tint: rgba(75,200,118,.10); --green-line: rgba(75,200,118,.42);
  --lilac: #BAA6EE; --lilac-tint: rgba(186,166,238,.10); --lilac-line: rgba(186,166,238,.40);
  --amber: #E6B95D; --amber-tint: rgba(230,185,93,.10); --amber-line: rgba(230,185,93,.40);
  --red: #EB8A70; --red-tint: rgba(233,135,111,.11); --red-line: rgba(233,135,111,.42);
  --blue: #8DB4E8; --blue-tint: rgba(141,180,232,.10); --blue-line: rgba(141,180,232,.40);
  --add: rgba(75,200,118,.09); --del: rgba(233,135,111,.08);
  --syn-k: #C9B3F5; --syn-s: #A6DDB4; --syn-n: #EBC57A; --syn-c: #7C7774;
  --bar: rgba(26,25,25,.86); --sticky: rgba(26,25,25,.94); --shadow: rgba(0,0,0,.45); --focus: #E4F222; --dotgrid: rgba(255,255,255,.05);
  --sans: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "IBM Plex Mono", Menlo, Consolas, monospace;
  --r: 10px; --r-sm: 6px; --ease: cubic-bezier(.2, .7, .2, 1); --fast: 140ms; --med: 220ms;
  --side-w: 228px; --content: 1100px;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/22px var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-x: hidden; }
h1, h2, h3, h4 { margin: 0; font-weight: 400; }
p { margin: 0; }
a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
button, input, select, textarea { font: inherit; color: inherit; }
code { font-family: var(--mono); font-size: 12px; background: var(--panel-2); padding: 1px 6px; border-radius: 4px; color: var(--text); overflow-wrap: anywhere; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
::selection { background: rgba(228,242,34,.25); }
.mono { font-family: var(--mono); font-size: 12.5px; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* tones: one vocabulary for statuses, routes, results and actors */
.tone-green { --c: var(--green); --t: var(--green-tint); --l: var(--green-line); }
.tone-solar { --c: var(--solar-text); --t: var(--solar-tint); --l: var(--solar-line); }
.tone-blue { --c: var(--blue); --t: var(--blue-tint); --l: var(--blue-line); }
.tone-amber { --c: var(--amber); --t: var(--amber-tint); --l: var(--amber-line); }
.tone-red { --c: var(--red); --t: var(--red-tint); --l: var(--red-line); }
.tone-lilac { --c: var(--lilac); --t: var(--lilac-tint); --l: var(--lilac-line); }
.tone-neutral { --c: var(--text-2); --t: var(--panel-2); --l: var(--line-2); }
.tone-muted { --c: var(--text-3); --t: transparent; --l: var(--line-2); }

/* ================= shell (the console's frame) ================= */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 0 8px; }
.brand { display: flex; flex-direction: column; justify-content: center; height: 72px; padding: 0 10px; flex: none; }
.brand b { font: 600 17px/20px var(--sans); letter-spacing: -0.03em; color: var(--text-hi); }
.brand span { font: 400 11px/14px var(--sans); color: var(--text-3); margin-top: 2px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { position: relative; appearance: none; border: 0; background: none; display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 12px; border-radius: 5px; color: var(--text-2); cursor: pointer; text-align: left; width: 100%; font-size: 14px; transition: background var(--fast) var(--ease), color var(--fast) var(--ease); }
.nav-item svg.i { color: var(--text-3); }
.nav-item:hover { background: var(--hover); color: var(--text); }
.nav-item[aria-current="page"] { background: var(--sel); color: var(--text-hi); }
.nav-item[aria-current="page"] svg.i { color: var(--text); }
.nav-item .nl { flex: 1; white-space: nowrap; }
.nav-item .cnt { font: 500 11.5px/20px var(--sans); color: var(--text-3); min-width: 20px; text-align: right; font-variant-numeric: tabular-nums; }
.nav-item .cnt.hot { color: var(--solar-ink); background: var(--solar); padding: 0 7px; border-radius: 10px; text-align: center; }
.side-spacer { flex: 1; min-height: 24px; }
.side-foot { margin: 12px -8px 0; padding: 14px 18px 16px; border-top: 1px solid var(--line); }
.side-foot .v { font-size: 15px; line-height: 20px; color: var(--text-hi); }
.side-foot .k { color: var(--text-3); font-size: 12px; line-height: 17px; margin-top: 2px; }
.side-foot .meter { height: 4px; border-radius: 2px; background: var(--line); margin-top: 10px; overflow: hidden; }
.side-foot .meter i { display: block; height: 100%; background: var(--solar); border-radius: 2px; }
.main { min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 20; height: 52px; background: var(--bar); backdrop-filter: saturate(140%) blur(12px); -webkit-backdrop-filter: saturate(140%) blur(12px); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: calc(var(--content) + 112px); margin: 0 auto; height: 100%; padding: 0 56px; display: flex; align-items: center; gap: 12px; }
.repo-chip { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 0 1 auto; }
.repo-ic { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: var(--olive); color: var(--olive-ink); flex: none; }
.repo-ic svg.i { width: 14px; height: 14px; }
.repo-id { font: 500 13.5px/18px var(--mono); color: var(--text-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crumb { display: inline-flex; align-items: center; gap: 12px; color: var(--text-2); white-space: nowrap; }
.crumb::before { content: ""; width: 1px; height: 18px; background: var(--line-2); transform: skewX(-18deg); }
.topbar .sp { flex: 1; }
.topbar .meta { color: var(--text-3); font-size: 12.5px; white-space: nowrap; }
.status { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid var(--line-2); font-size: 12.5px; color: var(--text-2); white-space: nowrap; }
.status.live { color: var(--green); border-color: var(--green-line); background: var(--green-tint); }
.status.err { color: var(--red); border-color: var(--red-line); background: var(--red-tint); }
.dot { width: 6px; height: 6px; border-radius: 3px; background: currentColor; flex: none; }
.dot.ping { animation: ping 2.4s var(--ease) infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(75,200,118,.45); } 70%, 100% { box-shadow: 0 0 0 6px rgba(75,200,118,0); } }
.iconbtn { appearance: none; width: 32px; height: 32px; border-radius: 8px; border: 0; background: none; color: var(--text-2); display: grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn:hover { color: var(--text); background: var(--hover); }
.page { max-width: calc(var(--content) + 112px); margin: 0 auto; padding: 48px 56px 160px; }
.enter { animation: enter var(--med) var(--ease) both; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ================= page header ================= */
.ph { display: flex; align-items: flex-end; gap: 24px; margin-bottom: 36px; }
.ph-t { flex: 1; min-width: 0; }
.eyebrow { font: 500 11px/16px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.ph .eyebrow { margin-bottom: 12px; }
.ph h1 { font-size: 32px; line-height: 40px; letter-spacing: -0.02em; color: var(--text-hi); }
.ph .sub { color: var(--text-2); font-size: 16px; line-height: 24px; margin-top: 10px; max-width: 760px; }
.ph .sub b { color: var(--text); font-weight: 400; }
.ph-side { display: flex; gap: 8px; align-items: center; flex: none; }
.sec { margin-top: 56px; }
.sec-h { display: flex; align-items: baseline; gap: 10px 16px; margin-bottom: 16px; flex-wrap: wrap; }
.sec-h h2 { font-size: 20px; line-height: 28px; letter-spacing: -0.01em; color: var(--text-hi); }
.sec-h .n { color: var(--text-3); font-size: 13px; }
.sec-h .sp { flex: 1; }
.sec-h p { flex: 1 1 100%; color: var(--text-2); margin-top: -2px; }
.grp-h { display: flex; align-items: baseline; gap: 6px 12px; margin: 40px 0 14px; flex-wrap: wrap; }
.grp-h .eyebrow { color: var(--c, var(--text-2)); }
.grp-h p { color: var(--text-3); font-size: 13px; line-height: 20px; flex: 1 1 300px; min-width: 0; }
.panel { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); }
.empty { color: var(--text-2); padding: 24px; }
.empty b { color: var(--text); font-weight: 500; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--line-2); color: var(--text); margin-bottom: 20px; font-size: 13px; line-height: 20px; }
.banner svg.i { margin-top: 2px; color: var(--c, var(--text-3)); }
.banner .tx { flex: 1; min-width: 0; }
.banner .tx b { font-weight: 500; }
.banner.tone-amber, .banner.tone-red, .banner.tone-blue, .banner.tone-green { border-color: var(--l); background: var(--t); }
.banner ul { margin: 6px 0 0; padding-left: 18px; color: var(--text-2); }
.link { appearance: none; background: none; border: 0; padding: 0; color: var(--text-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 13px; transition: color var(--fast) var(--ease); }
.link svg.i { width: 14px; height: 14px; transition: transform var(--fast) var(--ease); }
.link:hover { color: var(--text); }
.link:hover svg.i { transform: translateX(2px); }
.ulink { appearance: none; background: none; border: 0; padding: 0; color: var(--text); cursor: pointer; font-size: 13px; text-decoration: underline; text-decoration-color: var(--line-3); text-underline-offset: 4px; white-space: nowrap; }
.ulink:hover { text-decoration-color: var(--text-2); }

/* ================= chips ================= */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 5px; font-size: 12px; line-height: 16px; white-space: nowrap; border: 1px solid var(--l, var(--line-2)); color: var(--c, var(--text-2)); background: var(--t, transparent); }
.chip svg.i { width: 12px; height: 12px; }
.chip.dash { border-style: dashed; }
.chip.rk { font-family: var(--mono); font-size: 11.5px; color: var(--text-2); }
.sc { display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 12px; line-height: 16px; color: var(--c); background: var(--t); border: 1px solid var(--l); white-space: nowrap; flex: none; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; display: inline-block; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.sdot { width: 8px; height: 8px; border-radius: 4px; background: var(--c); flex: none; display: inline-block; }
.sdot.o { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
.ic { width: 34px; height: 34px; border-radius: 7px; display: grid; place-items: center; background: var(--olive); color: var(--olive-ink); flex: none; }
.ic svg.i { width: 16px; height: 16px; }
.ic.t { background: var(--t); color: var(--c); }

/* ================= overview: headline + step cards ================= */
.hl h1 { font-size: 34px; line-height: 42px; }
.hl h1 .b { color: var(--text-3); }
.doors { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.door { appearance: none; text-align: left; color: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 16px; padding: 22px 22px 18px; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); min-width: 0; transition: border-color var(--fast) var(--ease), background var(--fast) var(--ease), transform var(--fast) var(--ease); }
.door:hover { border-color: var(--line-3); background: var(--raise); }
.door:active { transform: translateY(1px); }
.door-top { display: flex; align-items: center; gap: 12px; }
.door-top .t { min-width: 0; }
.door-top .eyebrow { font-size: 10.5px; line-height: 14px; }
.door-top h3 { font-size: 16px; line-height: 22px; color: var(--text-hi); margin-top: 1px; }
.door-big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.door-big .v { font-size: 40px; line-height: 44px; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: var(--text-hi); }
.door-big .v small { font-size: 18px; color: var(--text-3); margin-left: 2px; letter-spacing: 0; }
.door-big .u { color: var(--text-2); font-size: 14px; }
.door.hot { border-color: var(--solar-line); background: linear-gradient(180deg, var(--solar-tint), transparent 70%), var(--panel); }
.door.hot .door-big .v, .door.hot .door-top .eyebrow { color: var(--solar-text); }
.door-foot { display: flex; align-items: center; gap: 10px; margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); color: var(--text-3); font-size: 12.5px; line-height: 18px; }
.door-foot .sp { flex: 1; }
.door-foot .go { color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.door-foot .go svg.i { width: 14px; height: 14px; transition: transform var(--fast) var(--ease); }
.door:hover .door-foot .go { color: var(--text); }
.door:hover .door-foot .go svg.i { transform: translateX(3px); }
.mini { display: flex; flex-direction: column; gap: 6px; color: var(--text-2); font-size: 13px; line-height: 18px; }
.mini span { display: flex; align-items: center; gap: 8px; }
.mini b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; min-width: 14px; }
.lchips { display: flex; flex-wrap: wrap; gap: 6px; }
.lchips .chip { height: 26px; padding: 0 9px; background: var(--bg); }
.lchips .chip b { font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; }
.best { color: var(--text-2); font-size: 13px; line-height: 18px; min-width: 0; display: flex; gap: 8px; align-items: baseline; }
.best .v { font: 500 12.5px/18px var(--mono); color: var(--solar-text); white-space: nowrap; }
.best .k { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; color: var(--text-3); }
.segbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; }
.segbar i { display: block; height: 100%; background: var(--c); min-width: 4px; border-radius: 2px; transform-origin: left center; }
.enter .segbar i { animation: grow 520ms var(--ease) both; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.segbar i.o { background: repeating-linear-gradient(135deg, var(--c) 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1px var(--l); }
.segbar i.muted { background: repeating-linear-gradient(135deg, var(--line-2) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px var(--line-2); }
.segbar.lg { height: 10px; border-radius: 5px; }
.facts-line { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 24px; color: var(--text-3); font-size: 12.5px; line-height: 18px; }
.facts-line span { display: inline-flex; align-items: center; gap: 7px; }
.facts-line b { color: var(--text-2); font-weight: 400; }
.facts-line svg.i { width: 14px; height: 14px; }

/* start here: the top three, one line each */
.srow { appearance: none; width: 100%; background: none; border: 0; border-top: 1px solid var(--line); color: inherit; text-align: left; cursor: pointer; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto 16px; align-items: center; gap: 14px; padding: 14px 20px; transition: background var(--fast) var(--ease); }
.srow:first-child { border-top: 0; border-radius: var(--r) var(--r) 0 0; }
.srow:last-child { border-radius: 0 0 var(--r) var(--r); }
.srow:hover { background: var(--raise); }
.srow .rkn { width: 26px; height: 26px; border-radius: 13px; display: grid; place-items: center; font: 500 12px/16px var(--mono); color: var(--text-2); border: 1px solid var(--line-2); }
.srow:first-child .rkn { color: var(--solar-ink); background: var(--solar); border-color: var(--solar); }
.srow .tt { color: var(--text-hi); font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.srow .num { font: 500 12.5px/18px var(--mono); color: var(--solar-text); white-space: nowrap; }
.srow > svg.i { color: var(--text-3); width: 14px; height: 14px; transition: transform var(--fast) var(--ease); }
.srow:hover > svg.i { transform: translateX(2px); color: var(--text-2); }

/* traffic flow: each call, from its file to Router */
.flow { position: relative; padding: 28px; overflow: hidden; background-image: radial-gradient(var(--dotgrid) 1px, transparent 1px); background-size: 16px 16px; background-position: -8px -8px; }
.flow-grid { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(64px, .7fr) minmax(0, 1fr); align-items: center; }
.flow svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: visible; }
.wire { fill: none; stroke: var(--c, var(--green)); stroke-width: 1.5; stroke-dasharray: 4 6; stroke-linecap: round; opacity: .9; animation: flowdash 2.2s linear infinite; }
.wires.fresh .wire { animation: flowdash 2.2s linear infinite, wirein 600ms var(--ease) both; }
.wire.o { stroke-dasharray: 1 6; }
.wire.broken, .wires.fresh .wire.broken { stroke-dasharray: 3 5; animation: wirein 600ms var(--ease) both; }
.wire-x { fill: none; stroke: var(--c); stroke-width: 1.6; stroke-linecap: round; }
@keyframes flowdash { to { stroke-dashoffset: -20; } }
@keyframes wirein { from { opacity: 0; } to { opacity: .9; } }
.fcol { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.fgroup { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.fgroup-h { display: flex; align-items: baseline; gap: 8px; min-width: 0; font: 400 11.5px/16px var(--mono); color: var(--text-3); }
.fgroup-h .p { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fgroup-h .n { flex: none; }
.fnode { appearance: none; position: relative; display: flex; align-items: center; gap: 10px; width: 100%; min-width: 0; padding: 9px 12px; text-align: left; color: inherit; background: var(--bg); border: 1px solid var(--line-2); border-radius: 7px; cursor: pointer; transition: border-color var(--fast) var(--ease), background var(--fast) var(--ease); }
.fnode:hover { border-color: var(--l); background: var(--hover); }
.fnode .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.fnode .fn { font: 500 12.5px/18px var(--mono); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fnode .sub { color: var(--text-3); font-size: 12px; line-height: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fnode svg.go { width: 13px; height: 13px; color: var(--text-3); opacity: 0; transform: translateX(-3px); transition: opacity var(--fast) var(--ease), transform var(--fast) var(--ease); }
.fnode:hover svg.go, .fnode:focus-visible svg.go { opacity: 1; transform: none; }
.router-node { position: relative; min-width: 0; background: var(--bg); border: 1px solid var(--green-line); border-radius: 10px; padding: 20px; box-shadow: 0 0 0 5px var(--green-tint), 0 14px 32px -14px var(--shadow); }
.router-node .nm { display: flex; align-items: center; gap: 10px; font-size: 18px; line-height: 24px; color: var(--text-hi); }
.router-node .nm .ic { width: 28px; height: 28px; border-radius: 6px; }
.router-node .host { color: var(--text-3); margin-top: 10px; overflow-wrap: anywhere; }
.rchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.rchip { appearance: none; display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-width: 0; height: 26px; padding: 0 9px; border-radius: 5px; font-size: 12px; color: var(--c); background: var(--t); border: 1px solid var(--l); cursor: pointer; }
.rchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rchip svg.i { width: 13px; height: 13px; }
.flow-stay { position: relative; z-index: 1; margin-top: 24px; padding-top: 20px; border-top: 1px dashed var(--line-2); }
.stay-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin-top: 10px; }
.stay-grid .fnode { padding: 8px 10px; background: transparent; border-style: dashed; }
.flow .legend { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--text-2); font-size: 12.5px; line-height: 18px; }
.legend > span { display: inline-flex; align-items: center; gap: 8px; }
.legend b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
.legend svg { width: 22px; height: 8px; flex: none; }
.legend svg line { stroke: var(--c); stroke-width: 1.5; stroke-dasharray: 4 3; stroke-linecap: round; }
.legend svg.o line { stroke-dasharray: 1 3.5; }
.legend .box { width: 16px; height: 11px; border: 1px dashed var(--line-3); border-radius: 3px; flex: none; }
.flow-empty { color: var(--text-2); padding: 12px 0; }

/* ================= tables (Logs / Models) ================= */
.tblw { overflow: hidden; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; line-height: 20px; }
.tbl th { text-align: left; font-weight: 400; color: var(--text-2); font-size: 13px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
.tbl td { padding: 11px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl th + th, .tbl td + td { border-left: 1px solid var(--line); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr { scroll-margin-top: 96px; }
.tbl tr.flash td { animation: rowflash 1.6s var(--ease); }
@keyframes rowflash { 15% { background: var(--solar-tint); } }
.tbl .site { font-family: var(--mono); font-size: 12.5px; color: var(--text); overflow-wrap: anywhere; }
.tbl .sub { color: var(--text-3); font-size: 12px; line-height: 17px; margin-top: 1px; overflow-wrap: anywhere; }
.tbl .mdl { font-family: var(--mono); font-size: 12px; color: var(--text-2); overflow-wrap: anywhere; }
.tbl .r { text-align: right; }
.route { display: inline-flex; align-items: center; gap: 8px; color: var(--c); white-space: nowrap; }

/* ================= the item card (Routing-strategy card + v4 panels) ================= */
.card { position: relative; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 20px 22px 0; scroll-margin-top: 80px; transition: border-color var(--med) var(--ease), box-shadow var(--med) var(--ease); }
.card.flash { animation: flash 1.6s var(--ease); }
@keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(228,242,34,0); } 15% { box-shadow: 0 0 0 3px var(--solar-line); border-color: var(--solar-line); } 100% { box-shadow: 0 0 0 0 rgba(228,242,34,0); } }
.ih { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; }
.ih .t { min-width: 0; }
.ih h3 { font-size: 16px; line-height: 24px; color: var(--text-hi); overflow-wrap: anywhere; }
.ih .sum { color: var(--text-2); margin-top: 3px; max-width: 820px; }
.ih .rt { display: flex; gap: 8px; align-items: center; padding-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-top: 18px; }
.cols.two { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }
.blk { min-width: 0; }
.lbl { display: block; font: 500 10.5px/14px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }
.blk > .lbl { margin-bottom: 8px; }
/* code change: the diff, file by file */
.code { border: 1px solid var(--line); border-radius: 7px; background: var(--code); overflow: auto; max-height: 340px; scrollbar-width: thin; }
.cf + .cf { border-top: 1px solid var(--line); }
.code-h { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 12px 0 14px; background: var(--panel-2); border-bottom: 1px solid var(--line); font: 400 11.5px/16px var(--mono); }
.code-h .f { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); direction: rtl; text-align: left; }
.code-h .f bdi { direction: ltr; }
.plus { color: var(--green); }
.minus { color: var(--red); }
details.fold > summary { list-style: none; cursor: pointer; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary .code-h { position: static; border-bottom: 0; }
details.fold[open] > summary .code-h { border-bottom: 1px solid var(--line); }
details.fold > summary .tg { color: var(--text-3); font-family: var(--sans); font-size: 11.5px; }
details.fold > summary:hover .tg { color: var(--text); }
.code-b { padding: 8px 0; font: 400 12.5px/20px var(--mono); }
.cl { display: flex; padding-right: 12px; }
.cl .sg { width: 30px; flex: none; text-align: center; color: var(--text-3); user-select: none; }
.cl .tx { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; color: var(--text-2); }
.cl.add { background: var(--add); }
.cl.add .sg { color: var(--green); }
.cl.add .tx { color: var(--text); }
.cl.del { background: var(--del); }
.cl.del .sg { color: var(--red); }
.cl.del .tx { color: var(--text-3); }
.cl.hunk { height: 1px; margin: 7px 0; background: repeating-linear-gradient(90deg, var(--line-2) 0 4px, transparent 4px 8px); }
.sy-k { color: var(--syn-k); }
.sy-s { color: var(--syn-s); }
.sy-n { color: var(--syn-n); }
.sy-c { color: var(--syn-c); font-style: italic; }
.code-more { padding: 8px 14px; color: var(--text-3); font-size: 12px; border-top: 1px solid var(--line); }
/* measured: styled like "each request to Router" */
.mp { border: 1px solid var(--line); border-radius: 7px; background: var(--code); padding: 4px 0; }
.mr { padding: 10px 14px; border-top: 1px solid var(--line); }
.mr:first-child { border-top: 0; }
.mr .mk { color: var(--text-2); font-size: 12.5px; line-height: 18px; }
.mr .mv { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; font: 500 14px/22px var(--mono); font-variant-numeric: tabular-nums; }
.mr .mv .b { color: var(--text-3); font-weight: 400; }
.mr .mv .ar { color: var(--text-3); font-weight: 400; }
.mr .mv .a { color: var(--solar-text); }
.mr .mv .a.na { color: var(--text-3); font-weight: 400; font-family: var(--sans); font-size: 12.5px; }
.mr .mv .n { font: 400 11px/18px var(--mono); color: var(--text-3); border: 1px solid var(--line-2); border-radius: 3px; padding: 0 5px; }
.mr .mh { color: var(--text-3); font-size: 12px; line-height: 17px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* trade-off lines */
.lines { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.ln { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 20px; color: var(--text-2); max-width: 900px; }
.ln svg.i { margin-top: 2px; width: 15px; height: 15px; color: var(--c); }
.ln b { color: var(--text); font-weight: 500; }
.ln .tx { min-width: 0; overflow-wrap: anywhere; }
.where { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 5px 10px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); font-size: 12.5px; color: var(--text-2); }
.where .r { color: var(--text-hi); }
.where svg.i { width: 12px; height: 12px; color: var(--text-3); }
.note { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; padding: 10px 14px; border-radius: 7px; border: 1px solid var(--l, var(--line)); background: var(--t, transparent); font-size: 13px; line-height: 20px; color: var(--text-2); }
.note svg.i { color: var(--c, var(--text-3)); margin-top: 2px; width: 15px; height: 15px; }
.note .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.note b { color: var(--text); font-weight: 500; }
.note .meta { color: var(--text-3); }
.ifoot { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; margin: 18px -22px 0; padding: 12px 22px; border-top: 1px solid var(--line); }
.ifoot .sp { flex: 1; }
.ckl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.ck { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px; border-radius: 5px; font-size: 12px; color: var(--c); border: 1px solid var(--l); background: var(--t); white-space: nowrap; cursor: default; }
.ck svg.i { width: 12px; height: 12px; }
.ck.tone-muted { border-style: dashed; }
.ref { display: inline-flex; align-items: center; gap: 6px; color: var(--text-3); font: 400 12px/18px var(--mono); min-width: 0; max-width: 100%; }
.ref svg.i { width: 13px; height: 13px; }
.ref span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
details.more > summary { cursor: pointer; color: var(--text-2); font-size: 13px; list-style: none; display: inline-flex; align-items: center; gap: 6px; user-select: none; padding: 3px 0; transition: color var(--fast) var(--ease); }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary svg.i { width: 12px; height: 12px; transition: transform var(--med) var(--ease); }
details.more[open] > summary svg.i:first-child { transform: rotate(90deg); }
details.more > summary:hover { color: var(--text); }
details.more > summary .meta { color: var(--text-3); font-size: 12px; }
details.more[open] > .more-b { animation: reveal var(--med) var(--ease) both; }
@keyframes reveal { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
details.dtl { margin: 0 -22px; border-top: 1px solid var(--line); }
details.dtl > summary { padding: 10px 22px; width: 100%; color: var(--text-3); font-size: 12.5px; }
details.dtl > .more-b { padding: 2px 22px 20px; }
.kvs { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px 16px; font-size: 13px; line-height: 20px; color: var(--text-2); max-width: 920px; }
.kvs > dt { font: 500 10.5px/20px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }
.kvs > dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.kvs > dd.hi { color: var(--text); }
.evl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.ev { display: grid; grid-template-columns: 62px 172px minmax(0, 1fr) auto; gap: 0 10px; align-items: baseline; }
.ev .r { display: inline-flex; align-items: center; gap: 5px; font: 500 11px/20px var(--mono); color: var(--c); white-space: nowrap; }
.ev .r svg.i { width: 12px; height: 12px; align-self: center; }
.ev .k { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev .s { font: 500 9.5px/16px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); border: 1px solid var(--line-2); border-radius: 3px; padding: 0 5px; white-space: nowrap; }
.ev .s.agent { color: var(--lilac); border-color: var(--lilac-line); }
.cref { appearance: none; display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 22px; padding: 0 8px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); color: var(--text-2); font: 400 11.5px/16px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
button.cref:hover { color: var(--text); border-color: var(--line-3); }
span.cref { cursor: default; color: var(--text-3); border-style: dashed; }
.ilink { appearance: none; background: none; border: 0; padding: 0; display: inline-flex; align-items: baseline; gap: 7px; color: var(--text); cursor: pointer; text-align: left; font-size: inherit; line-height: inherit; max-width: 100%; }
.ilink .tt { text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; overflow-wrap: anywhere; }
.ilink:hover .tt { text-decoration-color: var(--text-2); }
.samples { margin-top: 8px; display: grid; gap: 6px; }
.sample { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; font-size: 12.5px; line-height: 19px; }
.sample > div { padding: 8px 10px; border-left: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
.sample > div:first-child { border-left: 0; }
.sample.diff > div:last-child { background: var(--amber-tint); }
.nodiff { color: var(--text-3); font-size: 12.5px; }

/* ================= review: level tiles + filters ================= */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { appearance: none; text-align: left; color: inherit; cursor: pointer; display: flex; gap: 14px; align-items: flex-start; padding: 18px 20px; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); min-width: 0; transition: border-color var(--fast) var(--ease), background var(--fast) var(--ease); }
.tile:hover { border-color: var(--line-3); }
.tile[aria-pressed="true"] { border-color: var(--solar-line); background: linear-gradient(180deg, var(--solar-tint), transparent 80%), var(--panel); }
.tile:disabled { cursor: default; opacity: .5; }
.tile .t { flex: 1; min-width: 0; }
.tile .nm { display: flex; align-items: baseline; gap: 8px; color: var(--text-hi); font-size: 15px; }
.tile .nm .c { margin-left: auto; font-size: 22px; line-height: 24px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.tile .hn { color: var(--text-3); font-size: 12.5px; line-height: 18px; margin-top: 2px; }
.tile .stt { margin-top: 10px; font-size: 12.5px; line-height: 18px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.tile .stt .w { color: var(--solar-text); }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 20px 0 4px; }
.fchip { appearance: none; display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--line-2); background: none; color: var(--text-2); cursor: pointer; font-size: 13px; transition: background var(--fast) var(--ease), color var(--fast) var(--ease), border-color var(--fast) var(--ease); }
.fchip:hover { color: var(--text); border-color: var(--line-3); }
.fchip[aria-pressed="true"] { background: var(--sel); color: var(--text-hi); border-color: var(--sel); }
.fchip .n { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.fchip svg.i { width: 14px; height: 14px; }

/* ================= your turn: decision rows ================= */
.drow { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 6px 14px; padding: 14px 18px; border-top: 1px solid var(--line); scroll-margin-top: 80px; }
.drow:first-child { border-top: 0; }
.drow.pend { grid-template-columns: 64px minmax(0, 1fr) auto; }
.drow .rkn { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; font: 500 11.5px/16px var(--mono); color: var(--text-2); background: var(--panel-2); }
.drow .tx { min-width: 0; }
.drow .ss { color: var(--text-3); font-size: 12.5px; line-height: 18px; margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.drow .ss .v { font: 500 12px/18px var(--mono); color: var(--solar-text); }
.drow .pa { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.drow .form { grid-column: 2 / -1; margin-top: 2px; }
.drow.flash { animation: rowflash 1.6s var(--ease); }
.atag { display: inline-flex; align-items: center; justify-content: center; min-width: 56px; height: 24px; padding: 0 8px; border-radius: 5px; font: 500 10.5px/14px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--c); background: var(--t); border: 1px solid var(--l); flex: none; }
.applybar { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding: 16px 18px; border-top: 1px solid var(--line); background: var(--raise); border-radius: 0 0 var(--r) var(--r); }
.applybar:first-child { border-top: 0; border-radius: var(--r); }
.applybar .tx { flex: 1 1 300px; min-width: 0; color: var(--text-2); font-size: 13px; line-height: 20px; }
.applybar .tx b { color: var(--text); font-weight: 500; }
.applybar .why { flex: 1 1 100%; color: var(--amber); font-size: 12.5px; line-height: 18px; display: flex; gap: 8px; align-items: flex-start; }
.applybar .why svg.i { width: 14px; height: 14px; margin-top: 2px; }
.term { margin: 0; padding: 14px 16px; font: 400 12px/19px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-2); max-height: 260px; overflow: auto; background: var(--code); border-top: 1px solid var(--line); border-radius: 0 0 var(--r) var(--r); }
.result-h { display: flex; align-items: center; gap: 12px; padding: 14px 18px; font-size: 13.5px; flex-wrap: wrap; }
.result-h .tx { flex: 1 1 260px; min-width: 0; }
.result-h .tx b { font-weight: 500; }
.copyv { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; height: 32px; padding: 0 4px 0 12px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--bg); font: 400 12.5px/18px var(--mono); color: var(--text); }
.copyv .cv { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.copyv .btn { height: 24px; padding: 0 8px; font-size: 11.5px; flex: none; }

/* buttons + forms (console: outline, 8px radius) */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; color: var(--text); cursor: pointer; white-space: nowrap; font-size: 13px; transition: background var(--fast) var(--ease), border-color var(--fast) var(--ease), transform var(--fast) var(--ease), opacity var(--fast) var(--ease); }
.btn svg.i { width: 14px; height: 14px; }
.btn:hover:not(:disabled) { border-color: var(--line-3); background: var(--hover); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn.primary { background: var(--solar); border-color: var(--solar); color: var(--solar-ink); font-weight: 500; }
.btn.primary:hover:not(:disabled) { background: var(--solar-hover); border-color: var(--solar-hover); }
.btn.ghost { border-color: transparent; color: var(--text-2); padding: 0 10px; }
.btn.ghost:hover:not(:disabled) { color: var(--text); background: var(--hover); border-color: transparent; }
.btn.warn { color: var(--amber); border-color: var(--amber-line); }
.btn.lg { height: 40px; padding: 0 18px; font-size: 14px; }
a.btn { text-decoration: none; }
.form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; width: 100%; animation: enter var(--med) var(--ease) both; }
.ifoot .form { margin-top: 2px; }
.form input { height: 32px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--bg); padding: 0 10px; flex: 1 1 240px; min-width: 0; max-width: 460px; }
.form input[type=date] { flex: 0 1 180px; }
.form input:focus { outline: none; border-color: var(--solar-line); }
.form .hint { color: var(--text-3); font-size: 12.5px; flex: 1 1 100%; }

/* history */
.sess { overflow: hidden; }
.sess-h { display: flex; align-items: center; gap: 12px 14px; padding: 16px 20px; flex-wrap: wrap; }
.sid { width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center; background: var(--panel-2); font: 500 12.5px/16px var(--mono); color: var(--text); flex: none; }
.sess-h .tx { flex: 1 1 220px; min-width: 0; }
.sess-h .tx b { font-weight: 400; font-size: 15px; color: var(--text-hi); }
.sess-h .tx .mt { display: block; color: var(--text-3); font-size: 12.5px; line-height: 18px; margin-top: 2px; }
.sess-sum { padding: 0 20px 16px; color: var(--text-2); max-width: 900px; }
.rrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; padding: 12px 20px; border-top: 1px solid var(--line); align-items: start; }
.rrow .tx { min-width: 0; }
.rrow .nt { color: var(--text-2); font-size: 13px; line-height: 20px; margin-top: 3px; overflow-wrap: anywhere; }
.rrow .cm { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.rrow .rt { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.sess-ck { padding: 14px 20px 16px; border-top: 1px solid var(--line); background: var(--raise); }
.sess-ck .lbl { margin-bottom: 8px; }

/* setup */
.prog { display: flex; align-items: center; gap: 12px; }
.prog-bar { display: flex; gap: 4px; }
.prog-bar i { width: 22px; height: 5px; border-radius: 3px; background: var(--line); }
.prog-bar i.on { background: var(--solar); }
.prog .tx { color: var(--text-2); font-size: 13px; white-space: nowrap; }
.prog .tx b { color: var(--text); font-weight: 500; }

.s-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

.sticky { position: fixed; left: var(--side-w); right: 0; bottom: 0; z-index: 30; background: var(--sticky); backdrop-filter: saturate(140%) blur(10px); -webkit-backdrop-filter: saturate(140%) blur(10px); border-top: 1px solid var(--line); }
.sticky.in { animation: up 320ms var(--ease) both; }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
.sticky-in { max-width: calc(var(--content) + 112px); margin: 0 auto; padding: 12px 56px; display: flex; align-items: center; gap: 12px 16px; }
.sticky-in .tx { flex: 1 1 200px; color: var(--text-2); min-width: 0; }
.sticky-in .tx b { color: var(--text); font-weight: 500; }
#toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 40; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
.toast { display: flex; align-items: center; gap: 10px; background: var(--text-hi); color: var(--bg); border-radius: 8px; padding: 10px 16px; font-size: 13px; box-shadow: 0 10px 30px var(--shadow); animation: toastin 260ms var(--ease) both; }

      var note = it ? (it.status === "done" ? "Marked done" : it.status === "your step" ? (LIVE ? "Mark it done once it’s on" : "") : "") : d ? "Done (remembered in this browser only)" : "Tick the circle once it’s set";
      return '<article class="card scard' + (d ? " done" : "") + '"' + (it ? ' id="step-' + esc(it.id) + '"' : "") + '><div class="s-rail"><span class="s-num">' + (n < 10 ? "0" : "") + n + "</span>" + check + "</div>" +
        '<div class="s-body"><div class="s-head"><h3>' + esc(s.title) + '</h3><span class="chip ' + tone(s.prio[1]) + '">' + esc(s.prio[0]) + "</span>" + (it ? statusChip(it) : "") + "</div>" + (s.lead ? '<p class="s-lead">' + esc(s.lead) + "</p>" : "") +
        (s.where ? '<div class="s-block">' + whereHtml(s.where) + "</div>" : "") + (s.body || "") + (it ? requestNote(it) : "") +
        '<div class="s-foot">' + (note ? '<span class="nt">' + esc(note) + "</span>" : "") + '<span class="sp"></span>' + (link ? '<a class="btn" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">Open Router ' + icon("ext") + "</a>" : "") +
        (it ? actionsHtml(it) : "") + (it ? formHtml(it) : "") + "</div></div></article>";
    }
    h.push('<div class="stack">' + fixed.map(step).join("") + "</div>");
    h.push('<section class="sec"><div class="sec-h"><h2>Recommended for this app</h2><span class="n">' + sets.length + "</span><p>Router settings the review recommends, most valuable first. Switch each one on in Router, then mark it done here. These don’t go through Apply.</p></div>" +
      (sets.length ? '<div class="stack">' + sets.map(function (s, k) { return step(s, fixed.length + k); }).join("") + "</div>" : '<div class="panel empty">No Router settings recommended for this app.</div>') + "</section>");
    return h.join("");
  }

  // ---------------- render ----------------
  var RENDER = {overview: renderOverview, migrate: renderMigrate, review: renderReview, queue: renderQueue, history: renderHistory, setup: renderSetup};
  function renderAll(enter) {
    S.pending = false;
    renderSide(); renderTop();
    var main = document.getElementById("main");
    if (!B || (!B.has_report && !arr(B.report_errors).length)) {
      main.innerHTML = '<div class="' + (enter ? "enter" : "") + '">' + (B ? banners(false) : "") + header("router-migrate", "No migration report yet", "This page shows the agent’s report, <code>.router-migrate/MIGRATION.json</code>, after <code>router-migrate finish</code> has checked it. Run the migration first; this page fills in when the report is ready.") + "</div>";
      document.getElementById("sticky").innerHTML = ""; return;
    }
    var fn = RENDER[S.tab] || renderOverview;
    var y = window.scrollY;
    main.innerHTML = '<div class="' + (enter ? "enter" : "") + '">' + fn() + "</div>";
    if (!enter) window.scrollTo(0, y);
    renderSticky();
    var wires = document.getElementById("wires");
    if (wires) { if (enter) wires.classList.add("fresh"); flowSig = ""; requestAnimationFrame(drawFlow); }
  }
  function tabOf(t) { t = ALIAS[t] || t; return PAGES.concat(MORE).some(function (x) { return x[0] === t; }) ? t : "overview"; }
  function setTab(t, push) {
    t = tabOf(t);
    var changed = t !== S.tab; S.tab = t;
    if (push && location.hash !== "#" + t) { try { history.replaceState(null, "", location.pathname + location.search + "#" + t); } catch (e) {} }
    renderAll(changed);
    if (changed) window.scrollTo(0, 0);
  }
  function goTo(id) {
    var el = document.getElementById(id); if (!el) return;
    var bar = document.getElementById("topbar"), off = (bar ? bar.getBoundingClientRect().bottom : 0) + 20;
    window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - off, behavior: "smooth"});
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  }
  function go(tab, id) { setTab(tab, true); if (id) requestAnimationFrame(function () { requestAnimationFrame(function () { goTo(id); }); }); }
  function homeOf(it) { return it && (it.kind === "recommendation" || it.kind === "note") ? "review" : "migrate"; }

  // ---------------- events ----------------
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-tab],[data-act],[data-go-call],[data-go-item]");
    if (!t) return;
    if (t.hasAttribute("data-go-call")) { go("migrate", "call-" + callIndex(t.getAttribute("data-go-call"))); return; }
    if (t.hasAttribute("data-go-item")) {
      var gid = t.getAttribute("data-go-item"), it = byId(gid), here = document.getElementById("item-" + gid);
      if (here && !t.closest("#item-" + cssId(gid))) { if (it && it.kind === "note") { S.open.notes = true; var dn = here.closest("details"); if (dn) dn.open = true; } goTo("item-" + gid); return; }
      S.fl = "all"; S.fa = "all"; if (it && it.kind === "note") S.open.notes = true;
      go(homeOf(it), "item-" + gid); return;
    }
    if (t.hasAttribute("data-tab") && !t.hasAttribute("data-act")) { go(t.getAttribute("data-tab")); return; }
    var a = t.getAttribute("data-act"), id = t.getAttribute("data-id");
    if (a === "filter") {
      var fk = t.getAttribute("data-f"), fv = t.getAttribute("data-v");
      if (fk === "l") { S.fl = S.fl === fv ? "all" : fv; S.fa = "all"; } else S.fa = fv;
      renderAll(false);
    }
    else if (a === "approve") request(id, "apply");
    else if (a === "done") request(id, "done");
    else if (a === "withdraw") withdraw(id);
    else if (a === "apply") doApply();
    else if (a === "close-result") { S.applyResult = null; if (B) delete B.launch; renderAll(false); }
    else if (a && a.indexOf("form-") === 0 && a !== "form-cancel") {
      var k = a.slice(5), cur = S.form[id];
      if (cur && cur.k === k) delete S.form[id]; else S.form[id] = {k: k, v: k === "postpone" ? plusDays(14) : ""};
      renderAll(false);
      var inp = document.querySelector('[data-form="' + cssId(id) + '"]'); if (inp) inp.focus({preventScroll: true});
    }
    else if (a === "form-cancel") { delete S.form[id]; renderAll(false); }
    else if (a === "confirm") {
      var f = S.form[id]; if (!f) return; var v = String(f.v || "").trim();
      if (f.k === "postpone") { if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { toast("Pick a date", true); return; } request(id, "postpone", {until: v}); }
      else request(id, f.k, {reason: v});
    }
    else if (a === "setup-done") { var s = setupSteps().filter(function (x) { return x.id === id; })[0]; if (s) { store(setupKey(s), setupDone(s) ? null : "1"); renderAll(false); } }
    else if (a === "copy") {
      var val = t.getAttribute("data-v"), ok = function () { var old = t.textContent; t.textContent = "Copied"; setTimeout(function () { t.textContent = old; }, 1200); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(val).then(ok, function () { toast("Copy failed", true); }); else toast(val);
    }
  });
  document.addEventListener("toggle", function (e) {
    var d = e.target; if (d.tagName !== "DETAILS" || !d.hasAttribute("data-key")) return;
    S.open[d.getAttribute("data-key")] = d.open;
    var tg = d.classList.contains("fold") && d.querySelector("summary .tg:last-child"); if (tg) tg.textContent = d.open ? "Hide" : "Show";
  }, true);
  document.addEventListener("input", function (e) { var t = e.target; if (t.hasAttribute && t.hasAttribute("data-form")) { var f = S.form[t.getAttribute("data-form")]; if (f) f.v = t.value; } });
  document.addEventListener("keydown", function (e) {
    var t = e.target; if (!t.hasAttribute || !t.hasAttribute("data-form")) return;
    if (e.key === "Enter") { var b = t.parentNode.querySelector('[data-act="confirm"]'); if (b) b.click(); }
    if (e.key === "Escape") { delete S.form[t.getAttribute("data-form")]; renderAll(false); }
  });
  document.addEventListener("focusout", function () { setTimeout(function () { if (S.pending) { var ae = document.activeElement; if (!ae || !/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) renderAll(false); } }, 0); });
  var rz; window.addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(drawFlow, 100); });
  window.addEventListener("hashchange", function () { var h = location.hash.replace(/^#/, ""); if (h && tabOf(h) !== S.tab) setTab(h, false); });

  // ---------------- boot ----------------

  S.tab = tabOf(location.hash.replace(/^#/, "") || "overview");
  S.sig = sigOf(B);
  renderAll(true);
  if (LIVE) {
    refresh(false);
    setInterval(function () { if (document.visibilityState !== "hidden") refresh(false); }, 2000);
    document.addEventListener("visibilitychange", function () { if (document.visibilityState !== "hidden") refresh(false); });
  }
})();
</script>
</body>
